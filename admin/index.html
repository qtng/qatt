<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/site.css">
  <script src="../js/navigation.js"></script>
  <script src="../vendor/supabase/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/login.js"></script>
  <script src="admin.js"></script>
  <style>
    body { background: #f7efdc; color: #2b2118; }
    h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
    a { color: #a8362a; }
    .note { color: #7b6c58; font-size: .9rem; }
    .head { display: flex; align-items: baseline; flex-wrap: wrap; gap: .25rem 1rem; margin-bottom: 1.25rem; }
    .head h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.4rem); }
    .head .note { margin: 0; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); align-items: start; }
    .sect { background: #fffdf8; border: 1px solid #dccfb2; border-radius: .9rem; padding: 1rem 1rem .6rem; }
    .sect h2 { font-size: 1.15rem; margin: 0 0 .1rem; display: flex; align-items: center; gap: .5rem; }
    .sect h2 .bi { background: #ffe600; color: #111; border: 2px solid #111; border-radius: .5rem; width: 2rem; height: 2rem; display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; flex: none; }
    .sect > .note { margin: 0 0 .6rem 2.5rem; }
    .tile { display: block; text-decoration: none; color: inherit; border: 1px solid #e6dbc2; border-radius: .6rem; padding: .5rem .75rem; margin-bottom: .45rem; background: #fff; }
    .tile:hover, .tile:focus-visible { border-color: #111; background: #fff9c4; }
    .tile b { color: #2b2118; }
    .tile small { display: block; color: #7b6c58; line-height: 1.25; }
    .tile .ext { float: right; color: #a89877; font-size: .8rem; }
    details.files { margin-top: 1.25rem; background: #fffdf8; border: 1px solid #dccfb2; border-radius: .9rem; padding: .75rem 1rem; }
    details.files summary { cursor: pointer; font-family: Georgia, "Times New Roman", serif; font-size: 1.15rem; }
    details.files h3 { font-size: .8rem; margin: 1rem 0 .35rem; color: #7b6c58; text-transform: uppercase; letter-spacing: .08em; }
    .chips { display: flex; flex-wrap: wrap; gap: .3rem; }
    .chips a { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; text-decoration: none; border: 1px solid #e6dbc2; background: #fff; border-radius: .4rem; padding: .1rem .45rem; }
    .chips a:hover { border-color: #111; background: #fff9c4; }
  </style>
</head>
<body>
<main class="container py-4" style="max-width: 70rem">
  <div class="head">
    <h1 id="adminTitle" hidden>Admin</h1>
    <p class="note" id="account" hidden></p>
    <p class="note" id="denied" hidden>This account has no admin rights. Sign out and sign in with an admin account.</p>
  </div>

  <div id="area" hidden>
    <div class="grid" id="sections"></div>

    <details class="files">
      <summary>Scripts and stylesheets</summary>
      <p class="note mt-2 mb-0">Open a file and reload it (Ctrl+Shift+R) to refresh it in the browser cache.</p>
      <div id="files"></div>
    </details>
  </div>
</main>
<script>
  // what the page shows: [title, icon, short text, [name, address, text]]; addresses with a domain open the other site
  const SECTIONS = [
    ['Numbers and data', 'bi-bar-chart-line', 'What the sites and the functions do', [
      ['Statistics', 'stats.html', 'sign-ups, translator, decks, practice'],
      ['Accounts', 'users.html', 'all accounts with name, e-mail, site and use'],
      ['Translator data', 'translator.html', 'languages, gaps of the dictionary (with context)'],
      ['AI models', 'models.html', 'Gemini: tries, quota and overload, speed and quality per model'],
    ]],
    ['Fonts and symbols', 'bi-fonts', 'The tools of the QATT fonts', [
      ['Glyph editor', 'view.html?f=fonts&p=admin/glyph-editor.html', 'the letters as open paths, for all KAGE fonts'],
      ['Build process', 'view.html?f=fonts&p=admin/build.html', 'how the fonts are built and what the build numbers do'],
      ['Code table', 'view.html?f=fonts&p=admin/codetable.html', 'reference font: all 164 characters of the draft block'],
      ['Tone offsets', 'view.html?f=fonts&p=admin/tone-offsets.html', 'the place of the small tone marks per letter'],
      ['Private pages', 'view.html', 'all pages that the viewer can show'],
      ['Sprites', 'decoding.html', 'QATT sprites overview'],
      ['Rhymes', 'rhymes.html', 'QATT sprites overview with the data of Supabase'],
    ]],
    ['Content', 'bi-collection-play', 'Pages that people see', [
      ['Slides', 'admin-slides.html', 'manage the slides'],
      ['Published decks', 'decks.html', 'all published decks of Chunom; make a deck official (chunom.org)'],
      ['Chữ Nôm → Quốc Ngữ (draft)', 'https://chunom.org/chunom/translate_nom.html', 'the way back of the translator: the reading of Chữ Nôm text; linked only here until it is ready'],
    ]],
    ['Not linked anywhere else', 'bi-link-45deg', 'Pages that no menu leads to; for reviewing what can be removed', [
      ['Intro', '../intro.html', 'Quốc Âm Tân Tự – intro'],
      ['Thiên calligraphy', '../vandao/index.html', 'vandao/, with two PDFs'],
      ['TĐCNTD 2009', 'https://chunom.org/chunom/dict/tdcntd.html', 'dictionary, deliberately not linked: the pages are not in chunom-assets yet (chunom.org)'],
      ['Chữ Nôm bookshelf', 'https://chunom.org/pages/shelf/', 'Chữ Nôm texts with their Quốc Ngữ transcription, line by line. Part of the text corpus of Chunom.org'],
    ]],
  ];

  const THEMES = 'classic retro popart editorial swiss glass clay boho pixel vector neobrutal vietnam future'.split(' ');
  const CH = 'https://chunom.org/chunom/';
  const FILES = [
    ['JavaScript, qatt.org', 'fonts login navigation parser qatt-text qatt supabase kage-engine.min'.split(' ').map(n => ['js/' + n + '.js', '../js/' + n + '.js'])],
    ['JavaScript, chunom.org', [['js/detail.js', 'js/detail.js'], ['js/ime.js', 'js/ime.js'], ['js/ipa.js', 'js/ipa.js'], ['js/practice.js', 'js/practice.js'], ['dict/viewer.js', 'dict/viewer.js'], ['dict/collate.js', 'dict/collate.js'], ['dict/dictionaries.js', 'dict/dictionaries.js'], ['decks/audiomanager.js', 'decks/audiomanager.js'], ['decks/deck-cover.js', 'decks/deck-cover.js']].map(([n, p]) => [n, CH + p])],
    ['CSS, qatt.org', [['css/site.css', '../css/site.css']].concat(THEMES.map(t => ['css/theme-' + t + '.css', '../css/theme-' + t + '.css']))],
    ['CSS, chunom.org', [['css/practice.css', CH + 'css/practice.css'], ['dict/dict.css', CH + 'dict/dict.css']]],
    ['Libraries (vendor/)', [['bootstrap.bundle.min.js', '../vendor/bootstrap/js/bootstrap.bundle.min.js'], ['supabase.min.js', '../vendor/supabase/supabase.min.js'], ['bootstrap.min.css', '../vendor/bootstrap/css/bootstrap.min.css'], ['bootstrap-icons.min.css', '../vendor/bootstrap-icons/bootstrap-icons.min.css']]],
  ];

  const el = (tag, attrs = {}, ...kids) => { const e = Object.assign(document.createElement(tag), attrs); e.append(...kids); return e; };

  const isPrivate = href => /^view\.html/.test(href);
  function build(owner) {
  document.getElementById('sections').replaceChildren(...SECTIONS.map(([title, icon, text, tiles]) => el('section', { className: 'sect' },
    el('h2', {}, el('i', { className: 'bi ' + icon }), title),
    el('p', { className: 'note', textContent: text }),
    ...tiles.filter(t => owner || !isPrivate(t[1])).map(([name, href, desc]) => el('a', { className: 'tile', href },
      /^https?:/.test(href) ? el('i', { className: 'bi bi-box-arrow-up-right ext' }) : '',
      isPrivate(href) ? el('i', { className: 'bi bi-shield-lock-fill ext', title: 'Private page: kept in the private repository, shown to the owner only' }) : '',
      el('b', { textContent: name }), el('small', { textContent: desc }))))));
  }
  build(false);

  document.getElementById('files').append(...FILES.flatMap(([title, files]) => [
    el('h3', { textContent: title }),
    el('div', { className: 'chips' }, ...files.map(([name, href]) => el('a', { href, textContent: name }))),
  ]));

  window.addEventListener('DOMContentLoaded', async () => {
    const sp = new SupabaseService();
    await sp.init();
    QattLogin.status(sp, document.getElementById('account'), '[Sign in] with your admin account.', '[Đăng nhập] bằng tài khoản quản trị.');
    const state = await Admin.check(sp);
    // an admin sees everything, somebody not signed in only the line with the sign-in link, a signed-in non-admin the account line (to sign out) and a note
    const admin = state === 'admin';
    if (admin) build(await Admin.owner(sp));
    document.getElementById('area').hidden = !admin;
    document.getElementById('adminTitle').hidden = !admin;
    document.getElementById('account').hidden = false;
    document.getElementById('denied').hidden = state !== 'denied';
  });
</script>
</body>
</html>

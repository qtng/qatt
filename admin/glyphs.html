                const upperKey = upperKeys.find(k => splitName(k).base === name);
                if (isUpperName(name) && upperKey) {
                    combos = lowerKeys.map(l => ({ label: name + l, upper: live ? null : upperKey, lower: l }));
                } else if (/^[a-z]+$/.test(name) && this.savedGlyphs[name]) {
                    combos = upperKeys.map(u => ({ label: splitName(u).base + name, upper: u, lower: live ? null : name }));
                }
                box.classList.toggle('d-none', combos.length === 0);

                // DOM nur neu bauen, wenn sich die Liste ändert; sonst nur neu zeichnen (auch beim Ziehen)
                const listKey = combos.map(c => c.label).join(',');
                if (listKey !== this.previewKey) {
                    this.previewKey = listKey;
                    box.innerHTML = '';
                    this.previewCanvases = combos.map(c => {
                        const tile = document.createElement('div');
                        tile.className = 'text-center flex-shrink-0 p-1';
                        const can = document.createElement('canvas');
                        can.width = 96;
                        can.height = 96;
                        can.className = 'd-block bg-white border rounded';
                        can.style.width = '48px';
                        const label = document.createElement('span');
                        label.className = 'small font-monospace';
                        label.textContent = c.label;
                        tile.append(can, label);
                        box.appendChild(tile);
                        return can;
                    });
                }

                combos.forEach((c, i) => {
                    const ctx = this.previewCanvases[i].getContext('2d');
                    this.previewTransform(ctx, 96);
                    ctx.clearRect(-GRID, -GRID, 3 * GRID, 3 * GRID);
                    ctx.lineCap = this.lineCap;
                    ctx.lineJoin = 'round';
                    const { width, offset, corner } = c.upper ? splitName(c.upper) : { width: this.glyphWidth, offset: this.offset, corner: this.corner };
                    const canvasGlyph = this.strokes.filter(s => s.layer !== 'marks');
                    const upperStrokes = c.upper ? glyphPart(this.savedGlyphs[c.upper]) : canvasGlyph;
                    const lowerStrokes = c.lower ? glyphPart(this.savedGlyphs[c.lower]) : canvasGlyph;
                    this.drawInBox(ctx, upperStrokes, 0, 0, width, GRID, false, 0, false);
                    // Die andere Komponente ist eine 200x200-Glyphe in der Box zwischen den zwei Ecken: unten links (X/Y) und
                    // oben rechts. Ist die Box leer, wird nichts gezeichnet (keine Spiegelung).
                    const box = cornerBox(offset, corner);
                    if (box) this.drawInBox(ctx, lowerStrokes, box[0], box[1], box[2] - box[0], box[3] - box[1], false, 0, false);
                });
            }

            updateOutput() {
                this.output.value = withoutLayers(this.strokes).map(strokeToKage).join('\n'); // so wie gespeichert
                this.outputDirty = false;
                document.getElementById('kageApplyBtn').classList.replace('btn-success', 'btn-outline-success');
            }

            // Die Zeilen des Feldes als Striche übernehmen (Name, Breite und Versatz der geladenen Glyphe bleiben); hat sie 9 oder mehr Teile,
            // sind die letzten 6 die Marks. Zeilen, die keine Striche ergeben (Kommentare, zu kurz), werden gemeldet.
            applyKageText() {
                const text = this.output.value;
                const lines = text.split(/[\n\r$]+/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
                const strokes = kageToStrokes(lines.join('\n'));
                if (!strokes.length) { this.showToast('Keine gültigen KAGE-Zeilen im Feld.'); return; }
                const skipped = lines.length - strokes.length;
                const refs = strokes.filter(st => st.type === 99 && !this.savedGlyphs[st.refName]).map(st => st.refName);
                this.strokes = withLayers(strokes);
                this.selectedStrokeIdx = null;
                this.selectedPointIdx = null;
                this.resetToAddOrEdit();
                this.updateOutput();
                this.updateEditInfo();
                this.render();
                const marks = hasMarks(strokes) ? ` (davon ${MARK_COUNT} Marks)` : '';
                this.showToast(`${strokes.length} Striche übernommen${marks}` + (skipped > 0 ? `, ${skipped} Zeile(n) übersprungen` : '') +
                    (refs.length ? `; unbekannte Komponente: ${[...new Set(refs)].join(', ')}` : '') + '. Zum Sichern „Speichern“.');
            }

            showToast(msg) {
                const toast = document.getElementById('toastMsg');
                if (msg) toast.innerText = msg;
                toast.classList.remove('opacity-0');
                clearTimeout(this.toastTimeout);
                this.toastTimeout = setTimeout(() => toast.classList.add('opacity-0'), 3500);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new KageEditor();
        });
    </script>
</body>
</html>

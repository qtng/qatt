<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QATT Glyphs Creator</title>
    <script src="../js/navigation.js"></script>
    <link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/site.css" rel="stylesheet">
    <style>
        /* Verhindert Text-Markierung beim schnellen Klicken auf die Steuerungs-Buttons */
        .no-select { user-select: none; }
        #kageCanvas { width: min(520px, 100%); aspect-ratio: 1; cursor: crosshair; }
        /* gespeicherte Glyphen: gleich breite Kacheln, schlichter Rahmen mit einer Rundung, weiße Fläche, der Name darf umbrechen */
        .glyph-tile { position: relative; width: 76px; }
        .glyph-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; padding: 4px; border: 1px solid var(--bs-border-color); border-radius: 8px;
                     background: var(--bs-secondary-bg); color: var(--bs-body-color); white-space: normal; text-align: center; }
        .glyph-btn:hover { border-color: var(--bs-primary); }
        .glyph-btn canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 4px; background: #fff; }
        /* Kombinationen als Schriftprobe: quadratische Zeichen ohne Rand und Abstand, in Zeilen wie Fließtext */
        #comboFlow { display: flex; flex-wrap: wrap; align-content: flex-start; }
        #comboFlow canvas { display: block; width: 32px; height: 32px; cursor: pointer; }
        .glyph-btn .glyph-name { max-width: 100%; font-size: .72rem; line-height: 1.15; overflow-wrap: anywhere; }
    </style>
</head>
<body class="bg-body-tertiary">

    <!-- Toast ist fixiert oben rechts und schwebt über allem -->
    <div id="toastMsg" class="position-fixed top-0 end-0 m-3 opacity-0 bg-dark text-white px-4 py-2 rounded shadow small fw-bold pe-none"
         style="z-index: 1090; transition: opacity .3s;">
        Aktion erfolgreich!
    </div>

    <div class="container-xl py-3" style="max-width: 1200px;">
        <h1 class="h5 fw-bold mb-3">KAGE Editor</h1>

        <div class="row g-3">

            <!-- Editor: Werkzeuge direkt am Canvas (auf dem Handy zuerst) -->
            <div class="col-lg-auto">
                <div class="card shadow-sm no-select">
                    <!-- Vorschau der Kombinationen; width 0 + min-width 100 %, damit die Leiste die Spalte nicht verbreitert -->
                    <div id="comboPreview" class="card-header d-none d-flex gap-2 overflow-auto py-2" style="width: 0; min-width: 100%;"></div>

                    <div class="card-body p-2 text-center">
                        <canvas id="kageCanvas" width="600" height="600" class="border bg-white d-block mx-auto"></canvas>
                    </div>

                    <!-- Toolbar: Handy = Fadenkreuz über den Buttons, Desktop = Buttons links, Fadenkreuz rechts -->
                    <div id="editTools" class="card-footer d-flex flex-column-reverse flex-lg-row align-items-center gap-2 py-2">
                        <div class="d-flex flex-column gap-2 align-self-stretch justify-content-center flex-grow-1">
                            <!-- Ebene: nur ihre Striche sind bearbeitbar, die der anderen gedämpft (Einrasten an allen) -->
                            <div class="d-flex align-items-center gap-2">
                                <div id="layerTools" class="btn-group btn-group-sm" role="group" aria-label="Ebene">
                                    <button type="button" class="layer-btn btn btn-primary" data-layer="glyph" aria-pressed="true">Glyph</button>
                                    <button type="button" class="layer-btn btn btn-outline-primary" data-layer="marks" aria-pressed="false" title="Die 6 Markierungen der markierten Formen">Marks <span id="marksCount" class="font-monospace">0/6</span></button>
                                </div>
                                <span class="small text-body-secondary">Ebene</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <div id="drawTools" class="btn-group btn-group-sm" role="group" aria-label="Element hinzufügen">
                                    <button class="btn btn-outline-primary tool-add-btn" data-tool="1">+ Linie</button>
                                    <button class="btn btn-outline-primary tool-add-btn" data-tool="2">+ Kurve</button>
                                    <button class="btn btn-outline-primary tool-add-btn" data-tool="99">+ Komponente</button>
                                </div>
                                <button id="clearBtn" class="btn btn-sm btn-outline-danger ms-auto" title="Alle Striche der aktuellen Ebene entfernen">Leeren</button>
                            </div>
                            <div class="d-flex align-items-center gap-2" style="min-height: 31px;">
                                <span id="editInfo" class="small text-body-secondary me-auto">Nichts ausgewählt</span>
                                <button id="resolveBtn" class="d-none btn btn-sm btn-warning">Auflösen</button>
                                <button id="deleteStrokeBtn" class="d-none btn btn-sm btn-outline-danger" title="Ausgewählte Form entfernen (Entf)">Entfernen</button>
                            </div>
                        </div>
                        <div class="d-grid gap-1" style="grid-template-columns: repeat(3, 2.25rem);" role="group" aria-label="Auswahl verschieben">
                            <div></div>
                            <button class="dpad-btn btn btn-sm btn-light border" data-dx="0" data-dy="-1" aria-label="Hoch">▲</button>
                            <div></div>
                            <button class="dpad-btn btn btn-sm btn-light border" data-dx="-1" data-dy="0" aria-label="Links">◀</button>
                            <button class="dpad-btn btn btn-sm btn-light border" data-dx="0" data-dy="1" aria-label="Runter">▼</button>
                            <button class="dpad-btn btn btn-sm btn-light border" data-dx="1" data-dy="0" aria-label="Rechts">▶</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Daten: Speichern & Glyphen am Canvas, Import und Ausgabe darunter -->
            <div class="col-lg order-lg-first d-flex flex-column gap-3">
                <div class="card shadow-sm">
                    <div class="card-body d-flex flex-column gap-2 p-2">
                        <div class="input-group input-group-sm">
                            <input type="text" id="saveCodeInput" class="form-control font-monospace" placeholder="Code, z.B. U+1234 oder part_a" aria-label="Glyphen-Code">
                            <button id="saveGlyphBtn" class="btn btn-success">Speichern</button>
                        </div>
                        <div class="input-group input-group-sm">
                            <input type="text" id="gwInput" class="form-control font-monospace" placeholder="GlyphWiki-ID, z.B. u5b57" aria-label="GlyphWiki-ID">
                            <button id="importGwBtn" class="btn btn-outline-primary">Importieren</button>
                        </div>
                        <label for="lineWidthSlider" class="d-flex align-items-center gap-2 small mb-0 px-1">
                            <span class="flex-shrink-0" style="width: 6.5em;">Strichbreite</span>
                            <input type="range" id="lineWidthSlider" min="1" max="30" value="12" class="form-range flex-grow-1">
                            <span id="lineWidthVal" class="font-monospace text-body-secondary flex-shrink-0" style="width: 4em;">12</span>
                        </label>
                        <label for="lineCapSlider" class="d-flex align-items-center gap-2 small mb-0 px-1">
                            <span class="flex-shrink-0" style="width: 6.5em;">Linienende</span>
                            <input type="range" id="lineCapSlider" min="0" max="2" step="1" value="1" class="form-range flex-grow-1">
                            <span id="lineCapVal" class="font-monospace text-body-secondary flex-shrink-0" style="width: 4em;">square</span>
                        </label>
                    </div>
                </div>

                <div id="savedGlyphsCard" class="card shadow-sm">
                    <div class="card-header py-2 small fw-bold">Gespeicherte Glyphen</div>
                    <div id="savedGlyphsContainer" class="card-body p-2 d-flex flex-wrap gap-2 align-items-start">
                        <p class="small text-body-secondary fst-italic mb-0" id="emptyGlyphsMsg">Noch keine Glyphen gespeichert.</p>
                    </div>
                </div>

                <!-- die automatisch erzeugten Kombinationen: wie eine Schriftprobe, nackt, quadratisch, ohne Abstand -->
                <div id="comboCard" class="card shadow-sm d-none">
                    <div class="card-header py-2 d-flex justify-content-between align-items-center">
                        <span class="small fw-bold">Kombinationen</span>
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" role="switch" id="comboShuffle">
                            <label class="form-check-label small" for="comboShuffle">Mischen</label>
                        </div>
                    </div>
                    <div id="comboFlow" class="card-body p-2" style="background: #fff;"></div>
                </div>

                <div class="card shadow-sm overflow-hidden">
                    <div class="card-header py-2 d-flex justify-content-between align-items-center">
                        <span class="small fw-bold">KAGE-Daten</span>
                        <div class="btn-group btn-group-sm">
                            <button id="kageApplyBtn" class="btn btn-outline-success py-0" title="Die KAGE-Zeilen im Feld als Striche der Glyphe übernehmen (Strg+Enter); danach Speichern">Übernehmen</button>
                            <button id="kageImportBtn" class="btn btn-outline-primary py-0" title="Alle Glyphen aus einer Datei importieren">Import</button>
                            <button id="kageExportBtn" class="btn btn-outline-secondary py-0" title="Alle Glyphen als Datei herunterladen">Export</button>
                        </div>
                        <input type="file" id="kageImportFile" accept=".yaml,.yml,.txt" class="d-none">
                    </div>
                    <textarea id="kageOutput" rows="6" class="form-control font-monospace small border-0 rounded-0" style="resize: vertical;" spellcheck="false" aria-label="KAGE-Daten"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GRID = 200; // KAGE intern ist IMMER 200x200
        const MARGIN = 12; // Hilfsrahmen vom Rand
        const STORAGE_KEY = 'kage.savedGlyphs';
        // Kommentare auf Glyphen-Ebene { NAME: { before, comment, after }, '': { header, footer } };
        // Kommentare an Strichen stehen direkt am Strich (before, comment)
        const META_KEY = 'kage.glyphMeta';
        const LINE_CAPS = ['butt', 'square', 'round'];
        const PRESET_CODES = ['L', 'Z', 'NG', 'H', 'G', 'C', 'TR', 'DD', 'N', 'T', 'TH', 'NH', 'CH', 'DZ', 'X', 'KH', 'S', 'R', 'M', 'B', 'V', 'PH'];

        // Glyphen aus Großbuchstaben tragen Breite und die Box der anderen Komponente im Namen:
        // "TR-120-10-180-190-20" (BASIS-Breite-X-Y-X2-Y2).
        // Die andere Komponente sitzt in der Box zwischen zwei Ecken: der Versatz (X, Y) ist ihre untere linke Ecke
        // (X = linke Kante, Y = Unterkante), die Ecke (X2, Y2) ihre obere rechte (X2 = rechte Kante, Y2 = Oberkante).
        // Neutral: untere linke Ecke 0/200 (unten links), obere rechte Ecke 200/0 (oben rechts), also die ganze Fläche.
        // Standardwerte am Ende fallen weg: "TR-120-10-180" (obere rechte Ecke 200/0), "TR-120" (auch die untere linke
        // Ecke neutral), "TR" (Breite 200). Namen mit 3 Zahlen lesen sich so; ein altes "TR-120-80" (Hilfslinie)
        // wird als neutral gelesen. Alte Namen aus der Zeit der 50-%-Grenze werden nicht umgerechnet.
        const NEUTRAL_OFFSET = { x: 0, y: GRID };
        const NEUTRAL_CORNER = { x: GRID, y: 0 };
        const isUpperName = (base) => /^[A-Z]+$/.test(base);
        function splitName(code) {
            const m = code.match(/^([A-Z]+)(?:-(\d+)(?:-(\d+)(?:-(\d+)(?:-(\d+)-(\d+))?)?)?)?$/);
            if (!m) return { base: code, width: GRID, offset: { ...NEUTRAL_OFFSET }, corner: { ...NEUTRAL_CORNER } };
            const offset = m[4] ? { x: parseInt(m[3]), y: parseInt(m[4]) } : { ...NEUTRAL_OFFSET };
            const corner = m[6] ? { x: parseInt(m[5]), y: parseInt(m[6]) } : { ...NEUTRAL_CORNER };
            return { base: m[1], width: m[2] ? parseInt(m[2]) : GRID, offset, corner };
        }
        function joinName(base, width, offset, corner = NEUTRAL_CORNER) {
            if (!isUpperName(base)) return base;
            if (corner.x !== NEUTRAL_CORNER.x || corner.y !== NEUTRAL_CORNER.y) return `${base}-${width}-${offset.x}-${offset.y}-${corner.x}-${corner.y}`;
            if (offset.x !== NEUTRAL_OFFSET.x || offset.y !== NEUTRAL_OFFSET.y) return `${base}-${width}-${offset.x}-${offset.y}`;
            return width !== GRID ? `${base}-${width}` : base;
        }
        // Die Box der anderen Komponente [x1, y1, x2, y2] aus den zwei Ecken; null, wenn sie leer ist (dann wird nichts gezeichnet)
        function cornerBox(offset, corner) {
            return offset.x < corner.x && corner.y < offset.y ? [offset.x, corner.y, corner.x, offset.y] : null;
        }

        // Anfasser: zwei Ecken der anderen Komponente (untere linke, startet unten links bei 0/200, und obere rechte,
        // startet oben rechts bei 200/0; beide ziehen frei) und Breite (vertikaler Guide, Anfasser auf der unteren
        // Kante, zieht nur horizontal).
        // Die Ecken stehen zuerst: sie werden zuerst getroffen und zuletzt (also oben) gezeichnet.
        const HANDLES = {
            corner: {
                label: 'Ecke oben rechts', axes: ['x', 'y'],
                get: e => ({ ...e.corner }),
                set: (e, p) => { e.corner = p; },
            },
            offset: {
                label: 'Ecke unten links', axes: ['x', 'y'],
                get: e => ({ ...e.offset }),
                set: (e, p) => { e.offset = p; }, // die Breite bleibt, auch auf der Unterkante
            },
            width: {
                label: 'Breite', axes: ['x'],
                get: e => ({ x: e.glyphWidth, y: GRID }),
                set: (e, p) => { e.glyphWidth = p.x; },
            },
        };

        // Sortierung der Glyphen-Liste: Großbuchstaben, dann Kleinbuchstaben, dann gemischt;
        // innerhalb der Gruppe in der Reihenfolge von PRESET_CODES, alle anderen danach alphabetisch.
        // Gemischte Codes zuerst nach dem großen Anfang, dann nach dem kleinen Rest (TRnh: TR, dann nh).
        function glyphOrder(a, b) {
            const group = c => c === c.toUpperCase() ? 0 : c === c.toLowerCase() ? 1 : 2;
            const rank = c => {
                const i = PRESET_CODES.indexOf(splitName(c).base.toUpperCase());
                return i === -1 ? PRESET_CODES.length : i;
            };
            const cmp = (x, y) => rank(x) - rank(y) || x.localeCompare(y);
            const split = c => c.match(/^([^a-z]*)(.*)$/).slice(1);

            const g = group(a) - group(b);
            if (g) return g;
            if (group(a) === 2) {
                const [aUpper, aLower] = split(a);
                const [bUpper, bLower] = split(b);
                return cmp(aUpper, bUpper) || cmp(aLower, bLower);
            }
            return cmp(a, b);
        }
        // Marks: die 6 Markierungen eines Kleinbuchstabens (für die markierten Formen 1–6), je ein Strich.
        // In den KAGE-Daten stehen sie hinter den Strichen der Glyphe: hat eine Form MARKS_MIN_PARTS oder mehr Teile,
        // sind die letzten MARK_COUNT die Marks. Im Editor trägt jeder Strich seine Ebene (layer), gespeichert wird
        // sie nicht (nur die Reihenfolge).
        const MARK_COUNT = 6;
        const MARKS_MIN_PARTS = 9;
        const hasMarks = (strokes) => strokes.length >= MARKS_MIN_PARTS;
        const glyphPart = (strokes) => hasMarks(strokes) ? strokes.slice(0, -MARK_COUNT) : strokes;
        const marksPart = (strokes) => hasMarks(strokes) ? strokes.slice(-MARK_COUNT) : [];
        // Gespeicherte Striche -> Editor-Striche mit Ebene (Kopie)
        const withLayers = (strokes) => {
            const n = strokes.length - (hasMarks(strokes) ? MARK_COUNT : 0);
            return JSON.parse(JSON.stringify(strokes)).map((s, i) => ({ ...s, layer: i < n ? 'glyph' : 'marks' }));
        };
        // Editor-Striche -> gespeicherte Reihenfolge: erst die Glyphe, dann die Marks, ohne Ebene
        const withoutLayers = (strokes) => [...strokes.filter(s => s.layer !== 'marks'), ...strokes.filter(s => s.layer === 'marks')]
            .map(({ layer, ...s }) => JSON.parse(JSON.stringify(s)));

        const SNAP_RADIUS = 10;
        // Guides: Mittellinie und 6x6-Raster innerhalb des Hilfsrahmens; Rahmen selbst rastet auch ein
        const RASTER = 6;
        const CENTER_GUIDES = [GRID / 2];
        const THIRD_GUIDES = Array.from({ length: RASTER - 1 }, (_, k) => Math.round(MARGIN + (k + 1) * (GRID - 2 * MARGIN) / RASTER))
            .filter(v => v !== GRID / 2); // die Mitte zeichnet schon die Mittellinie
        // Unsichtbares Einrastgitter: jedes Rasterfeld in 4 Schritte geteilt (Viertel zwischen zwei Rasterlinien)
        const SUBDIV = 4;
        const FINE_STEPS = Array.from({ length: RASTER * SUBDIV + 1 }, (_, k) => Math.round(MARGIN + k * (GRID - 2 * MARGIN) / (RASTER * SUBDIV)));
        const SNAP_LINES = [...new Set([0, ...FINE_STEPS, ...CENTER_GUIDES, GRID])];

        // Ein Strich als KAGE-Zeile
        function strokeToKage(stroke) {
            const p = stroke.points;
            if (stroke.type === 1) return `1,0,0,${p[0].x},${p[0].y},${p[1].x},${p[1].y}`;
            if (stroke.type === 2) return `2,0,0,${p[0].x},${p[0].y},${p[1].x},${p[1].y},${p[2].x},${p[2].y}`;
            const x1 = p[0].x, y1 = p[0].y, x2 = p[1].x, y2 = p[1].y;
            return `99,0,0,${x1},${y1},${x2},${y1},${x1},${y2},${x2},${y2},${stroke.refName}`;
        }

        // KAGE-Daten in Striche umwandeln; GlyphWiki nutzt '$' oder Zeilenumbrüche als Trenner
        function kageToStrokes(rawData) {
            const lines = rawData.split(/[\n\r\$]+/);
            const newStrokes = [];

            lines.forEach(line => {
                const parts = line.split(/[:,]/);
                if (parts.length < 7) return; // Zu kurz für gültige KAGE-Daten

                const type = parseInt(parts[0]);

                if (type === 99) {
                    if (parts.length >= 12) {
                        const x1 = parseInt(parts[3]);
                        const y1 = parseInt(parts[4]);
                        const x2 = parseInt(parts[9]);
                        const y2 = parseInt(parts[10]);
                        newStrokes.push({
                            type: 99,
                            points: [
                                { x: isNaN(x1) ? 0 : x1, y: isNaN(y1) ? 0 : y1 },
                                { x: isNaN(x2) ? 200 : x2, y: isNaN(y2) ? 200 : y2 }
                            ],
                            refName: parts.slice(11).join(':').trim()
                        });
                    }
                    return;
                }

                // Alle anderen KAGE-Typen nach Anzahl der Koordinaten in Linie oder Kurve umwandeln
                const coords = parts.slice(3).map(p => parseInt(p)).filter(n => !isNaN(n));

                if (coords.length >= 8) {
                    // 4 Punkte -> 3-Punkt-Kurve (Start, Kontrollpunkt 1, Ende)
                    newStrokes.push({ type: 2, points: [
                        { x: coords[0], y: coords[1] }, { x: coords[2], y: coords[3] }, { x: coords[6], y: coords[7] }
                    ], refName: "" });
                } else if (coords.length >= 6) {
                    newStrokes.push({ type: 2, points: [
                        { x: coords[0], y: coords[1] }, { x: coords[2], y: coords[3] }, { x: coords[4], y: coords[5] }
                    ], refName: "" });
                } else if (coords.length >= 4) {
                    newStrokes.push({ type: 1, points: [
                        { x: coords[0], y: coords[1] }, { x: coords[2], y: coords[3] }
                    ], refName: "" });
                }
            });
            return newStrokes;
        }

        class KageEditor {
            constructor() {
                this.canvas = document.getElementById('kageCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.output = document.getElementById('kageOutput');

                this.strokes = [];
                this.currentPoints = [];
                this.activeTool = null;
                this.layer = 'glyph'; // bearbeitete Ebene: 'glyph' | 'marks'

                // Status-Variablen für das Bearbeiten
                this.appMode = 'edit'; // 'add' | 'edit'
                this.selectedStrokeIdx = null;
                this.selectedPointIdx = null; // null bedeutet: ganze Linie ausgewählt
                this.strokeWidth = 12; // in KAGE-Einheiten
                this.lineCap = 'square'; // Linienende, per Regler: butt, square, round
                this.drag = null; // { x, y, orig } während die Maus zieht
                this.glyphWidth = GRID; // Breite der Glyphe (nur bei Namen aus Großbuchstaben)
                this.offset = { ...NEUTRAL_OFFSET }; // untere linke Ecke der anderen Komponente in der Vorschau (nur Großbuchstaben)
                this.corner = { ...NEUTRAL_CORNER }; // obere rechte Ecke der anderen Komponente (nur Großbuchstaben)
                this.handleSelected = null; // ausgewählter grüner Anfasser: 'width' | 'offset' | 'corner' | null
                this.loadedCode = null; // Name, unter dem die geladene Glyphe gespeichert ist

                this.glyphMeta = this.loadStored(META_KEY) ?? {}; // Kommentare auf Glyphen- und Dateiebene

                // Gespeicherte Glyphen aus dem localStorage, sonst leer (die Kombinationen entstehen automatisch)
                this.savedGlyphs = this.loadStored() ?? {};

                // Fehlende Zeichen als leere Glyphen anlegen (vorhandene bleiben unverändert, auch mit Breite)
                const bases = new Set(Object.keys(this.savedGlyphs).map(k => splitName(k).base));
                [...PRESET_CODES, ...PRESET_CODES.map(c => c.toLowerCase())].forEach(c => {
                    if (!bases.has(c)) this.savedGlyphs[c] = [];
                });
                this.syncCombos();
                this.persist();

                this.initEvents();
                this.renderSavedGlyphPreviews();
                this.render();
            }

            loadStored(key = STORAGE_KEY) {
                try {
                    return JSON.parse(localStorage.getItem(key));
                } catch {
                    return null;
                }
            }

            persist() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.savedGlyphs));
                    localStorage.setItem(META_KEY, JSON.stringify(this.glyphMeta));
                } catch {
                    this.showToast('Speichern im Browser nicht möglich!');
                }
            }

            // Bildschirm-Koordinaten -> 200er Raster (Canvas ist per CSS skaliert)
            toGrid(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: Math.round((e.clientX - rect.left) * GRID / rect.width),
                    y: Math.round((e.clientY - rect.top) * GRID / rect.height)
                };
            }

            initEvents() {
                document.querySelectorAll('.layer-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.setLayer(btn.dataset.layer));
                });

                // One-Shot Hinzufügen Buttons
                document.querySelectorAll('.tool-add-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.activeTool = parseInt(e.currentTarget.dataset.tool);
                        // Komponente: der nächste Klick auf eine gespeicherte Glyphe fügt sie ein
                        this.appMode = this.activeTool === 99 ? 'pick' : 'add';
                        this.currentPoints = [];
                        this.selectedStrokeIdx = null;
                        this.selectedPointIdx = null;
                        this.handleSelected = null;
                        this.updateEditInfo();
                        this.render();
                    });
                });

                // Kombinationen: Schalter Mischen (an: neue zufällige Reihenfolge, aus: sortiert)
                document.getElementById('comboShuffle').addEventListener('change', (e) => {
                    this.comboRank = e.target.checked ? new Map() : null; // Zufallszahl je Kombination, solange der Schalter an ist
                    this.renderSavedGlyphPreviews();
                });

                // Der Breiten-Anfasser hängt am Namen: nur bei Großbuchstaben sichtbar
                document.getElementById('saveCodeInput').addEventListener('input', () => {
                    if (!this.showsWidth()) this.handleSelected = null;
                    this.updateEditInfo();
                    this.render();
                });

                // Canvas: Maus wählt beim Drücken aus und zieht. Touch/Stift wählen nur per Tippen aus,
                // Wischen bleibt Scrollen (der Browser schickt dann pointercancel statt pointerup).
                this.canvas.addEventListener('pointerdown', (e) => {
                    if (e.pointerType !== 'mouse' || e.button !== 0) return;
                    const { x, y } = this.toGrid(e);
                    this.handleCanvasClick(x, y);
                    if (this.appMode !== 'edit') return;
                    if (this.handleSelected) {
                        this.drag = { x, y, start: HANDLES[this.handleSelected].get(this) };
                    } else if (this.selectedStrokeIdx !== null) {
                        const stroke = this.strokes[this.selectedStrokeIdx];
                        this.drag = { x, y, orig: stroke.points.map(p => ({ ...p })) };
                    } else {
                        return;
                    }
                    this.canvas.setPointerCapture(e.pointerId);
                });
                this.canvas.addEventListener('pointermove', (e) => {
                    if (e.pointerType !== 'mouse') return;
                    const { x, y } = this.toGrid(e);
                    if (!this.drag) {
                        let cursor = 'crosshair';
                        const handle = this.appMode === 'edit' ? this.handleHit(x, y) : null;
                        if (handle) cursor = HANDLES[handle].axes.length === 1 ? 'ew-resize' : 'move';
                        else if (this.appMode === 'edit' && this.hitTest(x, y)) cursor = 'move';
                        this.canvas.style.cursor = cursor;
                        return;
                    }
                    this.applyDrag(x, y);
                });
                this.canvas.addEventListener('pointerup', (e) => {
                    if (e.pointerType === 'mouse') {
                        if (this.drag) {
                            this.drag = null;
                            this.render(); // Fangradius ausblenden
                        }
                        return;
                    }
                    const { x, y } = this.toGrid(e);
                    this.handleCanvasClick(x, y);
                });
                this.canvas.addEventListener('pointercancel', () => { this.drag = null; });

                document.getElementById('clearBtn').addEventListener('click', () => {
                    this.strokes = this.strokes.filter(s => s.layer !== this.layer);
                    this.currentPoints = [];
                    this.selectedStrokeIdx = null;
                    this.selectedPointIdx = null;
                    this.handleSelected = null;
                    this.updateOutput();
                    this.updateEditInfo();
                    this.render();
                });

                // Import/Export: alle Glyphen als eine Textdatei
                const importFile = document.getElementById('kageImportFile');
                document.getElementById('kageImportBtn').addEventListener('click', () => importFile.click());
                importFile.addEventListener('change', async () => {
                    if (importFile.files[0]) await this.importAll(importFile.files[0]);
                    importFile.value = ''; // dieselbe Datei erneut wählbar
                });
                document.getElementById('kageExportBtn').addEventListener('click', () => this.exportAll());

                // Fadenkreuz: springt zur nächsten Einrastposition
                document.querySelectorAll('.dpad-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.moveSelection(parseInt(e.currentTarget.dataset.dx), parseInt(e.currentTarget.dataset.dy));
                    });
                });

                document.getElementById('resolveBtn').addEventListener('click', () => this.resolveSelectedComponent());
                document.getElementById('deleteStrokeBtn').addEventListener('click', () => this.deleteSelectedStroke());
                // Entf/Rücktaste entfernt die ausgewählte Form, außer beim Tippen in ein Feld
                window.addEventListener('keydown', (e) => {
                    if (e.key !== 'Delete' && e.key !== 'Backspace') return;
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
                    if (this.selectedStrokeIdx === null) return;
                    e.preventDefault();
                    this.deleteSelectedStroke();
                });
                // KAGE-Daten von Hand: das Feld zeigt die Zeilen der Glyphe (wie gespeichert: erst die Glyphe, dann die 6 Marks) und kann bearbeitet werden;
                // „Übernehmen“ (oder Strg+Enter) macht daraus die Striche des Editors, gespeichert wird wie sonst mit „Speichern“
                const applyBtn = document.getElementById('kageApplyBtn');
                applyBtn.addEventListener('click', () => this.applyKageText());
                this.output.addEventListener('input', () => { this.outputDirty = true; applyBtn.classList.replace('btn-outline-success', 'btn-success'); });
                this.output.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.applyKageText(); }
                });
                document.getElementById('saveGlyphBtn').addEventListener('click', () => this.saveCurrentGlyph());
                document.getElementById('saveCodeInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.saveCurrentGlyph();
                });

                document.getElementById('importGwBtn').addEventListener('click', () => this.importFromGlyphWiki());
                document.getElementById('gwInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.importFromGlyphWiki();
                });

                const widthVal = document.getElementById('lineWidthVal');
                document.getElementById('lineWidthSlider').addEventListener('input', (e) => {
                    this.strokeWidth = parseInt(e.target.value);
                    widthVal.textContent = this.strokeWidth;
                    this.render();
                    this.renderSavedGlyphPreviews();
                });

                // Linienende: 0 = butt, 1 = square, 2 = round
                const capVal = document.getElementById('lineCapVal');
                document.getElementById('lineCapSlider').addEventListener('input', (e) => {
                    this.lineCap = LINE_CAPS[parseInt(e.target.value)];
                    capVal.textContent = this.lineCap;
                    this.render();
                    this.renderSavedGlyphPreviews();
                });
            }

            handleCanvasClick(x, y) {
                if (x < 0 || x > GRID || y < 0 || y > GRID) return;

                // Klick auf die Malfläche bricht die Komponenten-Auswahl ab und wählt normal aus
                if (this.appMode === 'pick') this.resetToAddOrEdit();

                if (this.appMode === 'edit') {
                    this.handleEditClick(x, y);
                    return;
                }

                // Hinzufügen-Modus: Punkte setzen; Endpunkte rasten ein wie beim Ziehen, der Kontrollpunkt
                // einer Kurve (zweiter Klick) bleibt frei
                const isControlPoint = this.activeTool === 2 && this.currentPoints.length === 1;
                const p = isControlPoint ? { x, y } : this.snapPoint({ x, y }, null);
                this.currentPoints.push({ x: Math.round(p.x), y: Math.round(p.y) });
                const pointsNeeded = this.activeTool === 2 ? 3 : 2;

                if (this.currentPoints.length === pointsNeeded) {
                    this.addStroke(this.activeTool, [...this.currentPoints]);
                    this.resetToAddOrEdit();
                }
                this.render();
            }

            // Ebene wechseln: Auswahl und angefangenes Zeichnen fallen weg
            setLayer(layer) {
                this.layer = layer;
                this.resetToAddOrEdit();
                this.selectedStrokeIdx = null;
                this.selectedPointIdx = null;
                this.updateEditInfo();
                this.render();
            }

            resetToAddOrEdit() {
                this.appMode = 'edit';
                this.activeTool = null;
                this.currentPoints = [];
                this.handleSelected = null;
            }

            // Anfasser für Breite und Versatz nur für Namen aus Großbuchstaben
            showsWidth() {
                return isUpperName(splitName(document.getElementById('saveCodeInput').value.trim()).base);
            }

            // Welcher Anfasser liegt unter (x, y)? 'width' | 'offset' | 'corner' | null
            handleHit(x, y) {
                if (!this.showsWidth()) return null;
                return Object.keys(HANDLES).find(k => {
                    const p = HANDLES[k].get(this);
                    return Math.hypot(x - p.x, y - p.y) <= 8;
                }) ?? null;
            }

            // Gespeicherte Glyphe als KAGE-99-Referenz über die ganze Fläche einfügen und auswählen
            addComponent(code) {
                this.addStroke(99, [{ x: 0, y: 0 }, { x: GRID, y: GRID }], code);
                this.resetToAddOrEdit();
                this.selectedStrokeIdx = this.strokes.length - 1;
                this.selectedPointIdx = null;
                this.updateEditInfo();
                this.render();
            }

            // --- BEARBEITUNGS-METHODEN ---

            // Liefert { s, p } des Elements unter (x, y); p = null heißt ganze Form
            hitTest(x, y) {
                const hitT = 8; // Toleranz-Radius für das Anklicken

                // 1. Zuerst Punkte prüfen (haben Priorität)
                for (let i = this.strokes.length - 1; i >= 0; i--) {
                    if (this.strokes[i].layer !== this.layer) continue; // nur die Striche der aktuellen Ebene
                    const pts = this.strokes[i].points;
                    for (let j = 0; j < pts.length; j++) {
                        if (Math.hypot(pts[j].x - x, pts[j].y - y) <= hitT) return { s: i, p: j };
                    }
                }

                // 2. Dann Linien/Kurven/Boxen prüfen
                for (let i = this.strokes.length - 1; i >= 0; i--) {
                    const stroke = this.strokes[i];
                    if (stroke.layer !== this.layer) continue;
                    const pts = stroke.points;
                    if (stroke.type === 1) {
                        if (this.distToSegment(x, y, pts[0], pts[1]) <= hitT) return { s: i, p: null };
                    } else if (stroke.type === 2) {
                        for (let t = 0; t <= 1; t += 0.1) {
                            const px = (1-t)*(1-t)*pts[0].x + 2*(1-t)*t*pts[1].x + t*t*pts[2].x;
                            const py = (1-t)*(1-t)*pts[0].y + 2*(1-t)*t*pts[1].y + t*t*pts[2].y;
                            if (Math.hypot(px - x, py - y) <= hitT) return { s: i, p: null };
                        }
                    } else if (stroke.type === 99) {
                        const x1 = Math.min(pts[0].x, pts[1].x), x2 = Math.max(pts[0].x, pts[1].x);
                        const y1 = Math.min(pts[0].y, pts[1].y), y2 = Math.max(pts[0].y, pts[1].y);
                        if (x >= x1 && x <= x2 && y >= y1 && y <= y2) return { s: i, p: null };
                    }
                }
                return null;
            }

            handleEditClick(x, y) {
                this.handleSelected = this.handleHit(x, y);
                const found = this.handleSelected ? null : this.hitTest(x, y);
                this.selectedStrokeIdx = found ? found.s : null;
                this.selectedPointIdx = found ? found.p : null;
                this.updateEditInfo();
                this.render();
            }

            // Ziehen von (drag.x, drag.y) nach (x, y), magnetisch eingerastet: ein gezogener Punkt selbst,
            // bei der ganzen Form der Punkt, der am nächsten an einem Ziel liegt (x und y getrennt)
            applyDrag(x, y) {
                const d = this.drag;
                d.raw = { x, y };

                // Anfasser für Breite/Versatz: nur entlang seiner Achsen, mit denselben Einrastzielen
                if (this.handleSelected) {
                    const h = HANDLES[this.handleSelected];
                    const raw = {
                        x: d.start.x + (h.axes.includes('x') ? x - d.x : 0),
                        y: d.start.y + (h.axes.includes('y') ? y - d.y : 0),
                    };
                    const r = this.snapPoint(raw, null);
                    const clamp = v => Math.max(0, Math.min(GRID, Math.round(v)));
                    h.set(this, {
                        x: h.axes.includes('x') ? clamp(r.sx ? r.x : raw.x) : d.start.x,
                        y: h.axes.includes('y') ? clamp(r.sy ? r.y : raw.y) : d.start.y,
                    });
                    this.updateEditInfo();
                    this.render();
                    return;
                }

                const stroke = this.strokes[this.selectedStrokeIdx];
                const o = d.orig;
                const pi = this.selectedPointIdx;
                let dx = x - d.x;
                let dy = y - d.y;

                const sources = pi !== null ? [o[pi]] : this.snapSources(stroke, o);
                let shiftX = null, shiftY = null;
                sources.forEach(p => {
                    const moved = { x: p.x + dx, y: p.y + dy };
                    const r = this.snapPoint(moved, this.selectedStrokeIdx);
                    if (r.sx && (shiftX === null || Math.abs(r.x - moved.x) < Math.abs(shiftX))) shiftX = r.x - moved.x;
                    if (r.sy && (shiftY === null || Math.abs(r.y - moved.y) < Math.abs(shiftY))) shiftY = r.y - moved.y;
                });
                dx += shiftX ?? 0;
                dy += shiftY ?? 0;

                o.forEach((p, i) => {
                    if (pi === null || pi === i) {
                        stroke.points[i].x = Math.round(p.x + dx);
                        stroke.points[i].y = Math.round(p.y + dy);
                    }
                });
                this.updateEditInfo();
                this.updateOutput();
                this.render();
            }

            // Einrasten im Umkreis von SNAP_RADIUS: zuerst Punkte anderer Formen, sonst Guides und Randlinien
            // (x und y getrennt, so rasten auch Kreuzungen ein). Die eigene Form wird übersprungen.
            // sx/sy sagen, ob die Achse eingerastet ist.
            snapPoint(p, skipIdx) {
                let best = null;
                let bestDist = SNAP_RADIUS;
                this.strokes.forEach((s, i) => {
                    if (i === skipIdx) return;
                    s.points.forEach(q => {
                        const dist = Math.hypot(q.x - p.x, q.y - p.y);
                        if (dist <= bestDist) { best = q; bestDist = dist; }
                    });
                });
                if (best) return { x: best.x, y: best.y, sx: true, sy: true };

                const nearest = (v) => SNAP_LINES.reduce((m, g) => Math.abs(g - v) < Math.abs(m - v) ? g : m);
                const gx = nearest(p.x), gy = nearest(p.y);
                const sx = Math.abs(gx - p.x) <= SNAP_RADIUS;
                const sy = Math.abs(gy - p.y) <= SNAP_RADIUS;
                return { x: sx ? gx : p.x, y: sy ? gy : p.y, sx, sy };
            }

            // Punkte einer Form, die beim Verschieben einrasten: alle außer dem Kurven-Kontrollpunkt
            snapSources(stroke, pts) {
                return pts.filter((_, i) => !(stroke.type === 2 && i === 1));
            }

            closestOnSegment(px, py, p1, p2) {
                const l2 = (p2.x - p1.x)**2 + (p2.y - p1.y)**2;
                if (l2 === 0) return { x: p1.x, y: p1.y };
                let t = ((px - p1.x) * (p2.x - p1.x) + (py - p1.y) * (p2.y - p1.y)) / l2;
                t = Math.max(0, Math.min(1, t));
                return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
            }

            distToSegment(px, py, p1, p2) {
                const q = this.closestOnSegment(px, py, p1, p2);
                return Math.hypot(px - q.x, py - q.y);
            }

            // Fadenkreuz: springt zur nächsten Einrastposition in Pfeilrichtung (Guides, Randlinien und
            // die Koordinaten der Punkte anderer Formen). Bei der ganzen Form entscheidet der Punkt, der
            // als erster eine Einrastposition erreicht (ohne Kurven-Kontrollpunkt).
            moveSelection(dx, dy) {
                if (this.handleSelected) {
                    const h = HANDLES[this.handleSelected];
                    const axis = dx !== 0 ? 'x' : 'y';
                    const dir = dx + dy;
                    if (!h.axes.includes(axis)) return; // die Breite nur horizontal
                    const p = h.get(this);
                    const targets = [...SNAP_LINES];
                    this.strokes.forEach(s => s.points.forEach(q => targets.push(q[axis])));
                    const next = dir > 0
                        ? Math.min(...targets.filter(t => t > p[axis]))
                        : Math.max(...targets.filter(t => t < p[axis]));
                    if (isFinite(next)) {
                        p[axis] = Math.max(0, Math.min(GRID, next));
                        h.set(this, p);
                    }
                    this.updateEditInfo();
                    this.render();
                    return;
                }
                if (this.selectedStrokeIdx === null) return;
                const stroke = this.strokes[this.selectedStrokeIdx];
                const axis = dx !== 0 ? 'x' : 'y';
                const dir = dx + dy; // +1 oder -1

                const targets = [...SNAP_LINES];
                this.strokes.forEach((s, i) => { if (i !== this.selectedStrokeIdx) s.points.forEach(q => targets.push(q[axis])); });
                const sources = this.selectedPointIdx !== null
                    ? [stroke.points[this.selectedPointIdx]]
                    : this.snapSources(stroke, stroke.points);

                let step = Infinity;
                sources.forEach(p => targets.forEach(t => {
                    const dist = (t - p[axis]) * dir;
                    if (dist > 0 && dist < step) step = dist;
                }));
                if (step === Infinity) return;

                const moved = this.selectedPointIdx !== null ? [stroke.points[this.selectedPointIdx]] : stroke.points;
                moved.forEach(p => { p[axis] += step * dir; });

                this.updateEditInfo();
                this.updateOutput();
                this.render();
            }

            updateEditInfo() {
                const info = document.getElementById('editInfo');
                const resolveBtn = document.getElementById('resolveBtn');
                const deleteBtn = document.getElementById('deleteStrokeBtn');

                if (this.handleSelected) {
                    info.textContent = HANDLES[this.handleSelected].label;
                    resolveBtn.classList.add('d-none');
                    deleteBtn.classList.add('d-none');
                    return;
                }
                if (this.selectedStrokeIdx === null) {
                    info.textContent = 'Nichts ausgewählt';
                    resolveBtn.classList.add('d-none');
                    deleteBtn.classList.add('d-none');
                    return;
                }

                const stroke = this.strokes[this.selectedStrokeIdx];
                deleteBtn.classList.remove('d-none'); // auch bei ausgewähltem Punkt: entfernt die ganze Form

                // Auflösen nur für eine ganze Box (Typ 99)
                resolveBtn.classList.toggle('d-none', !(stroke.type === 99 && this.selectedPointIdx === null));

                if (this.selectedPointIdx !== null) {
                    info.textContent = 'Punkt';
                } else {
                    const typeNames = {1: 'Linie', 2: 'Kurve', 99: `Komponente ${stroke.refName}`};
                    info.textContent = typeNames[stroke.type];
                }
            }

            deleteSelectedStroke() {
                if (this.selectedStrokeIdx === null) return;
                this.strokes.splice(this.selectedStrokeIdx, 1);
                this.selectedStrokeIdx = null;
                this.selectedPointIdx = null;
                this.updateEditInfo();
                this.updateOutput();
                this.render();
            }

            resolveSelectedComponent() {
                if (this.selectedStrokeIdx === null) return;

                const targetIdx = this.selectedStrokeIdx;
                const stroke = this.strokes[targetIdx];
                if (stroke.type !== 99) return;

                const refName = stroke.refName;
                if (!this.savedGlyphs[refName]) {
                    this.showToast(`Fehler: Glyphe '${refName}' nicht in den gespeicherten Daten gefunden!`);
                    return;
                }

                const [p1, p2] = stroke.points;
                const x = Math.min(p1.x, p2.x);
                const y = Math.min(p1.y, p2.y);
                const w = Math.abs(p2.x - p1.x);
                const h = Math.abs(p2.y - p1.y);

                const resolvedStrokes = glyphPart(this.savedGlyphs[refName]).map(subStroke => {
                    const newStroke = JSON.parse(JSON.stringify(subStroke));
                    newStroke.layer = stroke.layer;
                    newStroke.points = newStroke.points.map(p => ({
                        x: Math.round(x + (p.x / GRID) * w),
                        y: Math.round(y + (p.y / GRID) * h)
                    }));
                    return newStroke;
                });

                this.strokes.splice(targetIdx, 1, ...resolvedStrokes);
                this.selectedStrokeIdx = null;
                this.selectedPointIdx = null;

                this.updateEditInfo();
                this.updateOutput();
                this.render();
                this.showToast(`Komponente '${refName}' erfolgreich aufgelöst.`);
            }

            saveCurrentGlyph() {
                const input = document.getElementById('saveCodeInput').value.trim();
                if (!input) {
                    this.showToast('Bitte einen Code eingeben!');
                    return;
                }
                if (this.strokes.length === 0) {
                    this.showToast('Keine Striche zum Speichern!');
                    return;
                }
                // Marks: keine oder genau 6 Striche; die Anzahl der Teile muss sie beim Laden wieder erkennen lassen
                const marks = this.strokes.filter(s => s.layer === 'marks');
                const glyphCount = this.strokes.length - marks.length;
                let problem = null;
                if (marks.length && marks.length !== MARK_COUNT) {
                    problem = `Die Ebene Marks hat ${marks.length} Striche, sie braucht genau ${MARK_COUNT}.`;
                } else if (marks.length && glyphCount + MARK_COUNT < MARKS_MIN_PARTS) {
                    problem = `Mit Marks braucht die Ebene Glyph mindestens ${MARKS_MIN_PARTS - MARK_COUNT} Teile (sie hat ${glyphCount}).`;
                } else if (!marks.length && glyphCount >= MARKS_MIN_PARTS) {
                    problem = `Ohne Marks darf die Glyphe höchstens ${MARKS_MIN_PARTS - 1} Teile haben (sie hat ${glyphCount}), sonst gelten die letzten ${MARK_COUNT} als Marks.`;
                }
                if (problem) {
                    this.showToast(`Nicht gespeichert: ${problem}`);
                    return;
                }

                // Name mit Breite (nur Großbuchstaben); eine im Feld getippte Breite zählt nicht, der Anfasser gilt
                const { base } = splitName(input);
                const code = joinName(base, this.glyphWidth, this.offset, this.corner);

                // Deep Copy (überschreibt, wenn der Code existiert)
                this.savedGlyphs[code] = withoutLayers(this.strokes);

                // Nur die Breite geändert: alte Glyphe umbenennen und Verweise in anderen Glyphen nachziehen
                const old = this.loadedCode;
                if (old && old !== code && splitName(old).base === base && this.savedGlyphs[old]) {
                    delete this.savedGlyphs[old];
                    this.renameReferences(old, code);
                    if (this.glyphMeta[old]) { // Kommentare der Glyphe wandern mit
                        this.glyphMeta[code] = this.glyphMeta[old];
                        delete this.glyphMeta[old];
                    }
                }
                this.syncCombos();
                this.persist();
                this.renderSavedGlyphPreviews();
                this.showToast(`Erfolgreich als '${code}' gespeichert!`);

                // Für das nächste Zeichen zurücksetzen
                document.getElementById('saveCodeInput').value = '';
                this.loadedCode = null;
                this.glyphWidth = GRID;
                this.offset = { ...NEUTRAL_OFFSET };
                this.corner = { ...NEUTRAL_CORNER };
                this.strokes = [];
                this.selectedStrokeIdx = null;
                this.selectedPointIdx = null;
                this.resetToAddOrEdit();
                this.updateOutput();
                this.updateEditInfo();
                this.render();
            }

            // Alle Kombinationen Großbuchstabe + Kleinbuchstabe als gespeicherte Glyphen (Name: BASIS + klein, z. B.
            // "TRnh"), aufgebaut wie die Vorschau: der Großbuchstabe füllt 0 bis zu seiner Breite, der Kleinbuchstabe
            // sitzt in der Box, die der Versatz des Großbuchstabens vorgibt. Es sind Verweise (99) auf die beiden
            // Glyphen, sie folgen also jeder Änderung. Gleichnamige Glyphen werden überschrieben, Kombinationen,
            // deren Teile nicht mehr (oder nur leer) existieren, entfallen. Leere Glyphen ergeben keine Kombination.
            syncCombos() {
                const keys = Object.keys(this.savedGlyphs);
                const upperKeys = keys.filter(k => isUpperName(splitName(k).base) && this.savedGlyphs[k].length);
                const lowerKeys = keys.filter(k => /^[a-z]+$/.test(k) && this.savedGlyphs[k].length);
                const combos = {};
                upperKeys.forEach(u => {
                    const { base, width, offset, corner } = splitName(u);
                    const box = cornerBox(offset, corner);
                    lowerKeys.forEach(l => {
                        const strokes = [{ type: 99, points: [{ x: 0, y: 0 }, { x: width, y: GRID }], refName: u }];
                        if (box) strokes.push({ type: 99, points: [{ x: box[0], y: box[1] }, { x: box[2], y: box[3] }], refName: l });
                        combos[base + l] = strokes;
                    });
                });
                keys.filter(k => /^[A-Z]+[a-z]+$/.test(k) && !combos[k]).forEach(k => {
                    delete this.savedGlyphs[k];
                    delete this.glyphMeta[k];
                });
                Object.assign(this.savedGlyphs, combos);
            }

            renameReferences(from, to) {
                Object.values(this.savedGlyphs).forEach(strokes => strokes.forEach(s => {
                    if (s.type === 99 && s.refName === from) s.refName = to;
                }));
            }

            deleteGlyph(code) {
                if (!confirm(`Glyphe '${code}' löschen?`)) return;
                delete this.savedGlyphs[code];
                delete this.glyphMeta[code];
                this.syncCombos();
                this.persist();
                this.renderSavedGlyphPreviews();
                this.render(); // Komponenten, die darauf verweisen, sind jetzt leer
            }

            async importFromGlyphWiki() {
                const input = document.getElementById('gwInput');
                const btn = document.getElementById('importGwBtn');
                const id = input.value.trim();

                if (!id) {
                    this.showToast('Bitte eine GlyphWiki ID eingeben!');
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Lädt...';
                try {
                    this.showToast('Lade Daten von GlyphWiki...');

                    // AllOrigins Proxy um CORS-Probleme zu umgehen
                    const targetUrl = `https://glyphwiki.org/glyph/${id}.kage`;
                    const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
                    if (!response.ok) throw new Error(`Netzwerkfehler: HTTP ${response.status}`);

                    const data = await response.json();
                    if (data.status && data.status.http_code === 404) throw new Error(`Glyphe '${id}' nicht gefunden.`);
                    if (!data.contents) throw new Error('Leere Antwort vom Proxy erhalten.');
                    if (data.contents.trim().toLowerCase().startsWith('<!doctype') || data.contents.includes('<html')) {
                        throw new Error('Ungültige Antwort (HTML erhalten). ID falsch?');
                    }

                    this.parseKageData(data.contents);
                    document.getElementById('saveCodeInput').value = id;
                    this.loadedCode = null;
                    this.glyphWidth = GRID;
                    this.offset = { ...NEUTRAL_OFFSET };
                    this.corner = { ...NEUTRAL_CORNER };
                    this.showToast(`Glyphe '${id}' erfolgreich importiert!`);
                } catch (error) {
                    console.error("[Import] Fehler:", error);
                    this.showToast(`Import fehlgeschlagen: ${error.message}`);
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Importieren';
                }
            }

            parseKageData(rawData) {
                const newStrokes = kageToStrokes(rawData);
                if (newStrokes.length === 0) {
                    throw new Error('Keine Linien in dieser Glyphe gefunden (möglicherweise nur Referenzen).');
                }
                this.strokes = withLayers(newStrokes);
                this.selectedStrokeIdx = null;
                this.selectedPointIdx = null;
                this.resetToAddOrEdit();
                this.updateOutput();
                this.updateEditInfo();
                this.render();
            }

            // Alle Glyphen als YAML-artige Textdatei (gültiges YAML, wird aber ohne YAML-Parser gelesen):
            //   NAME: |-
            //     KAGE-Zeile
            //     KAGE-Zeile
            // Gespeicherte Kommentare werden an ihrer Stelle wieder ausgegeben (siehe importAll).
            exportAll() {
                const file = this.glyphMeta[''] ?? {};
                const withComment = (text, comment) => comment ? `${text} ${comment}` : text;
                const lines = file.header?.length ? [...file.header, ''] : [];
                Object.keys(this.savedGlyphs).sort(glyphOrder).forEach(code => {
                    const meta = this.glyphMeta[code] ?? {};
                    lines.push(...(meta.before ?? []));
                    lines.push(withComment(`${code}: |-`, meta.comment));
                    this.savedGlyphs[code].forEach(s => {
                        lines.push(...(s.before ?? []).map(c => `  ${c}`));
                        lines.push(withComment(`  ${strokeToKage(s)}`, s.comment));
                    });
                    lines.push(...(meta.after ?? []).map(c => `  ${c}`));
                });
                lines.push(...(file.footer ?? []));
                const text = lines.join('\n') + '\n';
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
                a.download = 'kage-glyphen.yaml';
                a.click();
                URL.revokeObjectURL(a.href);
            }

            // Datei aus exportAll einlesen, nur nach Einrückung: eine Zeile ohne Einrückung "NAME: |-" beginnt eine
            // Glyphe, eingerückte Zeilen sind ihre KAGE-Zeilen (Einrückung beliebig, Leerzeichen oder Tabs).
            // Leerzeilen zählen nicht. Kommentare (# am Zeilenanfang, auch eingerückt, oder am Zeilenende mit
            // Leerraum davor) werden gespeichert, für die Verarbeitung aber entfernt:
            //   - am Ende einer KAGE-Zeile und eingerückte Kommentarzeilen davor: am Strich (wandert mit ihm)
            //   - am Ende der Namenszeile und nicht eingerückte Kommentarzeilen davor: an der Glyphe
            //   - eingerückt nach dem letzten Strich: am Ende der Glyphe
            //   - vor der ersten Glyphe bis zur letzten Leerzeile davor, und am Dateiende: Kopf und Fuß der Datei
            // Gleichnamige Glyphen werden überschrieben, alle anderen bleiben.
            async importAll(file) {
                const glyphs = {};
                const metas = {};
                const fileMeta = { header: [], footer: [] };
                let current = null;
                let pendingTop = []; // nicht eingerückte Kommentarzeilen
                let pendingIndented = []; // eingerückte Kommentarzeilen
                const splitComment = (line) => {
                    const m = line.match(/^(.*?)(\s+#.*)?$/);
                    return [m[1], m[2] ? m[2].trim() : ''];
                };

                (await file.text()).split(/\r?\n/).forEach(line => {
                    if (!line.trim()) {
                        // Vor der ersten Glyphe trennt eine Leerzeile den Dateikopf vom Kommentar der Glyphe
                        if (current === null) fileMeta.header.push(...pendingTop.splice(0));
                        return;
                    }
                    const indented = /^\s/.test(line);
                    if (/^\s*#/.test(line)) {
                        (indented && current !== null ? pendingIndented : pendingTop).push(line.trim());
                        return;
                    }
                    const [content, comment] = splitComment(line);
                    if (indented) {
                        if (current === null) return;
                        const [stroke] = kageToStrokes(content);
                        if (stroke) {
                            if (pendingIndented.length) stroke.before = pendingIndented;
                            if (comment) stroke.comment = comment;
                            glyphs[current].push(stroke);
                        }
                        pendingIndented = [];
                        return;
                    }
                    // Neue Glyphe: offene eingerückte Kommentare gehören ans Ende der vorigen
                    if (current !== null && pendingIndented.length) metas[current].after = pendingIndented;
                    current = content.replace(/:\s*\|-?\s*$/, '').trim();
                    glyphs[current] = [];
                    metas[current] = { before: pendingTop, comment, after: [] };
                    pendingTop = [];
                    pendingIndented = [];
                });
                if (current !== null && pendingIndented.length) metas[current].after = pendingIndented;
                fileMeta.footer = pendingTop;

                const codes = Object.keys(glyphs);
                const count = codes.length;
                if (count === 0) {
                    this.showToast('Import fehlgeschlagen: keine Glyphen in der Datei.');
                    return;
                }
                codes.forEach(code => {
                    this.savedGlyphs[code] = glyphs[code];
                    const m = metas[code];
                    if (m.before.length || m.comment || m.after.length) this.glyphMeta[code] = m;
                    else delete this.glyphMeta[code];
                });
                if (fileMeta.header.length || fileMeta.footer.length) this.glyphMeta[''] = fileMeta;
                this.syncCombos();
                this.persist();
                this.renderSavedGlyphPreviews();
                this.render();
                this.showToast(`${count} Glyphen importiert.`);
            }

            loadGlyph(code) {
                if (!this.savedGlyphs[code]) return;

                this.strokes = withLayers(this.savedGlyphs[code]);
                this.selectedStrokeIdx = null;
                this.selectedPointIdx = null;
                this.resetToAddOrEdit();
                // Im Feld steht der Name ohne Breite; die Breite steht am grünen Anfasser
                const { base, width, offset, corner } = splitName(code);
                document.getElementById('saveCodeInput').value = base;
                this.glyphWidth = width;
                this.offset = offset;
                this.corner = corner;
                this.loadedCode = code;

                this.updateOutput();
                this.updateEditInfo();
                this.render();
            }

            // Vorschau-Canvas wie bei GlyphWiki: genau 0..200 auf das Canvas, 1:1, kein Rand, keine Korrektur
            // (was über die Box hinausragt, wird abgeschnitten)
            previewTransform(ctx, size) {
                ctx.setTransform(size / GRID, 0, 0, size / GRID, 0, 0);
            }

            // Eine gespeicherte Glyphe (Striche, Marks gedämpft; Verweise als die Glyphe selbst in ihrer Box) auf ein Canvas der Größe size
            drawGlyphThumb(ctx, code, size) {
                this.previewTransform(ctx, size);
                ctx.lineCap = this.lineCap;
                ctx.lineJoin = 'round';
                glyphPart(this.savedGlyphs[code]).forEach(stroke => {
                    const ref = stroke.type === 99 ? this.savedGlyphs[stroke.refName] : null;
                    if (ref) { // ein Verweis zeigt die Glyphe selbst in ihrer Box (ohne Rahmen und Beschriftung)
                        const [a, b] = stroke.points;
                        this.drawInBox(ctx, glyphPart(ref), Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y), false, 0, false);
                    } else this.drawShape(ctx, stroke.type, stroke.points, stroke.refName, false);
                });
                ctx.globalAlpha = 0.3; // Marks gedämpft
                marksPart(this.savedGlyphs[code]).forEach(stroke => {
                    this.drawShape(ctx, stroke.type, stroke.points, stroke.refName, false);
                });
                ctx.globalAlpha = 1;
            }

            // Die Kombinationen (Großbuchstabe + Kleinbuchstabe) als Schriftprobe: sortiert, oder mit dem Schalter gemischt
            // (die Reihenfolge bleibt beim Neuzeichnen gleich, solange der Schalter an ist; jedes Einschalten mischt neu; neue Kombinationen kommen an eine zufällige Stelle)
            renderCombos(codes) {
                const card = document.getElementById('comboCard'), flow = document.getElementById('comboFlow');
                card.classList.toggle('d-none', codes.length === 0);
                flow.innerHTML = '';
                const rank = (code) => { if (!this.comboRank.has(code)) this.comboRank.set(code, Math.random()); return this.comboRank.get(code); };
                const order = this.comboRank ? [...codes].sort((a, b) => rank(a) - rank(b)) : codes;
                order.forEach(code => {
                    const can = document.createElement('canvas');
                    can.width = 64;
                    can.height = 64;
                    can.title = code;
                    can.onclick = () => this.appMode === 'pick' ? this.addComponent(code) : this.loadGlyph(code);
                    this.drawGlyphThumb(can.getContext('2d'), code, 64);
                    flow.appendChild(can);
                });
            }

            renderSavedGlyphPreviews() {
                const container = document.getElementById('savedGlyphsContainer');
                const all = Object.keys(this.savedGlyphs).sort(glyphOrder);
                const isCombo = k => /^[A-Z]+[a-z]+$/.test(k);
                this.renderCombos(all.filter(isCombo));
                const keys = all.filter(k => !isCombo(k));

                if (keys.length === 0) {
                    container.innerHTML = '<p class="small bg-light text-body-secondary fst-italic mb-0" id="emptyGlyphsMsg">Noch keine Glyphen gespeichert.</p>';
                    return;
                }

                container.innerHTML = '';
                keys.forEach(code => {
                    const tile = document.createElement('div');
                    tile.className = 'glyph-tile';

                    const wrap = document.createElement('button');
                    wrap.type = 'button';
                    wrap.className = 'glyph-btn';
                    wrap.title = `${code} laden`;
                    wrap.onclick = () => this.appMode === 'pick' ? this.addComponent(code) : this.loadGlyph(code);

                    const del = document.createElement('button');
                    del.type = 'button';
                    del.className = 'btn-close position-absolute top-0 end-0 bg-white rounded-circle border';
                    del.style.cssText = 'font-size: .5rem; padding: .3rem; transform: translate(35%, -35%);';
                    del.title = `${code} löschen`;
                    del.setAttribute('aria-label', `${code} löschen`);
                    del.onclick = () => this.deleteGlyph(code);
                    tile.appendChild(wrap);
                    tile.appendChild(del);

                    const can = document.createElement('canvas');
                    can.width = 60;
                    can.height = 60;
                    this.drawGlyphThumb(can.getContext('2d'), code, 60);

                    const label = document.createElement('span');
                    label.className = 'glyph-name font-monospace fw-bold';
                    label.textContent = code;

                    wrap.appendChild(can);
                    wrap.appendChild(label);
                    container.appendChild(tile);
                });
            }

            // --- ZEICHNEN & RENDER METHODEN ---

            addStroke(type, points, refName = "") {
                this.strokes.push({ type, points, refName, layer: this.layer });
                this.updateOutput();
            }

            render() {
                // Canvas hat mehr Pixel als das Raster, damit es skaliert scharf bleibt
                this.ctx.setTransform(this.canvas.width / GRID, 0, 0, this.canvas.height / GRID, 0, 0);
                this.ctx.clearRect(0, 0, GRID, GRID);

                // Aktives Werkzeug hervorheben
                document.querySelectorAll('.tool-add-btn').forEach(b => {
                    b.classList.toggle('active', this.appMode !== 'edit' && parseInt(b.dataset.tool) === this.activeTool);
                });
                document.querySelectorAll('.layer-btn').forEach(btn => {
                    const on = btn.dataset.layer === this.layer;
                    btn.classList.toggle('btn-primary', on);
                    btn.classList.toggle('btn-outline-primary', !on);
                    btn.setAttribute('aria-pressed', on);
                });
                const markCount = this.strokes.filter(s => s.layer === 'marks').length;
                const counter = document.getElementById('marksCount');
                counter.textContent = `${markCount}/${MARK_COUNT}`;
                counter.classList.toggle('text-danger', markCount !== 0 && markCount !== MARK_COUNT);
                // Im Auswahlmodus die Glyphen-Liste als Ziel hervorheben
                document.getElementById('savedGlyphsCard').classList.toggle('border-primary', this.appMode === 'pick');

                // Guides: 3x3-Raster heller, Mittellinien kräftiger
                this.ctx.lineWidth = 0.5;
                const guide = (v, color) => {
                    this.ctx.strokeStyle = color;
                    this.ctx.beginPath(); this.ctx.moveTo(v, 0); this.ctx.lineTo(v, GRID); this.ctx.stroke();
                    this.ctx.beginPath(); this.ctx.moveTo(0, v); this.ctx.lineTo(GRID, v); this.ctx.stroke();
                };
                THIRD_GUIDES.forEach(v => guide(v, '#e2e8f0'));
                [MARGIN, GRID - MARGIN].forEach(v => guide(v, '#fca5a5')); // Randlinien 12 Einheiten vom Rand
                CENTER_GUIDES.forEach(v => guide(v, '#cbd5e1'));

                this.ctx.lineCap = this.lineCap;
                this.ctx.lineJoin = 'round';

                // Erst die andere Ebene gedämpft, darüber die aktuelle
                this.strokes.forEach((stroke, idx) => {
                    if (stroke.layer === this.layer) return;
                    this.ctx.globalAlpha = 0.2;
                    this.drawShape(this.ctx, stroke.type, stroke.points, stroke.refName, false);
                    this.ctx.globalAlpha = 1;
                });
                this.strokes.forEach((stroke, idx) => {
                    if (stroke.layer !== this.layer) return;
                    const isSelected = (this.appMode === 'edit' && this.selectedStrokeIdx === idx);
                    this.drawShape(this.ctx, stroke.type, stroke.points, stroke.refName, isSelected);
                });
                // Ebene Marks: Nummer jeder Markierung (Reihenfolge = markierte Form 1–6) an ihrer Mitte
                if (this.layer === 'marks') {
                    this.strokes.filter(s => s.layer === 'marks').forEach((s, n) => {
                        const a = s.points[0], b = s.points[s.points.length - 1];
                        this.drawLabel(`${n + 1}`, (a.x + b.x) / 2, (a.y + b.y) / 2);
                    });
                }

                // Breite (grüner vertikaler Guide, Anfasser auf der unteren Kante) und Versatz (grüner Punkt)
                if (this.showsWidth()) {
                    Object.entries(HANDLES).reverse().forEach(([key, h]) => {
                        const p = h.get(this);
                        const selected = this.handleSelected === key;
                        if (key === 'width') {
                            this.ctx.strokeStyle = '#22c55e';
                            this.ctx.lineWidth = 0.75;
                            this.ctx.beginPath(); this.ctx.moveTo(p.x, 0); this.ctx.lineTo(p.x, GRID); this.ctx.stroke();
                        }
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, selected ? 6 : 5, 0, Math.PI * 2);
                        this.ctx.fillStyle = '#16a34a';
                        this.ctx.fill();
                        this.ctx.strokeStyle = '#fff';
                        this.ctx.lineWidth = 1.5;
                        this.ctx.stroke();
                        if (selected) {
                            const text = key === 'width' ? `${p.x}` : `${p.x},${p.y}`;
                            this.drawLabel(text, p.x, key === 'width' ? GRID - 8 : Math.max(p.y, 12));
                        }
                    });
                }

                // Fangradius um den Mauszeiger beim Ziehen
                if (this.drag?.raw) {
                    this.ctx.beginPath();
                    this.ctx.arc(this.drag.raw.x, this.drag.raw.y, SNAP_RADIUS, 0, Math.PI * 2);
                    this.ctx.fillStyle = 'rgba(100, 116, 139, 0.15)';
                    this.ctx.fill();
                }

                // Punkte des ausgewählten Strokes hervorheben
                if (this.appMode === 'edit' && this.selectedStrokeIdx !== null) {
                    this.strokes[this.selectedStrokeIdx].points.forEach((p, pIdx) => {
                        const active = this.selectedPointIdx === pIdx;
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, active ? 5 : 4, 0, Math.PI * 2);
                        this.ctx.fillStyle = active ? '#fbbf24' : '#3b82f6';
                        this.ctx.fill();
                        this.ctx.strokeStyle = '#fff';
                        this.ctx.lineWidth = 1.5;
                        this.ctx.stroke();
                    });
                    this.strokes[this.selectedStrokeIdx].points.forEach(p => this.drawCoord(p));
                }

                // Unfertige Klick-Punkte beim Zeichnen
                if (this.appMode === 'add') {
                    this.currentPoints.forEach((p, index) => {
                        this.ctx.fillStyle = '#ef4444';
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                        this.ctx.fill();
                        const prefix = this.activeTool === 2 ? (index === 0 ? 'Start ' : 'Kontrollpkt ') : '';
                        this.drawCoord(p, prefix);
                    });
                }

                this.renderPreview();
            }

            // Koordinaten neben einem Punkt; auf dem Canvas gezeichnet, blockiert also keine Klicks
            drawCoord(p, prefix = '') {
                this.drawLabel(`${prefix}${p.x},${p.y}`, p.x, p.y);
            }

            drawLabel(text, x, y) {
                const c = this.ctx;
                c.save();
                c.font = '5px monospace';
                const tx = Math.min(x + 5, GRID - c.measureText(text).width - 1);
                const ty = Math.max(y - 5, 6);
                c.lineWidth = 1.5;
                c.lineJoin = 'round';
                c.strokeStyle = '#fff';
                c.strokeText(text, tx, ty);
                c.fillStyle = '#1e3a8a';
                c.fillText(text, tx, ty);
                c.restore();
            }

            // frame = false zeichnet Komponenten ohne gestrichelten Rahmen und Namen (für die Vorschau)
            drawShape(ctx, type, points, refName, isSelected = false, depth = 0, frame = true) {
                if (depth > 10) return; // Verhindert Endlosschleifen durch zirkuläre Referenzen

                ctx.beginPath();
                ctx.strokeStyle = isSelected ? '#3b82f6' : '#0f172a';
                ctx.lineWidth = isSelected ? this.strokeWidth + 2 : this.strokeWidth;

                if (type === 1) {
                    ctx.moveTo(points[0].x, points[0].y);
                    ctx.lineTo(points[1].x, points[1].y);
                    ctx.stroke();
                } else if (type === 2) {
                    ctx.moveTo(points[0].x, points[0].y);
                    ctx.quadraticCurveTo(points[1].x, points[1].y, points[2].x, points[2].y);
                    ctx.stroke();
                } else if (type === 99) {
                    const [p1, p2] = points;
                    const x = Math.min(p1.x, p2.x);
                    const y = Math.min(p1.y, p2.y);
                    const w = Math.abs(p2.x - p1.x);
                    const h = Math.abs(p2.y - p1.y);

                    if (frame) {
                        ctx.save();
                        ctx.strokeStyle = isSelected ? '#2563eb' : '#94a3b8';
                        ctx.fillStyle = isSelected ? 'rgba(37, 99, 235, 0.1)' : 'transparent';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 4]);
                        ctx.fillRect(x, y, w, h);
                        ctx.strokeRect(x, y, w, h);
                        ctx.setLineDash([]);
                        ctx.fillStyle = isSelected ? '#1e40af' : '#64748b';
                        ctx.font = '10px monospace';
                        ctx.fillText(refName, x + 4, y + 12);
                        ctx.restore();
                    }

                    // Referenzierte Glyphe in die Box einpassen
                    this.drawInBox(ctx, glyphPart(this.savedGlyphs[refName] || []), x, y, w, h, isSelected, depth + 1, frame);
                }
            }

            // Striche einer Glyphe (200er Raster) in eine Box einpassen
            drawInBox(ctx, strokes, x, y, w, h, isSelected = false, depth = 0, frame = true) {
                strokes.forEach(s => {
                    const mapped = s.points.map(p => ({ x: x + (p.x / GRID) * w, y: y + (p.y / GRID) * h }));
                    this.drawShape(ctx, s.type, mapped, s.refName, isSelected, depth, frame);
                });
            }

            // Vorschau über der Malfläche: alle Kombinationen Großbuchstabe + Kleinbuchstabe, die die Glyphe im
            // Namensfeld enthalten (nur reine Groß- oder Kleinbuchstaben, die gespeichert sind). Nichts davon wird
            // gespeichert. Der Großbuchstabe füllt 0 bis zu seiner Breite, der Kleinbuchstabe den Rest. Die
            // bearbeitete Glyphe kommt live von der Malfläche (Striche und Breite).
            renderPreview() {
                const box = document.getElementById('comboPreview');
                const name = document.getElementById('saveCodeInput').value.trim();
                const keys = Object.keys(this.savedGlyphs).sort(glyphOrder);
                const upperKeys = keys.filter(k => isUpperName(splitName(k).base));
                const lowerKeys = keys.filter(k => /^[a-z]+$/.test(k));

                // Live von der Malfläche nur, wenn die Glyphe im Namensfeld auch geladen ist
                const live = this.loadedCode !== null && splitName(this.loadedCode).base === name;
                let combos = [];

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reader | Qatt.org</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/navigation.js"></script>
  <script src="js/fonts.js"></script>
  <style>
    /* the fonts of the old slides app, from fonts/reader/ (Lexend for the text, Mansalva for titles; both SIL Open Font License): QATT Pen Medium comes before the generic family, or it would never be used for the QATT characters */
@font-face { font-family: "Lexend"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(fonts/reader/lexend-vietnamese.woff2) format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: "Lexend"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(fonts/reader/lexend-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Lexend"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(fonts/reader/lexend-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Mansalva"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/reader/mansalva-vietnamese.woff2) format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: "Mansalva"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/reader/mansalva-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Mansalva"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/reader/mansalva-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    /* the QATT characters (U+F0000 to U+F00A3) always from QATT Pen Medium, in front of every other font (the same files as js/fonts.js, so they are loaded once) */
    @font-face { font-family: "QATT Cells"; src: url(fonts/qatt-pen-medium.woff2?v=6) format("woff2"), url(fonts/qatt-pen-medium.ttf?v=6) format("truetype"); unicode-range: U+F0000-F00A3; }
    .reader { --read-font: "QATT Cells", "Lexend", "QATT Pen Medium", sans-serif; --title-font: "QATT Cells", "Mansalva", "QATT Pen Medium", cursive; font-family: var(--read-font); max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    .reader a, .reader select, .reader button { font-family: var(--read-font); }
    .reader article h2 { font-family: var(--title-font); }   /* the font of the titles only: the labels and the list are in the body font */
    .reader .bar { display: flex; align-items: center; justify-content: space-between; min-height: 2.2rem; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .reader select { border: 0; border-bottom: 1px solid var(--bs-border-color); background: transparent; color: var(--bs-body-color); font-size: 1.05rem; padding: .2rem 1.6rem .2rem .1rem; border-radius: 0; }
    .reader .list { list-style: none; margin: 0; padding: 0; }
    .reader .list li { border-bottom: 1px solid var(--bs-border-color); }
    .reader .list a { display: flex; align-items: baseline; gap: 1rem; padding: .95rem .2rem; text-decoration: none; color: var(--bs-body-color); font-size: 1.5rem; line-height: 1.35; }
    .reader .list a:hover, .reader .list a:focus-visible { color: var(--accent, var(--bs-link-color)); }
    .reader .list .no { flex: 0 0 2rem; text-align: right; font-size: .85rem; color: var(--bs-tertiary-color); font-variant-numeric: tabular-nums; }
    .reader .list .draft { margin-left: auto; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--bs-tertiary-color); }
    .reader .empty { color: var(--bs-secondary-color); padding: 2rem 0; }
    .reader .back { display: inline-block; color: var(--bs-secondary-color); text-decoration: none; font-size: 1.05rem; }
    .reader .back[hidden] { display: none; }
    .reader .back:hover { color: var(--accent, var(--bs-link-color)); }
    main.reader article h2 { border: 0; padding-bottom: 0; }   /* a theme may draw a line under h2 */
    .reader article h2 { font-size: 2.35rem; line-height: 1.25; font-weight: 400; margin: 1.4rem 0 1.6rem; text-align: center; text-shadow: 1px 2px 5px rgb(0 0 0 / 15%); }
    .reader article h2 small { display: block; font-size: .95rem; letter-spacing: .08em; color: var(--bs-secondary-color); }
    .reader .body { font-size: 1.05rem; line-height: 1.75; }
    .reader .body small, .reader .body .small { font-size: .9em; }
    .reader .body b { color: var(--bs-emphasis-color); }
    .reader .body figure { margin: 1.2em 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .6em 1.2em; }
    .reader .body img:not(.layer) { display: block; max-width: 70%; height: auto; margin: 1em auto; border: 1px solid var(--bs-border-color); border-radius: 1000px; box-shadow: 4px 6px 12px rgb(0 0 0 / 10%); }
    .reader .body var { display: inline-block; font-style: normal; line-height: 1em; padding: 2px 8px 4px; border: 1px solid var(--bs-border-color); border-radius: 100px; color: var(--bs-secondary-color); background: var(--bs-tertiary-bg); }
    .reader .body button.reveal { font: inherit; font-size: 1.1rem; padding: .35rem 1.1rem; border: 1px solid var(--bs-border-color); border-radius: 100px; background: transparent; color: var(--bs-secondary-color); cursor: pointer; }
    .reader .body button.reveal:hover { color: var(--accent, var(--bs-link-color)); border-color: currentColor; }
    /* a QATT character drawn from picture layers (img/qatt/*.jpg, black on white), with its label below */
    .reader .glyph { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .25rem; }
    .reader label { font-size: 1.5em; padding: 0 2px; }
    .reader figure label { font-size: 1.15em; font-weight: 500; }
    .reader .layers { position: relative; display: inline-block; width: 3.15rem; aspect-ratio: 1 / 1; margin: .5em 0; text-align: center; }
    .reader .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; filter: grayscale(100%) contrast(400%) brightness(1.2); }
    .reader .empty-left .layer { left: -.75em; }
    .reader .empty-right .layer { left: .2em; }
    [data-bs-theme="dark"] .reader .layer { mix-blend-mode: screen; filter: grayscale(100%) contrast(400%) brightness(1.2) invert(1); }
    /* QATT characters of the QATT font ([stack:a,b]), not drawings */
    .reader .qatt-glyph { display: inline-block; vertical-align: middle; font-family: "QATT Pen Medium"; font-size: 1.35em; line-height: 1.5; min-width: 1.2em; text-align: center; }   /* only a little larger than the Latin text */
    .reader figure .layers, .reader figure .qatt-glyph { box-sizing: content-box; border-radius: 2.5rem; background: light-dark(white, transparent); box-shadow: 2px 3px 8px rgb(0 0 0 / 10%); }
    .reader .stack .qatt-glyph { font-size: 2.1em; line-height: 1.2; }
    .reader .stack label { font-size: 1.1em; }
    .reader figure .layers { width: 6.5rem; padding: 1em; }
    .reader figure .qatt-glyph { min-width: 2.2em; padding: .2em .8em; }
    /* the merge animation: [anim-merge:a,b,c] */
    .reader .merge { position: relative; margin: 1.5rem auto; aspect-ratio: 16 / 9; overflow: hidden; border-radius: .75rem; background: radial-gradient(ellipse at center, #2b2b30, #0d0d10); color: #fff; box-shadow: 0 4px 16px rgb(0 0 0 / 30%); }   /* like an embedded video */
    .reader .merge-host { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; perspective: 700px; cursor: pointer; }
    .reader .merge-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4.25rem; height: 3rem; padding: 0; border: 0; border-radius: .9rem; background: #f00; color: #fff; display: flex; align-items: center; justify-content: center; opacity: .92; cursor: pointer; }
    .reader .merge-play:hover { opacity: 1; }
    .reader .merge-play[hidden] { display: none; }
    .reader .nchar { text-align: center; position: relative; }
    .reader .nchar.n3 { position: absolute; inset: 0; opacity: 0; }
    .reader .nchar .qg { font-family: "QATT Cells", "QATT Pen Medium", sans-serif; font-size: clamp(2.6rem, 12vw, 4.6rem); line-height: 1; }
    .reader .nchar small { display: block; font-family: Georgia, serif; opacity: .6; font-size: 1rem; }
    .reader .pager { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--bs-border-color); font-size: 1.05rem; }
    .reader .pager a { color: var(--bs-body-color); text-decoration: none; max-width: 40%; }
    .reader .pager a:hover { color: var(--accent, var(--bs-link-color)); }
    .reader .pager .count { color: var(--bs-tertiary-color); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .reader .pager .gone { visibility: hidden; }
    @media (max-width: 575.98px) { .reader { padding-left: .8rem; padding-right: .8rem; } .reader .body { font-size: .95rem; } .reader article h2 { font-size: 1.9rem; } }
  </style>
</head>
<body>
  <main class="reader">
    <div class="bar">
      <a class="back" id="back" href="#" hidden>← <span data-vi="Tất cả bài">All texts</span></a>
      <select id="group" aria-label="Collection" data-vi-aria-label="Bộ sưu tập" hidden></select>
    </div>
    <div id="view"><p class="empty" data-vi="Đang tải…">Loading…</p></div>
  </main>

  <script src="vendor/supabase/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/qatt-text.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const DEFAULT_GROUP = 'thuphap';
    const view = $('#view'), groupSelect = $('#group'), back = $('#back');
    const t = (en, vi) => (window.Lang && Lang.t) ? Lang.t(en, vi) : en;
    const db = new SupabaseService();
    let slides = [], group = '';   // the slides of the chosen group, in order

    // --- the text of a slide: the notation of the old slides app, see the table `slides` ---
    // ←↑↓→ big arrows; blank line = line break; **bold**; ((a box)); [img:url] a picture; [#label: text] a button that reveals text;
    // [anim-merge:word1,word2,word3] the animation of two characters that fly in, turn and merge into the third (a play button; a click starts it, every click again starts it anew)
    // a format has a prefix and a colon (img:, stack:, anim-merge:, #label:); only Label has a space (or a colon); without a colon [x] is [stack:x]
    // [stack:x] x (text with QATT characters) above, below it its reading in Quốc Ngữ (the QATT cells converted), smaller
    // [label code] or [label:code] a QATT glyph from layers of pictures a+b+c (img/qatt/a.jpg …); the label (any of this again, with {} for []) below it
    // the HTML of a slide may use only these tags, and a class on them (no other attributes, no links, no scripts)
    const TAGS = new Set(['BR', 'SMALL', 'SPAN', 'EM', 'I', 'STRONG', 'B', 'BIG', 'VAR', 'FIGURE', 'UL', 'OL', 'LI', 'P', 'SUP', 'SUB', 'DIV']);
    const IMG = 'img/qatt/';   // the pictures: relative names are in this folder (the old <base>)
    const imageUrl = u => /^(https?:\/\/|\/)/.test(u) ? u : IMG + u.replace(/^\.?\//, '');
    function prepare(text, tokens) {
      const keep = tok => `\u0001${tokens.push(tok) - 1}\u0001`;
      return (text || '').replace(/\r/g, '')
        .replace(/([←↑↓→])/g, '<big><big><b>&nbsp;$1&nbsp;</b></big></big>')
        .replace(/\n\n+/g, '<br><br>')
        .replace(/\*\*([^\n*]+)\*\*/g, '<b>$1</b>')
        .replace(/\(\(([^\n)]+)\)\)/g, '<var>$1</var>')
        .replace(/\[(.*?)\]/g, (all, inner) => {
          const c = inner.trim();
          if (c.startsWith('img:')) return keep({ t: 'img', url: c.slice(4).trim() });
          if (c.startsWith('stack:')) return keep({ t: 'stack', text: c.slice(6).trim() });
          if (c.startsWith('anim-merge:')) return keep({ t: 'merge', words: c.slice(11).split(',').map(w => w.trim()) });
          if (c.startsWith('#')) {
            const i = c.indexOf(':');
            return keep({ t: 'reveal', label: i < 0 ? 'Hiện' : c.slice(1, i).trim(), text: i < 0 ? c.slice(1).trim() : c.slice(i + 1).trim() });
          }
          // Label: `[label code]` or `[label:code]` (the code is ASCII: layers a+b+c); no colon (and no label) = stack, `[x]` is `[stack:x]`; text with QATT cells is always a stack
          const cut = c.lastIndexOf(' ') >= 0 ? c.lastIndexOf(' ') : c.indexOf(':');
          const def = cut < 0 ? '' : c.slice(cut + 1).trim();
          if (cut < 0 || QattText.cells(c).length || !/^[\w+|:.\-]+$/.test(def)) return keep({ t: 'stack', text: c });
          const label = c.slice(0, cut).trim().replace(/\{/g, '[').replace(/\}/g, ']');
          return keep({ t: 'glyph', parts: def.split(/[+:|]/), label });
        });
    }
    const speak = text => { try { const u = new SpeechSynthesisUtterance(text); u.lang = 'vi-VN'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { /* no speech: fine */ } };
    // the animation of admin/animations.html ("Name, two characters"), set to: turn 25%, speed 800%, wait 1.5 s, cross-fade 0.2 s, distance 20 px
    const MERGE = { turn: .25, speed: 8, wait: 1500, fade: 200, dist: 20 };
    function merge(words) {
      const box = el('div', 'merge'), host = el('div', 'merge-host'), go = el('button', 'merge-play'); go.type = 'button'; go.setAttribute('aria-label', 'Play');
      go.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
      let els = [], tl = null, gap = 0;
      const glyph = w => (w && typeof QattText !== 'undefined' && typeof VietnameseParser !== 'undefined' && QattText.word(w, new VietnameseParser())) || '';
      const mk = w => { const d = el('div', 'nchar'); d.append(el('div', 'qg', glyph(w)), el('small', '', w)); return d; };
      function build() {
        host.textContent = ''; host.style.gap = MERGE.dist + 'px';
        els = words.slice(0, 2).map(mk); host.append(...els);
        els[0].append(Object.assign(mk(words[2]), { className: 'nchar n3' }));   // the third character, laid over the first
        if (els[1]) { const r = els.map(e => e.getBoundingClientRect()); gap = r[1].left + r[1].width / 2 - (r[0].left + r[0].width / 2); }
      }
      function play() {
        const A = window.anime;
        if (!A || words.length < 3 || !els[1]) return;
        tl && tl.pause();
        build();
        const { animate, stagger, createTimeline } = A;
        const D = 1400 / MERGE.speed, W = 1300 + MERGE.wait, M = Math.max(D * MERGE.turn, 30), FADE = MERGE.fade * D / 1400;
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        tl = createTimeline({ defaults: { ease: 'outBack(2.2)' } });
        if (reduce) { tl.add(els, { opacity: [0, 1], duration: 300 }); }
        else tl.add(els, { translateY: [-220, 0], rotateX: [100, 0], rotateZ: [() => A.utils.random(-60, 60), 0], scale: [.2, 1], opacity: [0, 1], duration: 1100 }, stagger(160))
          .add(els, { translateY: [0, -18, 0], duration: 900, ease: 'inOutSine' }, stagger(110, { start: 400 }))
          .add(els, { rotateY: [0, 360], duration: D, ease: 'outQuad' }, W);
        tl.call(() => speak(words[2]), W)   // the third word is read when the turn starts (after the fly-in and the wait)
          .add(els, { translateX: (e, i) => [0, i ? -gap / 2 : gap / 2], duration: M, ease: 'outQuad' }, W)
          .call(() => {   // the first fades into the third character, the second fades out
            const ov = els[0].querySelector('.n3'), q = els[0].children, o = { duration: FADE, ease: 'inOutSine' };
            animate([q[0], q[1], els[1]], { opacity: 0, ...o }); animate(ov, { opacity: 1, ...o });
          }, W + M - FADE / 2);
      }
      build();
      const start = () => { go.hidden = true; play(); };
      go.addEventListener('click', start);
      host.addEventListener('click', start);
      box.append(host, go);
      return box;
    }
    function build(tok) {
      if (tok.t === 'img') {
        const img = document.createElement('img'); img.src = imageUrl(tok.url); img.alt = ''; img.loading = 'lazy';
        img.onerror = () => img.remove();
        return img;
      }
      if (tok.t === 'merge') return merge(tok.words);
      if (tok.t === 'reveal') {
        const b = el('button', 'reveal', tok.label); b.type = 'button';
        b.addEventListener('click', () => { b.textContent = tok.text; speak(tok.text); b.blur(); });
        return b;
      }
      if (tok.t === 'stack') {   // the QATT text above, its reading in Quốc Ngữ (every cell by the default decoding) below, smaller
        const box = el('div', 'glyph stack'), parser = new VietnameseParser();
        const read = tok.text.replace(QattText.CELL, c => ' ' + QattText.reading(c, parser) + ' ').replace(/\s+/g, ' ').trim();
        box.append(el('span', 'qatt-glyph', tok.text), el('label', '', read));
        return box;
      }
      const parts = tok.parts.slice();
      if (parts.length === 1 && parts[0].endsWith('.jpg')) parts[0] = '../can/' + parts[0].replace('.jpg', '');
      const glyph = el('div', 'layers' + (parts.some(p => p.includes('left')) ? '' : ' empty-left') + (parts.some(p => p.includes('right')) ? '' : ' empty-right'));
      for (const p of parts) { const img = el('img', 'layer'); img.src = `${IMG}${p}.jpg?6`; img.alt = p; glyph.append(img); }
      if (!tok.label) return glyph;
      const box = el('div', 'glyph'), label = el('label');
      render(tok.label, label);
      box.append(glyph, label);
      return box;
    }
    function clean(html, tokens, into) {
      const doc = new DOMParser().parseFromString('<body>' + html, 'text/html');
      const walk = (from, to) => {
        for (const n of from.childNodes) {
          if (n.nodeType === 3) {
            let last = 0, m; const MARK = /\u0001(\d+)\u0001/g;   // one for each text node: build() renders labels inside the loop
            const s = n.textContent;
            while ((m = MARK.exec(s))) {
              to.append(s.slice(last, m.index));
              if (tokens[+m[1]]) to.append(build(tokens[+m[1]]));
              last = m.index + m[0].length;
            }
            to.append(s.slice(last));
          } else if (n.nodeType === 1) {
            if (!TAGS.has(n.tagName)) { walk(n, to); continue; }   // an unknown tag: only its content
            const e = document.createElement(n.tagName.toLowerCase());
            const c = n.getAttribute('class');
            if (c && /^[\w\- ]+$/.test(c)) e.className = c;
            walk(n, e); to.append(e);
          }
        }
      };
      walk(doc.body, into);
      return into;
    }
    const render = (text, into) => { const tokens = []; return clean(prepare(text, tokens), tokens, into); };
    const plain = text => { const d = document.createElement('div'); clean(prepare(text, []).replace(/<br\s*\/?>/gi, ' '), [], d); return d.textContent.replace(/\s+/g, ' ').trim(); };
    // the text of a slide in the language of the menu (Lang): `content` is Vietnamese, `english` English; where the chosen one is missing the other is shown (English first)
    const textOf = s => {
      const vi = (s.content || '').trim() ? s.content : '', en = (s.english || '').trim() ? s.english : '';
      return window.Lang && Lang.current === 'vi' ? (vi || en) : (en || vi);
    };
    const heading = s => (s.title || '').split('#')[0];   // "Thanh Điệu #1": the part after # is for the order only
    const titleOf = s => plain(heading(s)) || plain(textOf(s)).slice(0, 60) || '—';

    // --- the two views: the list and one text; the address says which (#group/id) ---
    const el = (tag, cls, text, vi) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (vi) e.dataset.vi = vi; return e; };
    const link = (cls, href, ...kids) => { const a = el('a', cls); a.href = href; a.append(...kids); return a; };
    const go = id => '#' + encodeURIComponent(group) + (id == null ? '' : '/' + id);

    function showList() {
      document.title = 'Reader | Qatt.org';
      back.hidden = true;
      view.replaceChildren();
      if (!slides.length) { view.append(el('p', 'empty', 'Nothing to read here yet.', 'Chưa có gì để đọc ở đây.')); return; }
      const ul = el('ul', 'list');
      slides.forEach((s, i) => {
        const li = el('li'), a = link('', go(s.id), el('span', 'no', i + 1), el('span', 't', titleOf(s)));
        if (!s.is_public) a.append(el('span', 'draft', 'draft', 'nháp'));
        li.append(a); ul.append(li);
      });
      view.append(ul);
      window.scrollTo(0, 0);
    }

    function showSlide(i) {
      const s = slides[i];
      view.replaceChildren();
      const art = el('article'), h = el('h2');
      render(heading(s), h);
      if (!h.textContent.trim()) h.textContent = '';
      art.append(h);
      const cls = /^[\w\- ]*$/.test(s.classes || '') ? (s.classes || '') : '';
      const body = el('div', 'body ' + (cls.includes('text-start') ? cls : 'text-center ' + cls));   // centred unless the slide says text-start
      render(textOf(s), body);
      art.append(body);
      const prev = slides[i - 1], next = slides[i + 1];
      const pager = el('nav', 'pager');
      pager.append(
        prev ? link('', go(prev.id), '← ', el('span', '', 'Previous', 'Trước')) : el('span', 'gone', '.'),
        el('span', 'count', (i + 1) + ' / ' + slides.length),
        next ? link('', go(next.id), el('span', '', 'Next', 'Sau'), ' →') : el('span', 'gone', '.'));
      back.href = go(); back.hidden = false;
      view.append(art, pager);
      document.title = titleOf(s) + ' | Qatt.org';
      window.scrollTo(0, 0);
    }

    function route() {
      const [g, id] = decodeURIComponent(location.hash.slice(1)).split('/');
      if (g && g !== group && [...groupSelect.options].some(o => o.value === g)) { groupSelect.value = g; return load(g).then(route); }
      const i = id == null ? -1 : slides.findIndex(s => String(s.id) === id);
      i < 0 ? showList() : showSlide(i);
    }

    async function load(g) {
      group = g;
      slides = (await db.getSlides(g, admin)).slice().sort((a, b) => a.order - b.order);
    }

    let admin = false;
    async function start() {
      admin = typeof isAdmin === 'function' && isAdmin();
      await db.initQuiet();
      const all = await db.getSlides('', admin);   // for the groups: the collections that have something to read
      const groups = [...new Set(all.map(s => s.group))].sort();
      groupSelect.replaceChildren(...groups.map(g => new Option(g, g)));
      groupSelect.hidden = groups.length < 2;
      const wanted = decodeURIComponent(location.hash.slice(1)).split('/')[0];
      group = groups.includes(wanted) ? wanted : groups.includes(DEFAULT_GROUP) ? DEFAULT_GROUP : groups[0] || '';
      groupSelect.value = group;
      slides = all.filter(s => s.group === group).sort((a, b) => a.order - b.order);
      route();
    }

    groupSelect.addEventListener('change', async () => { await load(groupSelect.value); location.hash = go(); showList(); });
    window.addEventListener('hashchange', route);
    document.addEventListener('langchange', route);   // the language of the menu changed: draw the text again in it
    document.addEventListener('keydown', e => {   // arrows turn the page, Escape goes back to the list
      const [, id] = decodeURIComponent(location.hash.slice(1)).split('/');
      if (id == null || e.target.closest('select, input, textarea')) return;
      const i = slides.findIndex(s => String(s.id) === id);
      if (e.key === 'ArrowLeft' && slides[i - 1]) location.hash = go(slides[i - 1].id);
      else if (e.key === 'ArrowRight' && slides[i + 1]) location.hash = go(slides[i + 1].id);
      else if (e.key === 'Escape') location.hash = go();
    });
    start().catch(e => { console.error(e); view.replaceChildren(el('p', 'empty', 'The texts could not be loaded.', 'Không tải được các bài.')); });
  })();
  </script>
</body>
</html>

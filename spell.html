<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spell it!</title>
  <meta name="description" content="Spell a Vietnamese word in Quốc Âm Tân Tự: find the symbols of onset and rhyme, then the tone.">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/navigation.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/qatt-text.js"></script>
  <script defer src="js/fonts.js"></script>
  <script src="vendor/supabase/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
  <style>
    :root { --qfont: "QATT Pen Medium"; --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; }
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .hero .han { color: var(--cinnabar); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .5rem; margin-bottom: .8rem; }
    .word { font-family: Georgia, "Times New Roman", serif; font-size: 1.6rem; line-height: 1.1; color: var(--ink); text-align: left; overflow-wrap: anywhere; }
    .mood { text-align: center; font-size: 2.6rem; line-height: 1.2; }
    .cells { display: flex; justify-content: center; margin: 0 auto 1.6rem; width: max-content; max-width: 100%; border: 2px solid #cdbd9a; border-radius: .8rem; overflow: hidden; }
    .cell { width: 7rem; height: 7rem; display: flex; align-items: center; justify-content: center; font-family: var(--qfont), sans-serif; font-size: 5.2rem; line-height: 1; color: var(--ink); }
    .cell + .cell { border-left: 2px solid #cdbd9a; }
    .cell { background: var(--bs-warning-bg-subtle); transition: background-color .3s ease, color .3s ease; }
    .cell.near { background: var(--bs-warning-border-subtle); color: rgba(43, 33, 24, .4); }
    .cell.solved { background: var(--bs-success-border-subtle); color: #0f5132; }
    .cell .g { display: inline-block; }
    .cell.pop .g { animation: pop .35s ease-out; }
    .cell.pop { animation: flash .45s ease-out; }
    @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes flash { 0% { filter: brightness(1.12); } 100% { filter: none; } }
    .cells.two .cell.pop .g { animation-name: pop2; }
    @keyframes pop2 { 0% { opacity: 0; transform: scale(.45, .6); } 60% { opacity: 1; transform: scale(.84, 1.12); } 100% { opacity: 1; transform: scale(.75, 1); } }
    .mood { display: block; }
    .mood.bounce { animation: bounce .5s ease-out; }
    .mood.shake { animation: shake .4s ease-in-out; }
    @keyframes bounce { 0% { transform: scale(.7); } 40% { transform: translateY(-.5rem) scale(1.2); } 70% { transform: translateY(.1rem) scale(.95); } 100% { transform: none; } }
    @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-.4rem) rotate(-8deg); } 40% { transform: translateX(.4rem) rotate(8deg); } 60% { transform: translateX(-.3rem) rotate(-5deg); } 80% { transform: translateX(.2rem) rotate(3deg); } }
    .cells.two .cell { width: 5.25rem; }   /* two cells: the box is squeezed to 75% of its width, like the glyphs */
    .cells.two .g { transform: scale(.75, 1); }
    #variants, #bases, #tones { margin-top: .8rem; }
    .tones { display: flex; justify-content: center; gap: 1.6rem; }
    .tones .block { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: .3rem; }
    .tones .gbtn { width: 4.2rem; height: 4.2rem; }
    .pad.grid3 { gap: .5rem; max-width: 15rem; }   /* 6 shapes in two rows of 3 */
    .grid3 .gbtn { width: calc((100% - 1rem) / 3); height: auto; aspect-ratio: 1; font-size: 2.6rem; }
    .pad { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; max-width: 46rem; margin-inline: auto; }
    .pad .group { display: flex; gap: .4rem; padding: .3rem; border: 1px dashed #dccfb2; border-radius: .6rem; }
    .gbtn { font-family: var(--qfont), sans-serif; font-size: 2.2rem; line-height: 1; width: 3.4rem; height: 3.4rem; padding: 0; background: var(--b, var(--bs-body-bg)); border: 2px solid var(--bc, #d9ccb0); border-radius: .55rem; box-shadow: 0 2px 0 var(--bc, #d9ccb0); color: var(--ink); transition: background-color .25s, border-color .25s, color .25s, opacity .25s, transform .12s, box-shadow .12s; }
    /* the kinds of buttons in their own colours: shapes cream, marked forms blue, tones orange */
    #basePad { --b: #fff8e6; --bc: #cdb98a; }
    #variantPad { --b: #e3eef8; --bc: #92b4d3; }
    #tonePad { --b: #fde7cf; --bc: #e0a766; }
    .gbtn:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px); }
    .gbtn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
    .gbtn.ok:disabled { background: #d1e7dd; border-color: #198754; box-shadow: 0 2px 0 #198754; color: #0f5132; opacity: 1; }
    .gbtn.bad:disabled { background: #f8d7da; border-color: #dc3545; box-shadow: 0 2px 0 #dc3545; color: #842029; opacity: 1; animation: shake .4s ease-in-out; }
    .gbtn.ok:disabled { animation: okpop .35s ease-out; }
    @keyframes okpop { 0% { transform: scale(.9); } 50% { transform: scale(1.12); } 100% { transform: none; } }
    .gbtn.fresh { animation: rise .3s ease-out backwards; animation-delay: calc(var(--i, 0) * 35ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(.5rem) scale(.9); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    /* the cards like a retro game: tinted, a thick outline and a hard shadow */
    .game { max-width: 34rem; }
    .game .tool, .game .tool-btn { font-size: .8rem; color: var(--ink); background-color: var(--bs-body-bg); border: 2px solid var(--ink); border-radius: .55rem; box-shadow: 0 2px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
    .game .tool { padding-top: .15rem; padding-bottom: .15rem; }
    .game .tools { flex-wrap: nowrap; } .game .tools .tool { min-width: 0; flex: 0 1 auto; text-overflow: ellipsis; } .game .tool-btn { flex: none; }   /* the buttons keep their size, the selects give way */
    .game .tool-btn { padding: .2rem .7rem; font-weight: 600; }
    .game .tool-btn:hover { background: #fff1c9; color: var(--ink); transform: translateY(-1px); }
    .game .tool-btn:active { transform: translateY(2px); box-shadow: none; }
    .game .tool:focus { border-color: var(--ink); box-shadow: 0 2px 0 var(--ink), 0 0 0 .2rem rgba(168, 54, 42, .25); }
    .card { max-width: 24rem; margin-top: .8rem; }
    .card.task { border: 3px solid var(--ink); border-radius: .9rem; box-shadow: 5px 5px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, .65), inset 0 -4px 0 rgba(43, 33, 24, .08); }
    .card.task { background: linear-gradient(180deg, #fff1c9 0%, #fbe3a6 100%); }
    .card.task { position: relative; }
    .card.task::after { content: ""; position: absolute; inset: 0; border-radius: .6rem; background: #e5483a; opacity: 0; mix-blend-mode: multiply; pointer-events: none; transition: opacity 1s ease; }
    .card.task.late::after { opacity: .3; }
    .card.task .card-body { position: relative; z-index: 1; }
    .foot { display: flex; justify-content: space-between; align-items: center; margin-top: .4rem; }
    .timer { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); font-size: 1.05rem; }
    .timer .bi { margin-right: .3rem; }
    .late .timer { color: #842029; }
    .speak { width: 2.4rem; height: 2.4rem; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; background: var(--bs-body-bg); border: 2px solid var(--ink); border-radius: 50%; box-shadow: 0 2px 0 var(--ink); color: var(--ink); transition: transform .12s, box-shadow .12s; }
    .foot-btns { display: inline-flex; gap: .5rem; }
    #introVeil[hidden] { display: none; }
    .speak:hover { transform: translateY(-1px); }
    .speak:active { transform: translateY(2px); box-shadow: none; }
    .task .cells { border-color: var(--ink); box-shadow: 3px 3px 0 rgba(43, 33, 24, .35); }
    .task .cell + .cell { border-left-color: var(--ink); }
    .card .cells { margin-bottom: .4rem; }
    /* the solved word: the character takes the place of the cells */
    .solution { display: flex; align-items: center; justify-content: center; min-height: calc(7rem + 4px); margin: 0 auto .4rem; }
    .solution .full { font-family: var(--qfont), sans-serif; font-size: 5.2rem; line-height: 1.1; color: var(--ink); animation: pop .35s ease-out; }
    #nextRow { margin-top: .8rem; }
    /* solved: the card turns green like the former success card */
    .card.task.solved { background: linear-gradient(180deg, #d9f2e3 0%, #b9e4cc 100%); border-color: #146c43; box-shadow: 5px 5px 0 #146c43, inset 0 3px 0 rgba(255, 255, 255, .65); transition: background-color .3s; }
    .task.solved .cells, .task.solved .cell + .cell { border-color: #146c43; }
    .card.task.win { animation: glow 1.2s ease-out; }
    @keyframes glow { 0% { box-shadow: 5px 5px 0 #146c43, 0 0 0 0 rgba(25, 135, 84, .55); } 100% { box-shadow: 5px 5px 0 #146c43, 0 0 0 1.6rem rgba(25, 135, 84, 0); } }
    .cloud { position: absolute; left: 50%; bottom: 0; z-index: 2; pointer-events: none; font-weight: 600; font-family: Georgia, "Times New Roman", serif; font-size: 1rem; color: var(--ink); white-space: nowrap; opacity: 0; animation: cloud 1.6s ease-out forwards; }
    @keyframes cloud { 0% { opacity: 0; transform: translate(-50%, 0) scale(.8); } 20% { opacity: 1; transform: translate(-50%, -.5rem) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -1.5rem) scale(1.05); } }
    .gbtn.hint { animation: wiggle .5s ease-in-out 2; }   /* a wiggle, the button grows only a little */
    @keyframes wiggle { 0%, 100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-9deg) scale(1.04); } 40% { transform: rotate(8deg) scale(1.04); } 60% { transform: rotate(-5deg) scale(1.03); } 80% { transform: rotate(3deg) scale(1.01); } }
    /* score: the points in the foot of the card, the points of a step rise from it, a word without hesitation gets a cheer */
    .scorebox { justify-self: end; display: flex; flex-direction: column; align-items: center; gap: .1rem; }
    .gbadge { display: flex; flex-direction: column; align-items: center; gap: .05rem; }
    .gbadge .stars { display: flex; gap: .08rem; } .gbadge .stars svg { width: .55rem; height: .55rem; }
    .gbadge .medal { width: 1.5rem; height: 1.7rem; }
    .gbadge .name { font: 600 .6rem/1 Georgia, "Times New Roman", serif; }
    .score { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); font-size: 1.4rem; line-height: 1.1; }
    .score.bump { animation: bump .4s ease-out; }
    @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .pts { position: absolute; right: 1.2rem; top: 3.4rem; z-index: 2; pointer-events: none; font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; opacity: 0; animation: pts 1.1s ease-out forwards; }
    .pts.plus { color: #146c43; } .pts.minus { color: #b02a37; }
    @keyframes pts { 0% { opacity: 0; transform: translateY(.6rem); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-.6rem); } }
    .cheer { position: absolute; left: 50%; top: 24%; z-index: 3; pointer-events: none; white-space: nowrap; font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-style: italic; font-size: clamp(2.2rem, 10vw, 3.6rem); color: #ffd23f; -webkit-text-stroke: .28em #0f5132; paint-order: stroke fill; text-shadow: 0 .06em .12em rgba(0, 0, 0, .35); opacity: 0; animation: cheer 1.9s ease-out forwards; }   /* letters only: gold with a dark green outline, no box */
    @keyframes cheer { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(3deg); } 30% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -64%) scale(1.05) rotate(0); } }
    .spark { position: absolute; left: 50%; top: 42%; z-index: 3; pointer-events: none; font-size: 1.6rem; }
    .board { max-width: 28rem; margin: 1.4rem auto 0; padding: .8rem 1rem; background: var(--bs-body-bg); color: var(--ink); border: 2px solid var(--ink); border-radius: .7rem; box-shadow: 4px 4px 0 var(--ink); font-size: .9rem; }
    .board h2 { font: 700 1.05rem Georgia, "Times New Roman", serif; margin: 0 0 .5rem; }
    .board table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .board td { padding: .15rem .3rem; }
    .board td.num { text-align: right; white-space: nowrap; }
    .board tr.me td { font-weight: 700; background: color-mix(in srgb, #ffd23f 45%, transparent); }
    .board tr.guest td { color: color-mix(in srgb, var(--ink) 55%, transparent); font-style: italic; }
    .board .more td { color: color-mix(in srgb, var(--ink) 45%, transparent); text-align: center; line-height: .6; }
    #scoreLock { font-size: .8em; opacity: .55; margin-left: .15rem; }
    dialog.ask { max-width: 24rem; width: calc(100vw - 2rem); padding: 1.2rem 1.3rem; background: var(--bs-body-bg); color: var(--bs-body-color); border: 3px solid var(--ink); border-radius: .8rem; box-shadow: 5px 5px 0 var(--ink); }
    dialog.ask h2 { border-bottom: 0; }   /* the line under h2 of the dark themes */
    dialog.ask::backdrop { background: rgba(43, 33, 24, .45); }
    #introVeil { position: fixed; inset: 0; z-index: 1010; background: rgba(43, 33, 24, .28); }   /* the loaded game shows through; below the menu bars (1030), so they stay usable */
    dialog.ask.intro { position: fixed; inset: 0; margin: auto; height: fit-content; z-index: 1011; max-width: 22rem; padding: 1.8rem 1.5rem 1.8rem; text-align: center; }   /* not modal (no top layer): the menu bars and their popups stay above it */
    dialog.ask.intro h2 { font: 400 2.3rem Georgia, "Times New Roman", serif; margin: 0; }
    dialog.ask.intro .stamp { display: block; width: 3.2rem; height: .3rem; margin: .7rem auto 1.6rem; background: var(--cinnabar); }
    dialog.ask.intro .intro-start { font-size: 1.3rem; padding: .6rem 2.6rem; }
    dialog.ask.intro .intro-start:disabled { opacity: .55; }
    dialog.ask h2 { font: 700 1.3rem Georgia, "Times New Roman", serif; margin: 0 0 .5rem; }
    dialog.ask p { margin: 0 0 1rem; }
    dialog.prog { text-align: center; }
    /* the card takes the colours of the result while the needle swings: the alert classes of Bootstrap (alert-danger, alert-warning, alert-success) give the colour of the text, the subtle background and the border,
       like the three arcs of the gauge; only their variables are used, not the box of .alert */
    dialog.prog { transition: background-color 1.3s ease, border-color 1.3s ease; }
    dialog.prog[class*="alert-"] { --ink: var(--bs-alert-color); --muted: color-mix(in srgb, var(--bs-alert-color) 75%, var(--bs-alert-bg)); background: var(--bs-alert-bg); border-color: var(--bs-alert-border-color); }
    dialog.prog svg { width: min(16rem, 80%); display: block; margin: 0 auto; color: var(--ink); overflow: visible; }
    #needle { transform-origin: 100px 100px; transform: rotate(-90deg); transition: transform 1.3s cubic-bezier(.2, 1.35, .4, 1); }
    .gaugeVal { font-size: 1rem; margin: .2rem 0 .6rem; } .gaugeVal b { font-size: 1.8rem; font-variant-numeric: tabular-nums; }
    .star { color: #e0a800; } .star.off { color: color-mix(in srgb, currentColor 25%, transparent); }
    dialog.prog table { width: 100%; margin: 0 0 1rem; font-size: .9rem; font-variant-numeric: tabular-nums; text-align: left; }
    dialog.prog td { padding: .1rem .3rem; }
    .star { display: inline-block; } .star.pop { animation: starPop .5s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: var(--d, 0s); }
    .star.new { text-shadow: 0 0 .5rem #ffd43b, 0 0 1.1rem rgba(255, 193, 7, .7); }
    @keyframes starPop { 0% { opacity: 0; transform: scale(.2) rotate(-40deg); } 70% { opacity: 1; transform: scale(1.5) rotate(8deg); } 100% { opacity: 1; transform: none; } }
    #progBadges { display: flex; justify-content: center; flex-wrap: wrap; gap: .4rem; min-height: 1.6rem; margin: -.2rem 0 .3rem; }
    .badge2 { padding: .05rem .7rem; border-radius: 1rem; font-size: .85rem; font-weight: 600; animation: pop .5s both; animation-delay: 1.3s; }
    .badge2.best { background: #ffe082; color: #5c4300; } .badge2.up { background: #d3f0dc; color: #146c43; }
    dialog.prog .praise { margin: 0 0 .6rem; font-size: .95rem; }
    dialog.prog td.stars { font-size: 1.15rem; letter-spacing: .05em; white-space: nowrap; }
    dialog.prog td.trend { white-space: nowrap; color: var(--muted); }
    dialog.ask .btns { display: flex; gap: .6rem; justify-content: flex-end; }
    #log { white-space: pre-wrap; text-align: left; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }
    .stats { font-size: .85rem; color: var(--muted, #6c5d4a); font-variant-numeric: tabular-nums; }
    #next { background: #146c43; border-color: #146c43; color: #fff; }
    #next:hover, #next:focus-visible { background: #0f5132; border-color: #0f5132; color: #fff; }
    @media (max-width: 575.98px) { .cell { width: 5.5rem; height: 5.5rem; font-size: 4.2rem; } .solution { min-height: calc(5.5rem + 4px); } .cells.two .cell { width: 4.125rem; } .gbtn { width: 3rem; height: 3rem; font-size: 1.9rem; } .tones { gap: 1rem; } .tones .gbtn { width: 3.6rem; height: 3.6rem; } }
  </style>
</head>
<body>
<header class="hero pt-5 pb-4">
  <div class="container text-center">
    <h1 class="mb-3" data-vi="Đánh vần!">Spell it!</h1>
    <p class="lead mx-auto mb-0" data-vi="Những chữ nào ghép nên từ này?">Which symbols spell this word?</p>
  </div>
</header>

<main class="container py-3" id="content">
<div id="introVeil"></div>
<dialog class="ask intro" id="intro" aria-labelledby="introTitle">   <!-- opens over the loaded game, below the menu bars: nothing runs, and the game cannot be clicked (inert), before Start -->
  <h2 id="introTitle"><span data-vi="Sẵn sàng?">Ready?</span></h2>
  <span class="stamp" aria-hidden="true"></span>
  <div class="text-center"><button type="button" class="btn btn-cinnabar btn-pill intro-start" id="startGame" disabled><i class="bi bi-play-fill"></i> <span data-vi="Bắt đầu">Start</span></button></div>
</dialog>
<div class="game mx-auto">
  <div class="d-flex justify-content-center align-items-center gap-2 tools">
    <select id="decoding" class="form-select form-select-sm w-auto tool" aria-label="Reading of the rhyme table"><optgroup label="Choose decoding" data-vi-label="Lựa chọn cách giải mã"><option value="qatt" selected>qatt.org</option><option value="omniglot">omniglot.com</option></optgroup></select>
    <select id="font" data-qatt-fonts data-qatt-default="QATT Pen Medium" class="form-select form-select-sm w-auto tool" aria-label="Font"></select>
    <button type="button" class="btn btn-sm tool-btn" id="reload" data-vi="Bỏ qua" disabled>Skip</button>
  </div>
  <div class="card task mx-auto mb-4" id="task">
    <div class="card-body">
      <div class="head">
        <div class="word" id="word" lang="vi">?</div>
        <div class="mood" id="mood" aria-live="polite">🙂</div>
        <div class="scorebox"><div class="gbadge" id="gbadge"></div><div class="score" id="score" title="Score"><span id="scoreVal">0</span><i class="bi bi-lock-fill" id="scoreLock" hidden></i></div></div>
      </div>
      <div class="cells" id="cells" aria-label="The symbols of the word"></div>
      <div class="solution" id="solution" hidden><div class="full" id="full"></div></div>
      <div class="text-center" id="lateRow" hidden><button type="button" class="btn btn-sm tool-btn" id="lateNext"><span data-vi="Từ tiếp theo">Next word</span> <i class="bi bi-arrow-right"></i></button></div>   <!-- when the minute is over: the word can be left, or learned on -->
      <div class="foot">
        <span class="timer" id="timer" title="One minute per word"><i class="bi bi-stopwatch"></i><span id="time">1:00</span></span>
        <span class="foot-btns">
          <button type="button" class="speak" id="pause" aria-label="Pause" title="Pause" data-vi-aria-label="Tạm dừng" data-vi-title="Tạm dừng"><i class="bi bi-pause-fill"></i></button>
          <button type="button" class="speak" id="speak" aria-label="Sound on or off" aria-pressed="true"><i class="bi bi-volume-up-fill"></i></button>
        </span>
      </div>
    </div>
  </div>

  <div id="variants" hidden><div class="pad" id="variantPad"></div></div>
  <div id="bases"><div class="pad grid3" id="basePad"></div></div>
  <div id="tones" hidden><div class="tones" id="tonePad"></div></div>
  <div id="nextRow" class="text-center" hidden><button type="button" class="btn btn-cinnabar btn-pill" id="next" data-vi="Từ tiếp theo">Next word</button></div>
  <div class="stats text-center mt-3" id="stats" hidden aria-live="off"></div>
  <div class="board" id="board" hidden>
    <h2 data-vi="Bảng xếp hạng">Ranking</h2>
    <table id="boardTable"></table>
  </div>
  <pre class="stats mt-4 mb-5" id="log" hidden></pre>
  <dialog class="ask" id="askLogin">
    <h2 data-vi="Điểm của bạn" id="askTitle">Your points</h2>
    <p id="askText"></p>
    <div class="btns">
      <button type="button" class="btn btn-sm tool-btn" id="askLater" data-vi="Để sau">Not now</button>
      <button type="button" class="btn btn-sm btn-cinnabar" id="askSignIn" data-vi="Đăng nhập">Sign in</button>
    </div>
  </dialog>
  <dialog class="ask prog" id="progress">
    <h2 data-vi="Những từ vừa rồi">Your last words</h2>
    <svg id="gauge" viewBox="0 0 200 118" role="img" aria-label="Confidence" data-vi-aria-label="Độ chắc chắn">
      <g id="gaugeArcs"></g>
      <g id="needle"><line x1="100" y1="100" x2="100" y2="32" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="8" fill="currentColor"/></g>
    </svg>
    <div class="gaugeVal"><b id="gaugeNum">0</b> <span data-vi="Phong độ">Form</span></div>
    <div id="progBadges"></div>
    <p id="progPraise" class="praise"></p>
    <table id="progKinds"></table>
    <div class="btns"><button type="button" class="btn btn-sm btn-cinnabar" id="progClose" data-vi="Tiếp tục">Continue</button></div>
  </dialog>

</div>
<p class="text-center mt-5 mb-4"><a href="spell-stats.html"><i class="bi bi-bar-chart-line" aria-hidden="true"></i> <span data-vi="Thống kê của tôi">My statistics</span></a></p>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const parser = new VietnameseParser();
    // the words: the entries of the dictionary of the Chunom site that have a rank and are one syllable (word + Nôm character);
    // until it is loaded (or if it fails) a short list of common syllables serves
    const CHUNOM_SITE = 'https://chunom.org/';
    let DICT = [];
    const FALLBACK = ['Quốc', 'Âm', 'Tân', 'Tự', 'người', 'nước', 'việt', 'nam', 'nhà', 'tôi', 'bạn', 'đẹp', 'trời', 'gió', 'hoa', 'sách',
      'chữ', 'nôm', 'thơ', 'lòng', 'thương', 'xuân', 'hạ', 'thu', 'đông', 'sáng', 'chiều', 'đêm', 'sông', 'núi', 'biển', 'cá', 'gà', 'mèo'];
    // the shapes as buttons
    const SHAPES = 'l _ ng h g c tr d n t th nh ch dz x kh s r m b v ph'.split(' ');   // the order of symbols.html (l first)
    const MARKS = [2, 3, 4, 5, 6];
    const $ = id => document.getElementById(id);
    const glyph = (shape, mark = 0) => QattText.syllable(shape + (mark || '') + ',,,0');   // one letter of the font
    // the tone marks in code point order 1..8 (U+F009C..U+F00A3): ngang, huyền, hỏi, ngã, sắc, nặng, sắc nhập, nặng nhập; the tone code of the syllable for each
    const toneGlyph = n => String.fromCodePoint(0xF0000 + 155 + n);
    const TONE_CODE = { 1: 0, 2: 2, 3: 3, 4: 4, 5: 1, 6: 5, 7: 6, 8: 7 };
    // three blocks with a gap between them, two rows: 3 | 4 6 | 5  /  1 | 2 8 | 7 (the block of the two middle columns has two columns, the others one)
    const TONE_BLOCKS = [[3, 1], [4, 6, 2, 8], [5, 7]];
    const piece = p => { const m = /^(_|[a-z]+?)([1-6]?)$/.exec(p); return { shape: m[1], mark: +m[2] || 0 }; };

    // fade and fold an element in or out instead of switching it at once; resolves when done
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function show(el, on) {
      if (el._anim) { el._anim.cancel(); el._anim = null; el.style.overflow = ''; }
      if (REDUCED || on === !el.hidden) { el.hidden = !on; return Promise.resolve(); }
      el.hidden = false;
      const full = getComputedStyle(el), h = el.offsetHeight + 'px', m = full.marginTop;
      const open = { opacity: 1, height: h, marginTop: m, transform: 'none' };
      const shut = { opacity: 0, height: '0px', marginTop: '0px', transform: 'translateY(.5rem)' };
      el.style.overflow = 'hidden';
      const a = el._anim = el.animate(on ? [shut, open] : [open, shut], { duration: on ? 280 : 200, easing: 'ease-out' });
      return new Promise(done => {
        a.onfinish = () => { el._anim = null; el.style.overflow = ''; el.hidden = !on; done(); };
        a.oncancel = done;
      });
    }
    const react = (cls) => { const m = $('mood'); m.classList.remove('bounce', 'shake'); void m.offsetWidth; m.classList.add(cls); };

    let slots, tone, code, answer, hop;
    const GOOD = ['😃', '🤗', '😊', '🙃'], BAD = ['😧', '😩', '😵', '😒', '😣', '🤨', '😱', '🤯', '😖'];
    const pick = a => a[Math.floor(Math.random() * a.length)];
    // the mood: 🙂 at the start, a random cheerful one after a hit, a random upset one after a miss
    const mood = ok => { $('mood').textContent = $('task').classList.contains('late') ? '💔' : pick(ok ? GOOD : BAD); react(ok ? 'bounce' : 'shake'); };   // after the time is up it is always 💔, the animation stays

    // the cells of the word: [{ shape, mark }] and the tone, from the code of the parser
    function analyse(word) {
      const parsed = parser.parse(word);
      const c = parsed && (parsed.qatt || parsed.hop);
      if (!c) return null;
      const [onset, rhyme, , t] = c.split(',');
      const on = piece(onset), rh = rhyme ? piece(rhyme) : null;
      let cells;   // role: what the cell stands for, to spell the word again from the cells
      if (!rh) cells = [{ ...on, role: 'onset' }];                                                          // the shape alone (ông)
      else if (rh.mark && !on.mark && on.shape === rh.shape) cells = [{ ...rh, role: 'both' }];             // onset and rhyme of one shape: one marked letter
      else cells = [{ ...on, role: 'onset' }, { ...rh, role: 'rhyme' }];
      return { cells, tone: +t || 0, code: c, hop: !parsed.qatt };
    }

    // one line of the CSV, with quoted fields
    const csvRow = line => {
      const out = []; let i = 0;
      while (i <= line.length) {
        if (line[i] === '"') {
          let v = ''; i++;
          while (i < line.length && !(line[i] === '"' && line[i + 1] !== '"')) { v += line[i] === '"' ? '"' : line[i]; i += line[i] === '"' ? 2 : 1; }
          out.push(v); i += 2;   // the closing quote and the comma
        } else { const j = line.indexOf(',', i); const e = j < 0 ? line.length : j; out.push(line.slice(i, e)); i = e + 1; }
      }
      return out;
    };
    const loadDict = () => fetch(CHUNOM_SITE + 'chunom/dict.csv').then(r => r.ok ? r.text() : Promise.reject(r.status)).then(text => {
      const seen = new Set();
      for (const line of text.split('\n')) {
        const r = csvRow(line.replace(/\r$/, ''));
        const w = (r[0] || '').trim();
        if (!w || /\s/.test(w) || !parseInt(r[5]) || !r[1]) continue;   // one syllable, with a rank
        if (!seen.has(w + r[1])) { seen.add(w + r[1]); DICT.push({ w, nom: r[1] }); }
      }
    });
    const pool = () => DICT.length ? DICT : FALLBACK.map(w => ({ w }));
    // word levels: some rhymes are harder and are asked only from a level on. The level is the skill badge (0 newbie, 1 beginner, 2 intermediate, 3 advanced), with
    // 2.5 (upper intermediate) between: intermediate and the usual rhyme time under the limit of the badge (the rhymes are the hardest of the three kinds, about 110).
    // ông, ong, ung, uông: all decodings, from intermediate (2); ôm, om, um, uôm, ao, oao, eo, oeo, yu, uyu, êu, iêu: only the decoding qatt.org, from upper
    // intermediate (2.5). The rhymes of a group are asked more often (share: the part of the words that are drawn from them), at the level where the group is unlocked and, halved, from the next one on. The rhyme
    // is the one of the spelling (glide, vowel, coda), the stops count as their nasal twin (ốc = ông), the tone marks do not count
    const HARD_RHYMES = [
      { level: 2, all: true, share: 0.2, rhymes: ['ông', 'ong', 'ung', 'uông'] },
      { level: 2.5, all: false, share: 0.3, rhymes: ['ôm', 'om', 'um', 'uôm', 'ao', 'oao', 'eo', 'oeo', 'yu', 'uyu', 'êu', 'iêu'] }];
    const wordLevel = () => {
      const n = badgeLevel(), r = mine().rhyme;
      return n === 2 && r.n >= MIN_SAMPLES && shown('rhyme', r.v) < BADGE_LIMIT ? 2.5 : n;
    };
    const rhymeOf = word => {
      const r = parser.parse(word);
      if (!r) return '';
      const twin = parser.constructor.STOP_TWIN[r.coda] || r.coda;
      return (r.glide + r.vowel + twin).normalize('NFD').replace(/[\u0300\u0301\u0303\u0309\u0323]/g, '').normalize('NFC');
    };
    const allowed = word => {
      const rh = rhymeOf(word), level = wordLevel();
      return !HARD_RHYMES.some(h => level < h.level && (h.all || dec() === 'qatt') && h.rhymes.includes(rh));
    };
    // a random entry that the parser can spell and the level allows, not the one just shown
    const draw = () => {
      const list = pool(), level = wordLevel();
      let focus = [], r = Math.random();   // the groups unlocked so far are asked more often: their share, halved once the next level is reached
      for (const h of HARD_RHYMES) {
        if (level < h.level || !(h.all || dec() === 'qatt')) continue;
        const share = level > h.level ? h.share / 2 : h.share;
        if (r < share) { focus = h.rhymes; break; }
        r -= share;
      }
      const ok = e => e.w !== answer && analyse(e.w) && allowed(e.w);
      if (focus.length) for (let i = 0; i < 600; i++) { const e = list[Math.floor(Math.random() * list.length)]; if (ok(e) && focus.includes(rhymeOf(e.w))) return e; }
      for (let i = 0; i < 200; i++) { const e = list[Math.floor(Math.random() * list.length)]; if (ok(e)) return e; }
      return { w: FALLBACK.find(w => analyse(w) && allowed(w)) };
    };

    // the countdown of one minute per word; at 0 the card turns reddish, the game goes on
    const LIMIT = 60;
    let deadline = 0, ticker = null;
    const stopTimer = () => { clearInterval(ticker); ticker = null; };
    function tick() {
      const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      $('time').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      if (!left) { stopTimer(); $('task').classList.add('late'); $('mood').textContent = '💔'; react('shake'); $('lateRow').hidden = !$('nextRow').hidden; }
    }
    function startTimer() {
      stopTimer();
      $('task').classList.remove('late');
      deadline = Date.now() + LIMIT * 1000;
      tick(); ticker = setInterval(tick, 250);
    }

    // sound on/off (off at the start): every click on a shape or a tone is read aloud with the speech of the Chunom site (decks/audiomanager.js: the browser voice, else Google TTS)
    let sound = true, speaker = null;   // on unless it was switched off
    try { sound = localStorage.getItem('qattCheckSound') !== '0'; } catch (e) {}
    let speakerLoad = null;   // the script is added once, even when several calls come before it has loaded
    const withSpeaker = fn => {
      const go = () => { speaker = speaker || new AudioManager(new Audio(), {}); fn(speaker); };
      if (typeof AudioManager !== 'undefined') return go();
      if (!speakerLoad) {
        speakerLoad = [];
        const sc = document.createElement('script');
        sc.src = CHUNOM_SITE + 'chunom/decks/audiomanager.js';
        sc.onload = () => speakerLoad.forEach(f => f());
        document.head.append(sc);
      }
      speakerLoad.push(go);
    };
    const say = text => { if (sound && text) withSpeaker(sp => sp.speak(text, 'auto', 0.8)); };
    const showSound = () => {
      $('speak').setAttribute('aria-pressed', sound);
      $('speak').title = sound ? 'Sound on' : 'Sound off';
      $('speak').firstElementChild.className = 'bi ' + (sound ? 'bi-volume-up-fill' : 'bi-volume-mute-fill');
    };
    $('speak').addEventListener('click', () => {
      sound = !sound;
      try { localStorage.setItem('qattCheckSound', sound ? '1' : '0'); } catch (e) {}
      showSound();
      if (sound) withSpeaker(() => {});   // load the speech now
    });
    showSound();
    if (sound) withSpeaker(() => {});   // load the speech early
    // the onset is read with the rhyme ông (mông, nhông, …); the tone with the whole word in that tone
    // the reading rises in the card like a little cloud and fades (also for wrong buttons: so the learner hears and sees how they sound)
    const cloud = (b, text) => {
      if (!text) return;
      const c = document.createElement('span');
      c.className = 'cloud'; c.textContent = text;
      $('task').append(c);   // in the card, at the bottom in the middle
      setTimeout(() => c.remove(), 1700);
    };
    const sayOnset = (shape, b) => { const text = parser.toQuocNgu({ onset: shape, rhyme: '', tone: 0 }); say(text); cloud(b, text); };
    // a marked form: the reading of the rhyme character itself with the consonant of its base shape (ngam for the group of ng), as in the popup of symbols.html;
    // not the asked word. The rhymes that have no reading there (ơng, ương, êng, uêng, ing, uyng) have none here either.
    const NO_READING = new Set(['ơng', 'ương', 'êng', 'uêng', 'ing', 'uyng']);
    const sayMarked = (shape, mark, b) => {
      if (NO_READING.has(parser.toQuocNgu({ onset: '_', rhyme: shape + mark }))) return;
      const text = parser.toQuocNgu({ onset: shape, rhyme: shape + mark, tone: 0 });
      say(text); cloud(b, text);
    };
    const TONE_NAME = { 1: null, 2: 'huyen', 3: 'hoi', 4: 'nga', 5: 'sac', 6: 'nang', 7: 'sac', 8: 'nang' };
    const wordInTone = (word, n) => {
      const bare = word.normalize('NFD').replace(/[\u0300\u0301\u0303\u0309\u0323]/g, '').normalize('NFC');
      let m = /^(ngh|ng|nh|gh|ph|th|ch|tr|kh|gi|qu|[bcdđghklmnprstvx])?(.*)$/i.exec(bare);
      let onset = m[1] || '', rhyme = m[2];
      if (/^gi$/i.test(onset) && !/[aăâeêioôơuưy]/i.test(rhyme)) { onset = onset[0]; rhyme = 'i' + rhyme; }   // gì: g + ì
      return onset + parser._tonePlaced(rhyme, TONE_NAME[n]);
    };

    // ---- score and the speed of the player --------------------------------------------------------------------------------------------------
    // Points: a right choice +10, a wrong one -2 (the score does not go below 0); a solved word gives a bonus that falls by 1 every 1.2 seconds
    // (50 at the start, 0 after the minute; half of it if a hint wiggled); a word without a wrong choice and a hint, in which every step was quick, gives 25 more
    // and a cheer. Speed: the time of every right choice that was the first try, without a hint, from the moment its buttons were there (the last right choice
    // or the start of the word), kept per kind of symbol (onset, rhyme, tone) as an exponentially smoothed value; a wrong choice counts as the own value + CAP_ADD (at most CAP, 10 s), a time above the cap counts as the cap (the own slow value + CAP_ADD s, at most CAP = 10 s; plain CAP until there are MIN_SAMPLES times), a time in
    // which the page was hidden does not count. Both are kept in the browser (localStorage); the server comes later.
    const POINTS = { right: 10, wrong: 2, bonus: 50, bonusStep: 1.2, quick: 25 };
    const CAP = 10, CAP_ADD = 2, HINT_ADD = 5, ALPHA = 0.01, ALPHA_FAST = 0.2, ALPHA_AVG = 0.1, QUICK_FACTOR = 1.5, QUICK_MAX = 3;   // seconds; smoothing; "quick": at most 3 seconds, and at most 1.5 times the own value once there are MIN_SAMPLES times of that kind
    // v: the slow value (ALPHA, for the server and the ranking: it follows only slowly, so a good day does not count); f: the faster one (ALPHA_FAST 0.2: after 10 equal times it has covered about 90% of the way; the form of the day,
    // for the display (the status line) and for the milestones: the first time it falls below one of the times of MILESTONES (at least MIN_SAMPLES times) the player gets MILESTONE_POINTS)
    const MIN_SAMPLES = 5;   // from this many times of a kind the values count (the quick check of a word, the milestones, later the ranking)
    const MILESTONES = [3, 2, 1.5, 1, 0.7], MILESTONE_POINTS = 50;
    const KINDS = ['onset', 'rhyme', 'tone'];
    // what is shown (status line, card, milestones) is not the measured time: every click holds the time to find and press the button (CLICK_TIME of its kind), and the first click of a word,
    // the onset, also the time to read the word (READ_TIME); both are taken off (at least MIN_SHOWN, a rhyme is the mean of its clicks, so CLICK_TIME off the mean is the same). The tones take
    // longer to find: 8 marks, four circles and four half circles that differ only by their place, so one has to look closely;
    // what is kept, sent to the server and shown in the stopwatch stays the measured time
    const READ_TIME = 1.25, CLICK_TIME = { onset: 0.5, rhyme: 0.5, tone: 1 }, MIN_SHOWN = 0.1;   // off the onset 1.75 s, off a rhyme 0.5 s, off a tone 1 s
    const shown = (kind, x) => Math.max(MIN_SHOWN, x - CLICK_TIME[kind] - (kind === 'onset' ? READ_TIME : 0));
    let signed = false, db = null, syncTimer = null, syncing = false;   // signed: somebody is signed in for real (their points count and go to the server)
    // the record: { score, decoding (the one in use), stats: { <decoding>: { onset, rhyme, tone: { v, f, n, m } } } }: the times belong to a decoding, the reading of the rhyme table decides which symbols a word has
    const blank = () => ({ onset: { v: 0, f: 0, n: 0, m: 0 }, rhyme: { v: 0, f: 0, n: 0, m: 0 }, tone: { v: 0, f: 0, n: 0, m: 0 } });
    const freshRound = () => ({ onset: [], rhyme: [], tone: [], wrong: { onset: 0, rhyme: 0, tone: 0 } });   // the times (measured) of the last words since the last card, and the wrong choices
    let me = { score: 0, shadow: 0, pending: 0, asked: 0, words: 0, decoding: 'qatt', stats: {}, avg: { v: 0, n: 0 }, skipOk: true, round: freshRound(), prev: null, best: 0, lastValue: null, base: null, relearn1: true, snapshot: false, badge: 0 };   // score: what counts (signed in); shadow: the points a visitor would have; pending: points not sent yet; asked: how often the visitor was asked to sign in   // avg: the smoothed points of a solved word; skipOk: Skip may be used (see skipWord)
    // a checksum over the record of the browser: a record that was edited by hand (or has none) is dropped, so changing it needs a look at this code (a speed bump, no protection against a program)
    const sumOf = o => {
      const text = JSON.stringify(o) + String.fromCharCode(...[83, 112, 51, 108, 108, 33, 48, 120].map((c, i) => c ^ (i * 3 + 1)));
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < text.length; i++) { const c = text.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    };
    try {
      let saved = JSON.parse(localStorage.getItem('qattSpell'));
      if (saved) { const { sum, ...rest } = saved; if (sum !== sumOf(rest)) saved = null; }
      if (saved && typeof saved.score === 'number') {
        me.score = saved.score;
        for (const k of ['shadow', 'pending', 'asked', 'words']) if (typeof saved[k] === 'number') me[k] = saved[k];
        if (saved.avg && typeof saved.avg.v === 'number') me.avg = saved.avg;
        if (saved.skipOk === false) me.skipOk = false;
        if (saved.round && KINDS.every(k => Array.isArray(saved.round[k])) && saved.round.wrong) me.round = saved.round;
        if (saved.prev && typeof saved.prev === 'object') me.prev = saved.prev;
        if (typeof saved.best === 'number') me.best = saved.best;
        if (typeof saved.lastValue === 'number') me.lastValue = saved.lastValue;
        if (saved.base && typeof saved.base === 'object') me.base = saved.base;
        if (saved.stats && saved.stats.onset) me.stats.qatt = saved.stats;   // the first form of the record, without the decoding: it was the one of qatt.org
        else if (saved.stats) me.stats = saved.stats;
        me.relearn1 = !!saved.relearn1;
        me.snapshot = saved.snapshot === true;
        if (typeof saved.badge === 'number') me.badge = saved.badge;
      }
    } catch (e) {}
    const dec = () => $('decoding').value || 'qatt';
    {   // ?decoding=qatt|omniglot preselects that reading of the rhyme table (an unknown name is ignored)
      const want = new URLSearchParams(location.search).get('decoding');
      if (want && [...$('decoding').options].some(o => o.value === want)) { $('decoding').value = want; parser.setDecoding(want); }
    }
    const mine = () => { const d = dec(); me.decoding = d; const set = me.stats[d] = me.stats[d] || blank(); for (const k of KINDS) set[k] = { f: set[k].v, m: 0, ...set[k] }; return set; };
    const saveMe = () => { try { localStorage.setItem('qattSpell', JSON.stringify({ ...me, sum: sumOf(JSON.parse(JSON.stringify(me))) })); } catch (e) {} };
    let lap, word_ = { wrong: false, hinted: false, quick: true, t0: 0, points: 0 }, hiddenDuring = false;
    document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenDuring = true; });
    // the stopwatch and the log at the bottom of the page: the first line is the word in play with the time of every click (right, or wrong ✗) and the running one, to check
    // the measuring: bao  1.9 | 2.4 ✗ | 0.7; the lines below are the earlier words, the newest first
    let watch = { done: [], t0: 0, on: false, word: '', finished: false }, logLines = [];
    const watchLine = () => watch.word.padEnd(8) + watch.done.concat(watch.on ? [((performance.now() - watch.t0) / 1000).toFixed(1)] : []).join(' | ');
    const adminSeen = () => typeof isAdmin === 'function' && isAdmin();   // the log is for admins (isAdmin of js/fonts.js), as the ranking
    const drawWatch = () => { if (!watch.word || !adminSeen()) return; $('log').textContent = [watchLine()].concat(logLines).join('\n'); $('log').hidden = false; };
    setInterval(() => { if (watch.on) drawWatch(); }, 100);
    const newLap = () => { lap = { t0: performance.now(), wrong: false, wrongs: 0, hinted: false }; hiddenDuring = false; };
    // the skill badge (as on spell-stats.html; kept in spell_scores.badge and only ever raised): how many of the three kinds have a usual time under 1.75 s as shown
    const BADGE_LIMIT = 1.75, LEVELS = [{ en: 'Newbie', color: '#9aa0a6' }, { en: 'Beginner', color: '#e6a700' }, { en: 'Intermediate', color: '#198754' }, { en: 'Advanced', color: '#0d6efd' }];
    const STAR_PATH = 'M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z';
    function badgeLevel() {
      let n = me.badge || 0;
      for (const set of Object.values(me.stats)) if (set) n = Math.max(n, KINDS.filter(k => set[k] && set[k].n >= MIN_SAMPLES && shown(k, set[k].v) < BADGE_LIMIT).length);
      return Math.min(3, n);
    }
    function showBadge() {
      const n = me.badge = badgeLevel();
      const L = LEVELS[n], box = $('gbadge');
      if (box.dataset.n === String(n)) return;
      box.dataset.n = n; box.title = L.en;
      const star = i => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}" fill="${i < n ? '#f2b600' : '#c9ccd0'}"/></svg>`;

      for (const set of Object.values(me.stats)) for (const k of KINDS) if (set && set[k] && set[k].n > MIN_SAMPLES) set[k].n = MIN_SAMPLES;
      me.base = null; me.relearn1 = true; saveMe();
    }
    async function initAccount() {
      db = window.QATT_SPELL_DB || (typeof SupabaseService !== 'undefined' && typeof supabase !== 'undefined' ? new SupabaseService() : null);
      if (!db) { relearnOnce(); me.shadow += me.score; me.score = 0; me.pending = 0; showScore(); showLock(); return; }
      try { signed = !!(await db.initQuiet()); } catch (e) { signed = false; }
      if (signed) {
        me.shadow = 0;   // what a visitor would have had does not come along: the points count from now on
        const rec = await db.spellLoad().catch(() => null);
        if (rec) {   // the server has the truth: the score and the speed of the decodings it knows
          me.score = rec.score + me.pending; me.badge = rec.badge || 0;   // the server has the badge
          for (const d of Object.keys(rec.speed)) me.stats[d] = rec.speed[d];
        } else if (rec === null) me.score = me.score;   // an error: the browser keeps what it has
        else me.score = me.pending;
        if (me.pending) schedSync();
      } else { me.shadow += me.score; me.score = 0; me.pending = 0; }   // points of an earlier version of the page
      relearnOnce(); saveMe(); showScore(); showStats(); showLock(); loadBoard();
    }
    initAccount();

    let nomOf = '', winTimer = null;
    function start(word, nom) {
      clearTimeout(winTimer);
      let a = analyse(word);
      if (!a) { ({ w: word, nom } = draw()); a = analyse(word); }
      answer = word; nomOf = nom || '';
      word_ = { wrong: false, hinted: false, quick: true, t0: Date.now(), points: 0, snap: JSON.stringify({ score: me.score, shadow: me.shadow, pending: me.pending, stats: me.stats, round: me.round }) }; newLap();   // snap: the state before the word, for Skip
      startTimer(); $('lateRow').hidden = true;
      if (watch.word && watch.done.length) { logLines.unshift(watchLine() + (watch.finished ? '' : '  (not finished)')); logLines.length = Math.min(logLines.length, 200); }
      watch = { done: [], t0: performance.now(), on: true, word, finished: false }; drawWatch();
      slots = a.cells.map(c => ({ ...c, state: 'empty' }));
      setTimeout(armHint, 0);   // the hint of this word waits for its time (the own value of the first kind + HINT_ADD)
      tone = a.tone; code = a.code; hop = a.hop;
      $('mood').textContent = '🙂'; $('mood').classList.remove('bounce', 'shake');
      $('word').textContent = word;
      say(word);   // the new word is read aloud when it appears (if the sound is on)
      for (const id of ['tones', 'variants']) show($(id), false);
      $('variantPad').replaceChildren();
      $('tonePad').replaceChildren();
      fillPad();
      $('cells').replaceChildren();
      renderCells();
      show($('bases'), true);
      $('task').classList.remove('solved', 'win');
      $('solution').hidden = $('nextRow').hidden = true;
      $('cells').hidden = false;
      show($('task'), true);
    }

    const withData = (b, data) => { Object.assign(b.dataset, data); return b; };   // marks a button for the hint
    function button(text, cls, onclick) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = cls + ' fresh'; b.textContent = text;
      b.addEventListener('click', () => onclick(b));
      return b;
    }
    const verdict = (b, ok) => { b.classList.add(ok ? 'ok' : 'bad'); b.disabled = true; };

    function renderCells() {
      $('cells').classList.toggle('two', slots.length === 2);
      const box = $('cells');
      if (box.children.length !== slots.length) box.replaceChildren(...slots.map(() => {
        const d = document.createElement('div'), g = document.createElement('span');
        d.className = 'cell'; g.className = 'g'; d.append(g);
        d.addEventListener('animationend', e => { if (e.target === d) d.classList.remove('pop'); });
        return d;
      }));
      slots.forEach((s, i) => {   // update the cells in place so that the colours can fade
        const d = box.children[i], g = d.firstChild;
        const text = s.state === 'empty' ? '' : glyph(s.shape, s.state === 'full' ? s.mark : 0);
        d.classList.toggle('near', s.state === 'near');
        d.classList.toggle('solved', s.state === 'full');
        if (g.textContent !== text) {
          g.textContent = text;
          if (text) { d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop'); }
        }
      });
    }

    // the shapes of a word: 6 buttons in two rows of 3 for the onset and the rhyme together (22 were far too many to choose from). The 22 base shapes are
    // in three rows of 8, 8 and 6 (the order of symbols.html); the rows of the onset and of the rhyme are the two rows of the word; if both are in one row,
    // the next row is added (the one above when it is the last); each of the two rows is filled up to 3 shapes at random, in the order of the row
    const ROWS = [SHAPES.slice(0, 8), SHAPES.slice(8, 16), SHAPES.slice(16)], SHAPES_PER_ROW = 3;
    function fillPad() {
      const need = [...new Set(slots.map(s => s.shape))];
      let rows = [...new Set(need.map(x => ROWS.findIndex(r => r.includes(x))))].filter(i => i >= 0);
      if (rows.length < 2) rows.push(rows[0] < ROWS.length - 1 ? rows[0] + 1 : rows[0] - 1);
      const shapes = rows.sort((a, b) => a - b).flatMap(ri => {
        const have = ROWS[ri].filter(x => need.includes(x));
        const more = ROWS[ri].filter(x => !need.includes(x)).sort(() => Math.random() - .5).slice(0, Math.max(0, SHAPES_PER_ROW - have.length));
        return ROWS[ri].filter(x => have.includes(x) || more.includes(x));
      });
      $('basePad').replaceChildren(...shapes.map(s => withData(button(glyph(s), 'gbtn', b => pickShape(s, b)), { shape: s })));
    }

    function pickShape(shape, b) {
      const found = slots.filter(s => s.shape === shape);
      verdict(b, found.length > 0);
      mood(found.length > 0);
      judge(found.length ? cellKind(found[0]) : null, found.length > 0, found, found.filter(c => !c.mark));   // a cell without a mark is complete with its shape
      sayOnset(shape, b);   // right or wrong
      if (!found.length) return;
      for (const s of found) s.state = s.mark ? 'near' : 'full';
      if (found.some(s => s.mark)) {   // a marked form was hit: offer the marked forms of this shape
        const group = document.createElement('div');
        group.className = 'group';
        group.append(...MARKS.map(m => withData(button(glyph(shape, m), 'gbtn', vb => pickMark(shape, m, vb)), { shape, mark: m })));
        group.querySelectorAll('button').forEach((x, i) => x.style.setProperty('--i', i));
        $('variantPad').append(group);   // shown by update() once the consonant buttons are gone
      }
      renderCells();
      update();
    }

    function pickMark(shape, mark, b) {
      sayMarked(shape, mark, b);
      const found = slots.filter(s => s.shape === shape && s.mark === mark);
      verdict(b, found.length > 0);
      mood(found.length > 0);
      judge(found.length ? cellKind(found[0]) : null, found.length > 0, found, found);   // the marked form completes the cell
      for (const s of found) s.state = 'full';
      renderCells();
      update();
    }

    // all cells filled (also the faint ones): the shapes go; all cells exact (no faint one left): the marked forms go and the tones appear
    function update() {
      if (slots.some(s => s.state === 'empty')) return;
      const gone = show($('bases'), false);
      if (slots.some(s => s.state === 'near')) { gone.then(() => show($('variants'), true)); return; }   // the rhyme buttons come after the consonant buttons
      if (!$('tones').hidden) return;
      show($('variants'), false);
      show($('tones'), true);
      $('tonePad').replaceChildren(...TONE_BLOCKS.map(block => {
        const d = document.createElement('div');
        d.className = 'block';
        d.style.setProperty('--cols', block.length / 2);
        d.append(...block.map((n, i) => { const b = withData(button(toneGlyph(n), 'gbtn tone', b => pickTone(n, b)), { tone: n }); b.style.setProperty('--i', i); return b; }));
        return d;
      }));
    }

    function pickTone(n, b) {
      const ok = TONE_CODE[n] === tone;
      verdict(b, ok);
      mood(ok);
      judge('tone', ok);
      if (!ok) return;
      finishWord();
      say(wordInTone(answer, n));   // only a right choice is spoken
      stopTimer(); $('lateRow').hidden = true;
      for (const x of $('tonePad').querySelectorAll('button')) x.disabled = true;
      for (const x of slots) x.state = 'full';   // the faint cells show their marked forms
      show($('variants'), false);
      renderCells();
      $('full').textContent = QattText.syllable(code);
      // after a moment to see the last cell the solution takes the place of the cells, the button for the next word the place of the tones
      if ($('tones')._anim) $('tones')._anim.cancel();
      $('tones').hidden = true; $('nextRow').hidden = false;   // the next button at once, in the place of the tones
      $('task').classList.add('solved');
      clearTimeout(winTimer);
      winTimer = setTimeout(() => {   // after a moment to see the last cell, no folding: the card keeps its size (start() cancels it: a quick click on Next must not bring the solution of the old word over the new one)
        $('cells').hidden = true; $('solution').hidden = false;
        $('task').classList.add('win');
      }, 1000);
    }

    // after 5 seconds without a click the right button wiggles as a hint (and again every 5 seconds)
    let hintTimer;
    const hintButton = () => {
      if (!$('nextRow').hidden) return null;   // solved
      if (!$('tones').hidden) return [...$('tonePad').querySelectorAll('button')].find(b => !b.disabled && TONE_CODE[b.dataset.tone] === tone);
      if (!$('variants').hidden) {
        const s = slots.find(x => x.state === 'near');
        return s && [...$('variantPad').querySelectorAll('button')].find(b => !b.disabled && b.dataset.shape === s.shape && +b.dataset.mark === s.mark);
      }
      if (!$('bases').hidden) {
        const s = slots.find(x => x.state === 'empty');
        return s && [...$('basePad').querySelectorAll('button')].find(b => !b.disabled && b.dataset.shape === s.shape);
      }
      return null;
    };
    // the kind of the step that is open: the tones, the marked forms (rhyme) or the first cell that is still empty
    const pendingKind = () => {
      if (!$('tones').hidden) return 'tone';
      if (!$('variants').hidden) return 'rhyme';
      const next = slots && slots.find(x => x.state === 'empty');
      return next && next.role === 'onset' ? 'onset' : 'rhyme';
    };
    // the hint comes after the own value of that kind + HINT_ADD seconds without a click (5 seconds until there are MIN_SAMPLES times), and again at that distance;
    // a step with a hint does not count in the speed, it is only a help to learn
    const armHint = () => {
      clearTimeout(hintTimer);
      if (paused) return;
      const st = mine()[pendingKind()];
      hintTimer = setTimeout(() => {
        const b = hintButton();
        if (b) {
          lap.hinted = word_.hinted = true;   // a hint wiggled: this step and the word do not count as quick
          b.classList.remove('hint', 'fresh');   // 'fresh' goes: its entrance animation would start again when 'hint' is removed
          void b.offsetWidth;
          b.classList.add('hint');
          b.addEventListener('animationend', () => b.classList.remove('hint'), { once: true });
        }
        armHint();
      }, ((st.n >= MIN_SAMPLES ? st.v : 0) + HINT_ADD) * 1000);
    };
    ['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, armHint, true));
    armHint();

    const another = () => { const e = draw(); start(e.w, e.nom); };
    $('next').addEventListener('click', another);
    $('lateNext').addEventListener('click', another);   // after the minute: the word is left without a take-back (the points of its clicks stay), no Skip rule
    $('reload').addEventListener('click', skipWord);
    showSkip();
    $('decoding').addEventListener('change', e => {
      parser.setDecoding(e.target.value); showStats(); if (started) start(answer, nomOf);
      try { const u = new URL(location.href); u.searchParams.set('decoding', e.target.value); history.replaceState(history.state, '', u); } catch (err) {}   // the address follows the choice: a link or a reload keeps it
    });   // the same word after the other decoding

    const wanted = new URLSearchParams(location.search).get('word');
    // the game starts with a click on Start (the word, its speech and the clocks wait for it)
    $('intro').addEventListener('cancel', e => e.preventDefault());   // Escape does not skip the start
    // a preview of the shapes behind the popup (inert: nothing is drawn or clicked before Start)
    $('basePad').replaceChildren(...[...ROWS[0].slice(0, 3), ...ROWS[1].slice(0, 3)].map(s => button(glyph(s), 'gbtn', () => {})));
    $('intro').show();   // not showModal: that would cover the menu bars and their popups
    document.querySelector('.game').inert = true;
    loadDict().catch(() => {}).then(() => { $('startGame').disabled = false; $('startGame').focus(); });
    $('startGame').addEventListener('click', () => {
      started = true; $('intro').close(); $('introVeil').hidden = true; document.querySelector('.game').inert = false; showSkip();
      if (paused) {   // after a pause always a new word (no looking at the old one); a word still in play is dropped like a skipped one (score and times as before it)
        paused = false;
        if ($('nextRow').hidden && word_.snap) { const snap = JSON.parse(word_.snap); me.score = snap.score; me.shadow = snap.shadow; me.pending = snap.pending; me.stats = snap.stats; me.round = snap.round || freshRound(); saveMe(); showScore(); showStats(); }
        clearTimeout(syncTimer); me.score = Math.max(0, me.score - me.pending); me.pending = 0; saveMe(); showScore();   // the pause ends the session: points not sent yet expire
        another();
      }
      else if (wanted) start(wanted, (DICT.find(e => e.w === wanted.trim().toLowerCase()) || {}).nom);
      else another();
    });
    // Pause: ends the session: the clocks stop, the game is covered by the start popup; Start begins anew with a new word (the points not sent yet are dropped)
    $('pause').addEventListener('click', () => {
      if (!started || paused) return;
      paused = true; stopTimer(); clearTimeout(hintTimer); watch.on = false; clearTimeout(syncTimer);
      document.querySelector('.game').inert = true; $('introVeil').hidden = false; $('intro').show(); $('startGame').focus();
    });
  });
</script>
</body>
</html>

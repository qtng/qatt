<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>My statistics</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/navigation.js"></script>
  <script src="vendor/supabase/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root { --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; }
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
    .tile { text-align: center; display: flex; flex-direction: column; justify-content: center; padding: .6rem .8rem; border: 1px solid var(--bs-border-color); border-radius: .6rem; background: var(--bs-body-bg); }
    .tile b { display: block; font: 400 2rem/1.1 Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; }
    .tile span { font-size: .85rem; color: var(--bs-secondary-color); }
    .tile.badge { display: flex; flex-direction: column; align-items: center; gap: .15rem; }
    .tile.badge .stars { display: flex; gap: .15rem; }
    .tile.badge .stars svg { width: .9rem; height: .9rem; }
    .tile.badge .medal { width: 3.2rem; height: 3.6rem; }
    .tile.badge .name { font: 600 1rem/1.1 Georgia, "Times New Roman", serif; }
    h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.4rem; margin: 2rem 0 .6rem; padding-bottom: .25rem; border-bottom: 1px solid var(--bs-border-color); }
    table { font-variant-numeric: tabular-nums; font-size: .92rem; }
    th { font-weight: 600; color: var(--bs-secondary-color); }
    td, th { text-align: right; } td:first-child, th:first-child { text-align: left; }
    .note { color: var(--bs-secondary-color); font-size: .85rem; }
    .chart { position: relative; height: 16rem; }
    .log td:first-child { white-space: nowrap; }
  </style>
</head>
<body>
<header class="hero pt-5 pb-4">
  <div class="container text-center">
    <h1 class="mb-3" data-vi="Thống kê của tôi">My statistics</h1>
    <p class="lead mx-auto mb-0" data-vi="Điểm số và tốc độ của bạn trong Đánh vần!">Your score and speed in Spell it!</p>
  </div>
</header>

<main class="container py-3" style="max-width: 48rem">
  <p id="status" class="note text-center" aria-live="polite" data-vi="Đang tải…">Loading…</p>
  <div id="signin" class="text-center my-4" hidden>
    <p data-vi="Hãy đăng nhập để xem thống kê của bạn.">Sign in to see your statistics.</p>
    <button type="button" class="btn btn-cinnabar btn-pill" id="signinBtn" data-vi="Đăng nhập">Sign in</button>
  </div>
  <div id="content" hidden>
    <div class="tiles" id="tiles"></div>
    <div id="decodings"></div>
    <p class="note mt-4" id="notes"></p>
  </div>
  <p class="text-center mt-5 mb-4"><a href="spell.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> <span data-vi="Quay lại trò chơi">Back to the game</span></a></p>
</main>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const $ = id => document.getElementById(id);
    const T = (en, vi) => window.Lang && Lang.t ? Lang.t(en, vi) : en;
    const KINDS = ['onset', 'rhyme', 'tone'];
    const NAMES = { onset: ['Onsets', 'Âm đầu'], rhyme: ['Rhymes', 'Vần'], tone: ['Tones', 'Thanh'] };
    const COLORS = { onset: '#a8362a', rhyme: '#146c43', tone: '#0d6efd' };
    const DECODINGS = { qatt: 'qatt.org', omniglot: 'omniglot.com' };
    // what the game shows is not the measured time: the time to find and press a button and, for the onset, to read the word are taken off (as in spell.html)
    const READ_TIME = 1.25, CLICK_TIME = { onset: 0.5, rhyme: 0.5, tone: 1 }, MIN_SHOWN = 0.1, MIN_SAMPLES = 5;
    const MILESTONES = [3, 2, 1.5, 1, 0.7];
    const shown = (kind, x) => Math.max(MIN_SHOWN, x - CLICK_TIME[kind] - (kind === 'onset' ? READ_TIME : 0));
    const fmt = x => x.toFixed(1) + ' s';
    const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
    const tile = (value, label) => { const t = el('div', undefined, 'tile'); t.append(el('b', value), el('span', label)); $('tiles').append(t); };
    // badge: how many of the three kinds (onset, rhyme, tone) are under BADGE_LIMIT seconds (the usual time as the game shows it, counted from MIN_SAMPLES times; of the better of the decodings)
    const BADGE_LIMIT = 1.75;
    const LEVELS = [
      { en: 'Newbie', vi: 'Người mới', color: '#9aa0a6' }, { en: 'Beginner', vi: 'Sơ cấp', color: '#e6a700' },
      { en: 'Intermediate', vi: 'Trung cấp', color: '#198754' }, { en: 'Advanced', vi: 'Cao cấp', color: '#0d6efd' }];
    const STAR = 'M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z', STAR_OFF = '#c9ccd0', STAR_ON = '#f2b600';
    const SVG = 'http://www.w3.org/2000/svg';
    const svg = (cls, view, inner) => { const e = document.createElementNS(SVG, 'svg'); e.setAttribute('viewBox', view); e.setAttribute('class', cls); e.setAttribute('aria-hidden', 'true'); e.innerHTML = inner; return e; };
    function level(rows) {
      let best = 0;
      for (const row of rows) best = Math.max(best, KINDS.filter(k => row[k + '_n'] >= MIN_SAMPLES && shown(k, row[k + '_v']) < BADGE_LIMIT).length);
      return best;
    }
    function badge(rows) {
      const n = level(rows), L = LEVELS[n], t = el('div', undefined, 'tile badge');
      t.title = T('Times under ' + BADGE_LIMIT + ' s: ', 'Thời gian dưới ' + BADGE_LIMIT + ' giây: ') + n + ' / 3';
      const stars = el('div', undefined, 'stars');
      for (let i = 0; i < 3; i++) stars.append(svg('', '0 0 24 24', `<path d="${STAR}" fill="${n ? (i < n ? STAR_ON : STAR_OFF) : STAR_OFF}"/>`));
      const medal = svg('medal', '0 0 64 72', `<path d="M32 3 59 13v22c0 17-12 29-27 34C17 64 5 52 5 35V13z" fill="${L.color}"/><path d="M32 10 52 18v17c0 12-8 21-20 26C20 56 12 47 12 35V18z" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.5"/><path d="${STAR}" transform="translate(16 22) scale(1.35)" fill="#fff" fill-opacity="${n ? 1 : .6}"/>`);
      const name = el('span', T(L.en, L.vi), 'name'); name.style.color = L.color;
      t.append(stars, medal, name); $('tiles').append(t);
    }
    const table = (head, rows, cls) => {
      const t = el('table', undefined, 'table table-sm' + (cls ? ' ' + cls : ''));
      const tr = el('tr'), thead = el('thead'); head.forEach(h => tr.append(el('th', h))); thead.append(tr); t.append(thead);
      const body = el('tbody'); rows.forEach(r => { const row = el('tr'); r.forEach(v => row.append(el('td', v))); body.append(row); }); t.append(body);
      const wrap = el('div', undefined, 'table-responsive'); wrap.append(t); return wrap;
    };

    const db = window.QATT_SPELL_DB || new SupabaseService();
    let user = null;
    try { user = await db.initQuiet(); } catch (e) {}
    $('status').hidden = true;
    if (!user) {
      $('signin').hidden = false;
      $('signinBtn').addEventListener('click', () => QattLogin.open(db, T('Sign in to see your statistics.', 'Hãy đăng nhập để xem thống kê của bạn.')));
      return;
    }
    const [score, speed, history] = await Promise.all([
      db.client.from('spell_scores').select('score, words').eq('user_id', user.id).maybeSingle(),
      db.client.from('spell_speed').select('*').eq('user_id', user.id),
      db.client.from('spell_history').select('*').eq('user_id', user.id).order('at', { ascending: true }),
    ]);
    if (score.error || speed.error || history.error) {
      $('status').hidden = false; $('status').textContent = T('The statistics could not be loaded.', 'Không tải được thống kê.'); return;
    }
    $('content').hidden = false;
    const sc = score.data || { score: 0, words: 0 };
    tile(sc.score, T('Points', 'Điểm'));
    badge(speed.data || []);
    tile(sc.words, T('Words', 'Từ'));
    if (!(speed.data || []).length) {
      $('decodings').append(el('p', T('Play a few words to see your speed here.', 'Hãy chơi vài từ để xem tốc độ của bạn ở đây.'), 'note mt-4'));
    }

    for (const row of speed.data || []) {
      const d = row.decoding, box = el('section');
      box.append(el('h2', T('Speed', 'Tốc độ') + ' · ' + (DECODINGS[d] || d)));
      const rows = KINDS.map(k => {
        const n = row[k + '_n'], m = row[k + '_m'], counted = n >= MIN_SAMPLES;
        const f = shown(k, row[k + '_f']), v = shown(k, row[k + '_v']);
        const next = MILESTONES[m];
        return [T(...NAMES[k].slice(0, 2)), counted ? fmt(v) : '–', counted ? fmt(f) : '–', n, m + ' / ' + MILESTONES.length,
                !counted ? T(`${MIN_SAMPLES - n} more`, `còn ${MIN_SAMPLES - n}`) : next ? '< ' + next + ' s' : '✓'];
      });
      box.append(table([T('Kind', 'Loại'), T('Usual', 'Thường'), T('Lately', 'Gần đây'), T('Times', 'Lần'), T('Milestones', 'Cột mốc'), T('Next goal', 'Mục tiêu')], rows));
      const mine = (history.data || []).filter(h => h.decoding === d);
      if (mine.length) {
        const wrap = el('div', undefined, 'chart'), canvas = el('canvas'); wrap.append(canvas); box.append(wrap);
        if (window.Chart) {
          new Chart(canvas, {
            type: 'line',
            data: { labels: mine.map(h => h.words), datasets: KINDS.flatMap(k => {
              const line = { borderColor: COLORS[k], backgroundColor: COLORS[k], cubicInterpolationMode: 'monotone', borderCapStyle: 'round', borderJoinStyle: 'round', borderWidth: 2.5, spanGaps: true };
              const pick = f => mine.map(h => h[k + '_n'] >= MIN_SAMPLES ? shown(k, h[k + '_' + f]) : null);
              return [{ ...line, label: T(...NAMES[k].slice(0, 2)) + ' · ' + T('lately', 'gần đây'), data: pick('f'), pointRadius: 3 },
                      { ...line, label: T(...NAMES[k].slice(0, 2)) + ' · ' + T('usual', 'thường'), data: pick('v'), borderDash: [6, 5], borderWidth: 2, pointRadius: 0, pointHoverRadius: 3 }];
            }) },
            options: { responsive: true, maintainAspectRatio: false, plugins: { tooltip: { callbacks: { title: items => T('Word ', 'Từ ') + items[0].label + ' · ' + new Date(mine[items[0].dataIndex].at).toLocaleString() } }, legend: {
              // one entry per kind: its two lines (lately, usual) are shown and hidden together
              labels: { usePointStyle: true, pointStyle: 'line', boxWidth: 28, generateLabels: chart => KINDS.map((k, i) => ({
                text: T(...NAMES[k].slice(0, 2)), strokeStyle: COLORS[k], fillStyle: COLORS[k], fontColor: Chart.defaults.color, lineWidth: 2.5, pointStyle: 'line', hidden: !chart.isDatasetVisible(2 * i), datasetIndex: 2 * i, kind: i })) },
              onClick: (e, item, legend) => { const c = legend.chart, show = !c.isDatasetVisible(2 * item.kind); c.setDatasetVisibility(2 * item.kind, show); c.setDatasetVisibility(2 * item.kind + 1, show); c.update(); },
            } }, scales: { x: { title: { display: true, text: T('words played', 'số từ đã chơi') } }, y: { beginAtZero: true, title: { display: true, text: T('seconds', 'giây') } } } },
          });
        }
        // one row for every card of progress (every 4 words): what the card showed, newest first: usual / lately of every kind
        const pair = (h, k) => h[k + '_n'] >= MIN_SAMPLES ? shown(k, h[k + '_v']).toFixed(1) + ' / ' + shown(k, h[k + '_f']).toFixed(1) : '–';
        const log = mine.map(h => [new Date(h.at).toLocaleString(), h.words, h.score, ...KINDS.map(k => pair(h, k) + (h[k + '_m'] ? ' ★' + h[k + '_m'] : ''))]).reverse();
        box.append(table([T('When', 'Khi nào'), T('Words', 'Từ'), T('Points', 'Điểm'), ...KINDS.map(k => T(...NAMES[k].slice(0, 2)) + ' (' + T('usual / lately', 'thường / gần đây') + ')')], log, 'log'));
      }
      $('decodings').append(box);
    }
    $('notes').textContent = T(
      'Solid line: lately, dashed line: usual (click a kind in the legend to hide or show both). Times are as in the game: the time to find the button (and, for the onset, to read the word) is taken off. "Usual" moves slowly, "Lately" follows the last words. A kind counts from 5 times. The history keeps one row for every card of progress (every 4 words): the usual and the latest time of every kind, ★ = milestones reached.',
      'Nét liền: gần đây, nét đứt: thường (bấm vào một loại ở chú giải để ẩn hoặc hiện cả hai). Thời gian tính như trong trò chơi: đã trừ thời gian tìm nút (và đọc từ với âm đầu). "Thường" đổi chậm, "Gần đây" theo những từ vừa chơi. Mỗi loại tính từ 5 lần. Lịch sử lưu một dòng cho mỗi thẻ tiến bộ (cứ 4 từ): thời gian thường và gần đây của mỗi loại, ★ = số cột mốc đạt được.');
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quốc Âm Tân Tự – intro</title>
<meta name="description" content="How Quốc Âm Tân Tự writes a Vietnamese syllable: an onset and a rhyme join into one character.">
<link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
<script src="/js/navigation.js"></script>
<script src="/js/parser.js"></script>
<script src="/js/qatt.js"></script>
<script src="/js/qatt-text.js"></script>
<style>
  .intro { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; text-align: center; }
  .intro h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.8rem); margin-bottom: .3rem; }
  .intro .lead { color: var(--muted, #6c757d); margin-bottom: 1.5rem; }
  .stage { position: relative; margin: 0 auto; width: min(18rem, 70vw); aspect-ratio: 1; display: grid; place-items: center; }
  .stage::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent, #c0392b) 14%, transparent), transparent 70%); opacity: 0; transition: opacity .6s; }
  .stage.glow::before { opacity: 1; }
  .stage tt { font-size: min(9rem, 36vw); line-height: 1; }
  .stage svg { stroke-width: 2.2px; }
  .stage use { transform-box: view-box; }
  .part-onset { color: #2a7fb8; }
  .part-rhyme { color: #c0392b; }
  .part-tone { color: #d08a12; }
  .spelling { font-size: clamp(1.6rem, 6vw, 2.2rem); font-family: Georgia, serif; min-height: 3.2rem; display: flex; justify-content: center; align-items: baseline; gap: .4rem; }
  .spelling span { opacity: .15; transition: opacity .4s, color .6s; }
  .spelling span.on { opacity: 1; }
  .spelling .plus { font-size: .7em; color: var(--muted, #6c757d); }
  .spelling .word { margin-left: .4rem; font-weight: 600; }
  .legend { display: flex; justify-content: center; gap: 1.2rem; font-size: .9rem; color: var(--muted, #6c757d); margin: .6rem 0 1.6rem; }
  .legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .35rem; vertical-align: baseline; }
  .intro-actions { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; }
  .show { max-width: 44rem; margin: 2.5rem auto 0; display: grid; gap: 1.6rem; }
  .show-card { border: 1px solid color-mix(in srgb, currentColor 16%, transparent); border-radius: 1rem; background: color-mix(in srgb, currentColor 4%, transparent); padding: 1rem 1rem 1.2rem; text-align: center; overflow: hidden; }
  .show-card h2 { font-family: Georgia, serif; font-weight: 400; font-size: 1.25rem; margin: .1rem 0 .6rem; }
  .show-card canvas { width: 100%; height: 21rem; display: block; touch-action: none; }
  .show-card .cap { min-height: 2.2rem; font-family: Georgia, serif; font-size: 1.5rem; }
  .qg { font-family: "QATT Pen Medium", "QATT Pen", sans-serif; line-height: 1; }
  /* the slot machine */
  .reels { display: flex; justify-content: center; gap: .8rem; margin: .4rem 0 1rem; }
  .reel { position: relative; width: 5.6rem; height: 7rem; overflow: hidden; border-radius: .7rem; background: var(--bs-body-bg, #fff); border: 2px solid color-mix(in srgb, currentColor 35%, transparent); box-shadow: inset 0 0 1rem rgba(0,0,0,.25); }
  .reel::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(0,0,0,.45), transparent 28%, transparent 72%, rgba(0,0,0,.45)); }
  .reel .strip { will-change: transform; }
  .reel .strip div { height: 7rem; display: grid; place-items: center; font-size: 4.6rem; }
  .reel:nth-child(1) { color: #2a7fb8; } .reel:nth-child(2) { color: #c0392b; } .reel:nth-child(3) { color: #d08a12; }
  .slot-out { height: 8.4rem; position: relative; }
  .slot-out .qg { font-size: 6.4rem; display: inline-block; }
  .pop { animation: pop .8s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; filter: blur(6px); } 100% { transform: none; opacity: 1; filter: none; } }
  .ring { position: absolute; left: 50%; top: 50%; width: 1rem; height: 1rem; margin: -.5rem; border-radius: 50%; border: 3px solid #d08a12; pointer-events: none; animation: ring .9s ease-out forwards; }
  @keyframes ring { to { transform: scale(14); opacity: 0; } }
  /* the orbit */
  .orbit { position: relative; width: min(22rem, 86vw); aspect-ratio: 1; margin: 0 auto; }
  .orbit .core { position: absolute; inset: 0; display: grid; place-items: center; font-size: 6.2rem; }
  .orbit .tok { position: absolute; left: 50%; top: 50%; font-size: 2.6rem; width: 3.4rem; height: 3.4rem; margin: -1.7rem; display: grid; place-items: center; color: #2a7fb8; border-radius: 50%; background: color-mix(in srgb, #2a7fb8 12%, transparent); transition: opacity .6s; }
  .orbit .path { position: absolute; inset: 6%; border-radius: 50%; border: 1px dashed color-mix(in srgb, currentColor 25%, transparent); }
  @media (prefers-reduced-motion: reduce) { .pop, .ring { animation: none; } }
</style>
<script defer src="/js/fonts.js"></script>
</head>
<body>
<main class="intro">
  <h1><span data-vi="Âm đầu + vần = âm tiết">Onset + rhyme = syllable</span></h1>
  <p class="lead"><span data-vi="Hai phần ghép lại thành một chữ.">Two parts join into one character.</span></p>

  <div class="stage" id="stage"><tt id="glyph"></tt></div>
  <div class="spelling" id="spelling" aria-live="polite"></div>
  <div class="legend">
    <span><i style="background:#2a7fb8"></i><span data-vi="Âm đầu">Onset</span></span>
    <span><i style="background:#c0392b"></i><span data-vi="Vần">Rhyme</span></span>
    <span><i style="background:#d08a12"></i><span data-vi="Thanh">Tone</span></span>
  </div>

  <div class="intro-actions">
    <button class="btn btn-quiet btn-pill" id="pause"><span data-vi="Tạm dừng">Pause</span></button>
    <a class="btn btn-cinnabar btn-pill" href="/spell.html"><span data-vi="Thử chơi Đánh vần!">Try Spell it!</span></a>
    <a class="btn btn-quiet btn-pill" href="/symbols.html"><span data-vi="Bảng ký hiệu">Symbol table</span></a>
  </div>

  <div class="show">
    <section class="show-card" data-run="swarm">
      <h2><span data-vi="Bầy hạt">Swarm</span></h2>
      <canvas id="swarm"></canvas>
      <div class="cap" id="swarmCap"></div>
    </section>

    <section class="show-card" data-run="slot">
      <h2><span data-vi="Quay số">Spin</span></h2>
      <div class="reels"><div class="reel"><div class="strip" id="r0"></div></div><div class="reel"><div class="strip" id="r1"></div></div><div class="reel"><div class="strip" id="r2"></div></div></div>
      <div class="slot-out" id="slotOut"></div>
      <button class="btn btn-cinnabar btn-pill" id="spin"><span data-vi="Quay!">Spin!</span></button>
    </section>

    <section class="show-card" data-run="brush">
      <h2><span data-vi="Bút lông">Brush</span></h2>
      <canvas id="brush"></canvas>
    </section>

    <section class="show-card" data-run="orbit">
      <h2><span data-vi="Quỹ đạo">Orbit</span></h2>
      <div class="orbit" id="orbit"><div class="path"></div><div class="core qg" id="core"></div></div>
      <div class="cap" id="orbitCap"></div>
    </section>
  </div>
</main>
<script>
  // The words of the show: [onset, rhyme] as written in Quốc Ngữ. First single words, then a family: one rhyme, changing onsets.
  const SHOW = [
    { words: [['x', 'a'], ['b', 'án'], ['t', 'ốt'], ['ng', 'ười'], ['m', 'ẹ']] },
    { family: true, words: [['b', 'an'], ['c', 'an'], ['l', 'an'], ['m', 'an'], ['t', 'an'], ['đ', 'an']] },
  ];
  const parser = new VietnameseParser();
  const qatt = new Qatt();
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let paused = false, resume = null;
  const gate = async ms => { await wait(ms); while (paused) await new Promise(r => resume = r); };

  // the <use> elements of a character, sorted by what they stand for
  function parts(svg, code) {
    const onset = code.split(',')[0];
    const out = { frame: [], onset: [], rhyme: [], tone: [] };
    svg.querySelectorAll('use').forEach(u => {
      const id = u.getAttribute('href').slice(1);
      if (id === 'square') out.frame.push(u);
      else if (/^q[ts]\d$/.test(id)) out.tone.push(u);
      else if (onset !== '_' && id.startsWith('v2-' + onset.replace('w', '') + '-') && !id.endsWith('-medial')) out.onset.push(u);
      else out.rhyme.push(u);
    });
    return out;
  }

  const anim = (els, frames, opts) => Promise.all(els.map(e => e.animate(frames, { fill: 'both', easing: 'cubic-bezier(.2,.8,.2,1)', ...opts }).finished));
  const from = (dx, dy) => [{ opacity: 0, transform: reduce ? 'none' : `translate(${dx}px, ${dy}px)` }, { opacity: 1, transform: 'none' }];

  async function play([on, rh], family, first, last) {
    const word = on + rh;
    const parsed = parser.parse(word);
    const code = parsed && parsed.qatt;
    if (!code) return;
    const tone = +code.split(',')[3] || 0;
    qatt.render(code, $('glyph'));
    const svg = $('glyph').querySelector('svg');
    const p = parts(svg, code);
    p.onset.forEach(u => u.classList.add('part-onset'));
    p.rhyme.forEach(u => u.classList.add('part-rhyme'));
    p.tone.forEach(u => u.classList.add('part-tone'));
    const all = [...p.onset, ...p.rhyme, ...p.tone];
    all.forEach(u => u.style.opacity = 0);
    $('stage').classList.remove('glow');

    const sp = $('spelling');
    sp.innerHTML = `<span class="part-onset">${on}</span><span class="plus">+</span><span class="part-rhyme">${rh}</span><span class="plus">=</span><span class="word">${word}</span>`;
    const [sOn, , sRh, , sWord] = sp.children;
    sp.querySelectorAll('.plus').forEach(s => s.classList.add('on'));

    const keepRhyme = family && !first;   // in the family the rhyme stays, only the onset comes
    if (keepRhyme) { p.rhyme.forEach(u => u.style.opacity = 1); sRh.classList.add('on'); }
    await gate(250);
    sOn.classList.add('on');
    await anim(p.onset, from(-70, 0), { duration: 900 });
    await gate(200);
    if (!keepRhyme) {
      sRh.classList.add('on');
      await anim(p.rhyme, from(70, 0), { duration: 900 });
      await gate(200);
    }
    if (tone) await anim(p.tone, from(0, -45), { duration: 700, easing: 'cubic-bezier(.3,1.6,.5,1)' });
    // the fusion: the colours flow into one ink, the word is read
    await gate(250);
    $('stage').classList.add('glow');
    sWord.classList.add('on');
    all.forEach(u => u.animate([{ color: getComputedStyle(u).color }, { color: 'currentColor' }], { duration: 900, fill: 'forwards', delay: 300 }));
    all.forEach(u => u.classList.remove('part-onset', 'part-rhyme', 'part-tone'));
    await gate(family ? 1600 : 2400);
    if (!family || last) await anim([svg], [{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
    else await anim(p.onset, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: reduce ? 'none' : 'translate(0, 40px)' }], { duration: 450 });
  }

  async function loop() {
    for (;;) for (const act of SHOW) for (let i = 0; i < act.words.length; i++)
      await play(act.words[i], act.family, i === 0, i === act.words.length - 1);
  }

  $('pause').addEventListener('click', () => {
    paused = !paused;
    $('pause').firstElementChild.dataset.vi = paused ? 'Phát' : 'Tạm dừng';
    $('pause').firstElementChild.textContent = paused ? 'Play' : 'Pause';
    document.getAnimations().forEach(a => paused ? a.pause() : a.play());
    if (!paused && resume) { resume(); resume = null; }
  });
  loop();
</script>
<script>
(() => {
  // ---- shared: the strokes of a syllable as points, taken from the SVG paths of qatt.js
  const COL = { onset: [42, 127, 184], rhyme: [192, 57, 43], tone: [208, 138, 18] };
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeIO = t => (t = clamp(t)) < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const inkOf = () => (getComputedStyle(document.body).color.match(/\d+/g) || [40, 30, 20]).slice(0, 3).map(Number);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function strokesOf(code, step) {
    const holder = document.createElement('div');
    qatt.render(code, holder);
    const svg = holder.querySelector('svg');
    const p = parts(svg, code);
    const out = {};
    for (const k of ['onset', 'rhyme', 'tone']) {
      out[k] = [];
      for (const u of p[k]) {
        const path = qatt._getDefById(u.getAttribute('href').slice(1));
        if (!path) continue;
        const len = path.getTotalLength();
        let cur = [];
        for (let l = 0; l <= len; l += step) {
          const q = path.getPointAtLength(l), pt = [q.x, q.y];
          if (cur.length && Math.hypot(pt[0] - cur[cur.length - 1][0], pt[1] - cur[cur.length - 1][1]) > step * 2.5) { out[k].push(cur); cur = []; }
          cur.push(pt);
        }
        if (cur.length) out[k].push(cur);
      }
    }
    return out;
  }
  const codeOf = w => { const r = parser.parse(w); return r && r.qatt; };

  // a canvas that keeps its size in pixels, and a loop that runs only while its card is on screen
  function stage(card, canvas, draw) {
    const ctx = canvas.getContext('2d');
    let vis = false, W = 0, H = 0, t0 = performance.now();
    const fit = () => { const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; canvas.width = W * d; canvas.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    new ResizeObserver(fit).observe(canvas); fit();
    new IntersectionObserver(e => { vis = e[0].isIntersecting; if (vis) t0 = performance.now() - (stage.t || 0); }, { threshold: .1 }).observe(card);
    let last = performance.now();
    const frame = now => { if (vis && !document.hidden) { ctx.clearRect(0, 0, W, H); draw(ctx, W, H, now - last, now); } last = now; requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  }
  const box = (W, H) => { const Hc = Math.min(H * .72, W * .62 * 15 / 13), Wc = Hc * 13 / 15; return { Hc, Wc, x: (W - Wc) / 2, y: (H - Hc) / 2 }; };
  const place = (b, pt, dx = 0) => [b.x + (pt[0] + 12.5) / 125 * b.Wc + dx, b.y + (pt[1] + 12.5) / 125 * b.Hc];

  // ================= 1. swarm: particles gather into the onset and the rhyme, slide together, a burst, one ink
  const WORDS1 = ['quốc', 'âm', 'tân', 'tự', 'người', 'mẹ'];
  const swarm = (() => {
    const card = document.querySelector('[data-run=swarm]'), canvas = $('swarm'), cap = $('swarmCap');
    let n = -1, ps = [], sparks = [], t = 1e9, T = 6800, W0 = 0, flashed = false, wordText = '';
    function next(W, H) {
      n = (n + 1) % WORDS1.length; wordText = WORDS1[n];
      const st = strokesOf(codeOf(wordText), .9), b = box(W, H), sep = b.Wc * .85;
      ps = []; sparks = []; flashed = false;
      const R = Math.max(W, H) * .8;
      for (const k of ['onset', 'rhyme', 'tone']) for (const stroke of st[k]) for (const pt of stroke) for (let j = 0; j < (k === 'tone' ? 5 : 3); j++) {
        const jx = rnd(-.9, .9), jy = rnd(-.9, .9);
        const B = place(b, [pt[0] + jx, pt[1] + jy]);
        const A = k === 'onset' ? [B[0] - sep, B[1]] : k === 'rhyme' ? [B[0] + sep, B[1]] : [B[0], B[1] - H * .55];
        const a = rnd(0, 6.283);
        ps.push({ k, A, B, S: [W / 2 + Math.cos(a) * R, H / 2 + Math.sin(a) * R * .7], d: rnd(0, 500), sw: rnd(-1, 1) * 160, ph: rnd(0, 6.28), vx: rnd(-1, 1), vy: rnd(-1.4, .4), s: rnd(1.6, 2.8) });
      }
      t = 0; W0 = W;
    }
    stage(card, canvas, (ctx, W, H, dt) => {
      if (reduced) t = 4200; else t += dt;
      if (t > T || !ps.length) next(W, H);
      const ink = inkOf(), b = box(W, H);
      const u = clamp((t - 3100) / 900);   // colour into ink
      if (t > 3050 && !flashed) { flashed = true; for (let i = 0; i < 160; i++) { const a = rnd(0, 6.283), v = rnd(.1, .55); sparks.push({ a, v, c: Math.random() < .5 ? COL.tone : Math.random() < .5 ? COL.onset : COL.rhyme }); } }
      cap.textContent = t > 3100 ? wordText : '';
      cap.style.opacity = clamp((t - 3100) / 500);
      for (const p of ps) {
        let x, y, al = 1;
        if (p.k === 'tone') {
          if (t < 2900) continue;
          const e = clamp((t - 2900) / 700), o = 1 + Math.sin(clamp(e) * 3.14) * 0;
          x = p.B[0]; y = p.B[1] - (1 - easeOut(e)) * H * .55; al = clamp(e * 3);
        } else if (t < 1400) {
          const e = easeOut((t - p.d) / 900);
          x = p.S[0] + (p.A[0] - p.S[0]) * e; y = p.S[1] + (p.A[1] - p.S[1]) * e;
          const w = Math.sin(e * Math.PI) * p.sw; x += w * (p.A[1] - p.S[1]) / 600; y -= w * (p.A[0] - p.S[0]) / 600;
          al = clamp((t - p.d) / 250);
        } else if (t < 2300) { x = p.A[0] + Math.sin(t * .008 + p.ph) * 1.4; y = p.A[1] + Math.cos(t * .007 + p.ph) * 1.4; }
        else if (t < 3100) { const e = easeIO((t - 2300) / 800); x = p.A[0] + (p.B[0] - p.A[0]) * e; y = p.A[1] + (p.B[1] - p.A[1]) * e; }
        else { x = p.B[0] + Math.sin(t * .006 + p.ph) * .5; y = p.B[1] + Math.cos(t * .005 + p.ph) * .5; }
        if (t > 5600) { const d = (t - 5600) / 1100; x += p.vx * d * 160; y += p.vy * d * 90 + d * d * 220; al *= 1 - clamp(d); }
        const c = mix(COL[p.k], ink, u);
        ctx.fillStyle = rgb(c, al * .16); ctx.fillRect(x - p.s * 2, y - p.s * 2, p.s * 4, p.s * 4);
        ctx.fillStyle = rgb(c, al); ctx.fillRect(x - p.s / 2, y - p.s / 2, p.s, p.s);
      }
      if (flashed && t < 4400) {
        const e = clamp((t - 3050) / 800), cx = W / 2, cy = H / 2;
        ctx.lineWidth = 3 * (1 - e); ctx.strokeStyle = rgb(COL.tone, 1 - e); ctx.beginPath(); ctx.arc(cx, cy, e * b.Hc * .9, 0, 6.283); ctx.stroke();
        for (const s of sparks) { const d = (t - 3050) * s.v * .45; ctx.fillStyle = rgb(s.c, (1 - e) * .9); ctx.fillRect(cx + Math.cos(s.a) * d, cy + Math.sin(s.a) * d + e * e * 30, 2.5, 2.5); }
      }
    });
  })();

  // ================= 2. brush: the strokes are written one by one by a glowing tip, then a seal
  const WORDS2 = ['quốc', 'âm', 'tân', 'tự'];
  const brush = (() => {
    const card = document.querySelector('[data-run=brush]'), canvas = $('brush');
    let n = -1, segs = [], total = 0, t = 1e9, word = '', T = 0;
    const MS = 11, GAP = 160;
    function next() {
      n = (n + 1) % WORDS2.length; word = WORDS2[n];
      const st = strokesOf(codeOf(word), 1.4);
      segs = []; total = 0;
      for (const k of ['onset', 'rhyme', 'tone']) for (const s of st[k]) { segs.push({ k, pts: s, start: total }); total += s.length * MS + GAP; }
      T = total + 3600; t = 0;
    }
    stage(card, canvas, (ctx, W, H, dt) => {
      if (reduced) t = total + 1500 || 4000; else t += dt;
      if (t > T || !segs.length) next();
      const b = box(W, H), ink = inkOf(), done = clamp((t - (total + 200)) / 700);
      ctx.lineCap = ctx.lineJoin = 'round';
      let tip = null;
      for (const sg of segs) {
        const k = clamp((t - sg.start) / MS | 0, 0, sg.pts.length - 1);
        if (t < sg.start) continue;
        const col = mix(COL[sg.k], ink, done);
        for (let i = 1; i <= k; i++) {
          const a = place(b, sg.pts[i - 1]), c = place(b, sg.pts[i]), s = i / sg.pts.length;
          const w = b.Hc * (.009 + .011 * Math.sin(Math.PI * Math.min(1, s * 1.15)) + .004 * (1 - s));
          ctx.strokeStyle = rgb(col, .13); ctx.lineWidth = w * 1.9; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...c); ctx.stroke();
          ctx.strokeStyle = rgb(col, .95); ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...c); ctx.stroke();
        }
        if (k < sg.pts.length - 1 || t - sg.start < sg.pts.length * MS + 80) tip = { p: place(b, sg.pts[k]), col };
      }
      if (tip && t < total) {
        const g = ctx.createRadialGradient(...tip.p, 0, ...tip.p, 26); g.addColorStop(0, rgb(tip.col, .85)); g.addColorStop(1, rgb(tip.col, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(...tip.p, 26, 0, 6.283); ctx.fill();
      }
      // the seal
      const se = clamp((t - (total + 700)) / 450);
      if (se > 0) {
        const sz = b.Hc * .2 * (1 + (1 - easeOut(se)) * .8), x = b.x + b.Wc * 1.02, y = b.y + b.Hc * .95 - sz;
        ctx.save(); ctx.globalAlpha = se; ctx.translate(x + sz / 2, y + sz / 2); ctx.rotate(-.06);
        ctx.fillStyle = '#b8332a'; ctx.beginPath(); ctx.roundRect(-sz / 2, -sz / 2, sz, sz, sz * .12); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = `${sz * .42}px Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(word, 0, 0);
        ctx.restore();
      }
      if (t > T - 700) { canvas.style.opacity = clamp((T - t) / 700); } else canvas.style.opacity = 1;
    });
  })();

  // ================= 3. slot machine: onset, rhyme and tone reels, then the character and the voice
  const slot = (() => {
    const POOL = ['bán', 'xa', 'tốt', 'người', 'mẹ', 'lan', 'cá', 'nhà', 'hoa', 'sách', 'sông', 'núi', 'mèo', 'gió', 'đẹp', 'thương', 'trời', 'nước', 'tôi', 'bạn', 'tân', 'chữ'];
    const toneGlyph = n => String.fromCodePoint(0xF0000 + 155 + n);
    const TONE_N = { 0: 1, 2: 2, 3: 3, 4: 4, 1: 5, 5: 6, 6: 7, 7: 8 };
    const items = POOL.map(w => { const c = codeOf(w); if (!c) return null; const [o, r, , t] = c.split(','); return { w, c, o, r, t: +t || 0 }; }).filter(Boolean);
    const uniq = (f) => [...new Map(items.map(i => [f(i).key, f(i)])).values()];
    const reels = [
      { el: $('r0'), list: uniq(i => ({ key: i.o, g: QattText.syllable(i.o + ',,,0') })) },
      { el: $('r1'), list: uniq(i => ({ key: i.r, g: QattText.syllable(',' + i.r + ',,0') })) },
      { el: $('r2'), list: [0, 1, 2, 3, 4, 5, 6, 7].map(t => ({ key: String(t), g: toneGlyph(TONE_N[t]) })) },
    ];
    const LAP = 3;
    reels.forEach(r => { r.pos = 0; r.el.innerHTML = Array.from({ length: LAP }, () => r.list.map(x => `<div class="qg">${x.g}</div>`).join('')).join(''); });
    const out = $('slotOut'), btn = $('spin');
    let busy = false;
    const h = () => reels[0].el.firstElementChild.getBoundingClientRect().height;
    const setPos = (r, idx, animate, ms) => {
      r.el.style.transition = animate ? `transform ${ms}ms cubic-bezier(.12,.8,.2,1.04)` : 'none';
      r.el.style.transform = `translateY(${-idx * h()}px)`;
    };
    reels.forEach(r => setPos(r, 0, false));
    function show(it) {
      out.innerHTML = '';
      const g = document.createElement('div'); g.className = 'qg pop'; g.textContent = QattText.syllable(it.c); out.append(g);
      const ring = document.createElement('i'); ring.className = 'ring'; out.append(ring);
      const w = document.createElement('div'); w.className = 'cap'; w.textContent = it.w; out.append(w);
      g.style.display = 'block'; g.style.fontSize = '5.2rem'; g.style.margin = '0 auto';
      try { const u = new SpeechSynthesisUtterance(it.w); u.lang = 'vi-VN'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
    }
    async function spin() {
      if (busy) return; busy = true; out.innerHTML = '';
      const it = items[Math.floor(Math.random() * items.length)];
      const keys = [it.o, it.r, String(it.t)];
      reels.forEach((r, i) => {
        const idx = r.list.findIndex(x => x.key === keys[i]);
        r.el.style.transition = 'none'; r.el.style.transform = `translateY(${-(r.pos % r.list.length) * h()}px)`; r.el.offsetWidth;
        const target = r.list.length * (LAP - 1) + idx;
        r.pos = idx; setPos(r, target, true, 1800 + i * 700);
      });
      await new Promise(r => setTimeout(r, 1800 + 2 * 700 + 250));
      show(it); busy = false;
    }
    btn.addEventListener('click', spin);
    new IntersectionObserver((e, o) => { if (e[0].isIntersecting) { o.disconnect(); setTimeout(spin, 500); } }, { threshold: .6 }).observe(document.querySelector('[data-run=slot]'));
  })();

  // ================= 4. orbit: one rhyme in the middle, the onsets circle it and are caught one by one
  const orbit = (() => {
    const el = $('orbit'), core = $('core'), cap = $('orbitCap');
    const ONSETS = ['b', 'c', 'l', 'm', 't', 'đ', 'n', 'h'], RHYME = 'an';
    const rhymeCode = codeOf('an'), rh = rhymeCode.split(',')[1];
    const toks = ONSETS.map((o, i) => {
      const code = codeOf(o + RHYME), d = document.createElement('div');
      d.className = 'tok qg'; d.textContent = QattText.syllable(code.split(',')[0] + ',,,0'); el.append(d);
      return { o, code, d, a: i / ONSETS.length * 6.283, gone: 0 };
    });
    core.textContent = QattText.syllable(',' + rh + ',,0');
    let vis = false, last = performance.now(), nextCatch = 1200, i = 0;
    new IntersectionObserver(e => vis = e[0].isIntersecting, { threshold: .2 }).observe(el);
    function catchOne() {
      // the token nearest to the left side of the circle flies in
      let best = null, bd = 9;
      for (const t of toks) { if (t.gone) continue; const d = Math.abs(((t.ang - Math.PI + 9.42) % 6.283) - 3.14); if (d < bd) { bd = d; best = t; } }
      if (!best) return;
      best.gone = 1; best.d.style.transition = 'transform .7s cubic-bezier(.5,0,.2,1), opacity .7s'; best.fly = 1;
      best.d.style.opacity = 0;
      core.textContent = QattText.syllable(best.code);
      core.animate([{ transform: 'scale(.7) rotate(-6deg)', filter: 'blur(5px)' }, { transform: 'none', filter: 'none' }], { duration: 600, easing: 'cubic-bezier(.2,1.6,.4,1)' });
      cap.textContent = best.o + RHYME;
      const ring = document.createElement('i'); ring.className = 'ring'; ring.style.borderColor = '#2a7fb8'; el.append(ring); setTimeout(() => ring.remove(), 900);
      setTimeout(() => { best.d.style.transition = 'opacity .8s'; best.d.style.opacity = 1; best.gone = 0; best.fly = 0; }, 1800);
    }
    const frame = now => {
      const dt = now - last; last = now;
      if (vis && !document.hidden) {
        const r = el.getBoundingClientRect().width * .44;
        for (const t of toks) {
          if (!reduced) t.a += dt * .00045;
          t.ang = t.a % 6.283;
          const pull = t.fly ? 0 : 1, k = .45 * r * 0;   // a flying token goes to the middle
          const rr = t.fly ? r * .08 : r;
          t.d.style.transform = `translate(${Math.cos(t.a) * rr}px, ${Math.sin(t.a) * rr}px) scale(${t.fly ? 1.1 : 1})`;
        }
        nextCatch -= dt;
        if (nextCatch < 0) { nextCatch = 2600; catchOne(); }
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  })();
})();
</script>

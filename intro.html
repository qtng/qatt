<style>
  .intro { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; text-align: center; }
  .intro h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.8rem); margin-bottom: .3rem; }
  .intro .lead { color: var(--muted, #6c757d); margin-bottom: 1.5rem; }
  .stage { position: relative; margin: 0 auto; width: min(18rem, 70vw); aspect-ratio: 1; display: grid; place-items: center; }
  .stage::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent, #c0392b) 14%, transparent), transparent 70%); opacity: 0; transition: opacity .6s; }
  .stage.glow::before { opacity: 1; }
  .stage tt { font-size: min(9rem, 36vw); line-height: 1; }
  .stage svg { stroke-width: 2.2px; }
  .stage use { transform-box: view-box; }

  .part-tone { color: #d08a12; }

  .scr-slide p { margin: .2em .45em; line-height: 1; white-space: nowrap; font-size: clamp(1.5rem, 6.4vw, 2.5rem); font-family: "QATT Pen Medium", "QATT Pen", sans-serif; }

  .show-card:not(.scr) .scr-slide p.latin { font: italic 600 clamp(2rem, 8vw, 3.4rem)/1.1 var(--boho-serif, "Cormorant Garamond", Georgia, serif); }
  .scr-slide p.latin { font-family: Georgia, "QATT Pen Medium", serif; }   /* the scrambled letters in the Latin phase are still QATT syllables */
  .host { display: grid; place-items: center; min-height: 15.5rem; }

      <label class="name2-rng"><span><span data-vi="Tốc độ quay">Speed of the turn</span>: <output id="name2SpdVal">300%</output></span><input type="range" class="form-range" id="name2Spd" min="25" max="1000" step="5" value="300"></label>

<script>
  // The words of the show: [onset, rhyme] as written in Quốc Ngữ. First single words, then a family: one rhyme, changing onsets.
  const SHOW = [
    { words: [['x', 'a'], ['b', 'án'], ['t', 'ốt'], ['ng', 'ười'], ['m', 'ẹ']] },
    { family: true, words: [['b', 'an'], ['c', 'an'], ['l', 'an'], ['m', 'an'], ['t', 'an'], ['đ', 'an']] },
  ];
  const parser = new VietnameseParser();
  const qatt = new Qatt();
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let paused = false, resume = null;
  const gate = async ms => { await wait(ms); while (paused) await new Promise(r => resume = r); };

  // the <use> elements of a character, sorted by what they stand for
  function parts(svg, code) {
    const onset = code.split(',')[0];
    const out = { frame: [], onset: [], rhyme: [], tone: [] };
    svg.querySelectorAll('use').forEach(u => {
      const id = u.getAttribute('href').slice(1);
      if (id === 'square') out.frame.push(u);
      else if (/^q[ts]\d$/.test(id)) out.tone.push(u);
      else if (onset !== '_' && id.startsWith('v2-' + onset.replace('w', '') + '-') && !id.endsWith('-medial')) out.onset.push(u);
      else out.rhyme.push(u);
    });
    return out;
  }

  const anim = (els, frames, opts) => Promise.all(els.map(e => e.animate(frames, { fill: 'both', easing: 'cubic-bezier(.2,.8,.2,1)', ...opts }).finished));
  const from = (dx, dy) => [{ opacity: 0, transform: reduce ? 'none' : `translate(${dx}px, ${dy}px)` }, { opacity: 1, transform: 'none' }];

  async function play([on, rh], family, first, last) {
    const word = on + rh;
    const parsed = parser.parse(word);
    const code = parsed && parsed.qatt;
    if (!code) return;
    const tone = +code.split(',')[3] || 0;
    qatt.render(code, $('glyph'));
    const svg = $('glyph').querySelector('svg');
    const p = parts(svg, code);
    p.onset.forEach(u => u.classList.add('part-onset'));
    p.rhyme.forEach(u => u.classList.add('part-rhyme'));
    p.tone.forEach(u => u.classList.add('part-tone'));
    const all = [...p.onset, ...p.rhyme, ...p.tone];
    all.forEach(u => u.style.opacity = 0);
    $('stage').classList.remove('glow');

    const sp = $('spelling');
    sp.innerHTML = `<span class="part-onset">${on}</span><span class="plus">+</span><span class="part-rhyme">${rh}</span><span class="plus">=</span><span class="word">${word}</span>`;
    const [sOn, , sRh, , sWord] = sp.children;
    sp.querySelectorAll('.plus').forEach(s => s.classList.add('on'));

    const keepRhyme = family && !first;   // in the family the rhyme stays, only the onset comes
    if (keepRhyme) { p.rhyme.forEach(u => u.style.opacity = 1); sRh.classList.add('on'); }
    await gate(250);
    sOn.classList.add('on');
    await anim(p.onset, from(-70, 0), { duration: 900 });
    await gate(200);
    if (!keepRhyme) {
      sRh.classList.add('on');
      await anim(p.rhyme, from(70, 0), { duration: 900 });
      await gate(200);
    }
    if (tone) await anim(p.tone, from(0, -45), { duration: 700, easing: 'cubic-bezier(.3,1.6,.5,1)' });
    // the fusion: the colours flow into one ink, the word is read
    await gate(250);
    $('stage').classList.add('glow');
    sWord.classList.add('on');
    all.forEach(u => u.animate([{ color: getComputedStyle(u).color }, { color: 'currentColor' }], { duration: 900, fill: 'forwards', delay: 300 }));
    all.forEach(u => u.classList.remove('part-onset', 'part-rhyme', 'part-tone'));
    await gate(family ? 1600 : 2400);
    if (!family || last) await anim([svg], [{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
    else await anim(p.onset, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: reduce ? 'none' : 'translate(0, 40px)' }], { duration: 450 });
  }

  async function loop() {
    for (;;) for (const act of SHOW) for (let i = 0; i < act.words.length; i++)
      await play(act.words[i], act.family, i === 0, i === act.words.length - 1);
  }

  $('pause').addEventListener('click', () => {
    paused = !paused;
    $('pause').firstElementChild.dataset.vi = paused ? 'Phát' : 'Tạm dừng';
    $('pause').firstElementChild.textContent = paused ? 'Play' : 'Pause';
    document.getAnimations().forEach(a => paused ? a.pause() : a.play());
    if (!paused && resume) { resume(); resume = null; }
  });
  loop();
</script>
<script>
(() => {
  // ---- shared: the strokes of a syllable as points, taken from the SVG paths of qatt.js
  const COL = { onset: [42, 127, 184], rhyme: [192, 57, 43], tone: [208, 138, 18] };
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeIO = t => (t = clamp(t)) < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const inkOf = () => (getComputedStyle(document.body).color.match(/\d+/g) || [40, 30, 20]).slice(0, 3).map(Number);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function strokesOf(code, step) {
    const holder = document.createElement('div');
    qatt.render(code, holder);
    const svg = holder.querySelector('svg');
    const p = parts(svg, code);
    const out = {};
    for (const k of ['onset', 'rhyme', 'tone']) {
      out[k] = [];
      for (const u of p[k]) {
        const path = qatt._getDefById(u.getAttribute('href').slice(1));
        if (!path) continue;
        const len = path.getTotalLength();
        let cur = [];
        for (let l = 0; l <= len; l += step) {
          const q = path.getPointAtLength(l), pt = [q.x, q.y];
          if (cur.length && Math.hypot(pt[0] - cur[cur.length - 1][0], pt[1] - cur[cur.length - 1][1]) > step * 2.5) { out[k].push(cur); cur = []; }
          cur.push(pt);
        }
        if (cur.length) out[k].push(cur);
      }
    }
    return out;
  }
  const codeOf = w => { const r = parser.parse(w); return r && r.qatt; };

  // a canvas that keeps its size in pixels, and a loop that runs only while its card is on screen
  function stage(card, canvas, draw) {
    const ctx = canvas.getContext('2d');
    let vis = false, W = 0, H = 0, t0 = performance.now();
    const fit = () => { const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; canvas.width = W * d; canvas.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    new ResizeObserver(fit).observe(canvas); fit();
    new IntersectionObserver(e => { vis = e[0].isIntersecting; if (vis) t0 = performance.now() - (stage.t || 0); }, { threshold: .1 }).observe(card);
    let last = performance.now();
    const frame = now => { if (vis && !document.hidden) { ctx.clearRect(0, 0, W, H); draw(ctx, W, H, now - last, now); } last = now; requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  }
  const box = (W, H) => { const Hc = Math.min(H * .72, W * .62 * 15 / 13), Wc = Hc * 13 / 15; return { Hc, Wc, x: (W - Wc) / 2, y: (H - Hc) / 2 }; };
  const place = (b, pt, dx = 0) => [b.x + (pt[0] + 12.5) / 125 * b.Wc + dx, b.y + (pt[1] + 12.5) / 125 * b.Hc];

  // ================= 2. brush: the strokes are written one by one by a glowing tip, then a seal
  const WORDS2 = ['quốc', 'âm', 'tân', 'tự'];
  const brush = (() => {
    const card = document.querySelector('[data-run=brush]'), canvas = $('brush');
    let n = -1, segs = [], total = 0, t = 1e9, word = '', T = 0;
    const MS = 11, GAP = 160;
    function next() {
      n = (n + 1) % WORDS2.length; word = WORDS2[n];
      const st = strokesOf(codeOf(word), 1.4);
      segs = []; total = 0;
      for (const k of ['onset', 'rhyme', 'tone']) for (const s of st[k]) { segs.push({ k, pts: s, start: total }); total += s.length * MS + GAP; }
      T = total + 3600; t = 0;
    }
    stage(card, canvas, (ctx, W, H, dt) => {
      if (reduced) t = total + 1500 || 4000; else t += dt;
      if (t > T || !segs.length) next();
      const b = box(W, H), ink = inkOf(), done = clamp((t - (total + 200)) / 700);
      ctx.lineCap = ctx.lineJoin = 'round';
      let tip = null;
      for (const sg of segs) {
        const k = clamp((t - sg.start) / MS | 0, 0, sg.pts.length - 1);
        if (t < sg.start) continue;
        const col = mix(COL[sg.k], ink, done);
        for (let i = 1; i <= k; i++) {
          const a = place(b, sg.pts[i - 1]), c = place(b, sg.pts[i]), s = i / sg.pts.length;

    tl.add(ws, { scale: 1, color: (el, i) => pal.words[i], ease: 'inOutExpo', duration: 1150 }, st({ start: '<<' }));
    tl.add(pxs, { innerHTML: SC({ override: false, text: (el, i) => LAT[i], from: 'right', duration: 950, settleDuration: 500, ease: 'inOut' }) }, st({ start: '<<' }));
    tl.add(pxs, { innerHTML: SC({ text: '', override: false, from: 'random', reversed: true, duration: 850, perturbation: .5 }) }, st({ start: '+=1500' }));
    tl.call(() => ws.forEach(p => p.classList.remove('latin')), '<<');
    tl.add(end, { scale: 1.3, color: pal.end, ease: 'inOutExpo', duration: 1000 }, '+=250');
    tl.add(endPx, { innerHTML: SC({ chars: CHARS, override: ' ', from: 'center', settleDuration: 600, revealRate: 33, perturbation: .2, text: 'qatt.org' }) }, '<<');
    tl.add(end, { color: pal.last, scale: 2, ease: 'inOutExpo', duration: 750 }, '+=1300');
    tl.add(endPx, { innerHTML: SC({ chars: CHARS, text: ' ', override: false, duration: 750, ease: 'out(2)', from: 'right' }) }, '<<');
    tl.init();
    speedSlider(root, tl);
    let on = false;
    new IntersectionObserver(e => { const v = e[0].isIntersecting; if (v && !on) { tl.play(); on = true; } if (!v && on) { tl.pause(); on = false; } }, { threshold: .25 }).observe(root);
  }
  // the colours of the scramble card: the Latin words white, the QATT name orange, the end in white and yellow
  shortScramble('scramble2', { start: '#ffd84a', qatt: '#e0a020', words: ['#f3ede2', '#f3ede2'], end: '#f3ede2', last: '#ffd84a' });
  // 6c. a clone of the first scramble card, only its middle: one line of texts that scramble from one into the next (no diamond, no slide of several lines).
  // The texts are a list that can be changed: each entry has its text and the time on the timeline of TOTAL ms at which it has settled (from) and at which it starts to scramble into the next (to);
  // the time between `to` of one entry and `from` of the next is the scramble. A lowercase text of Quốc Ngữ syllables is shown in QATT, any other text as it is typed (the Latin phase).
  (() => {
    if (!A.scrambleText) return;
    const SC = A.scrambleText, root = card('scramble4'), slide = root.querySelector('.scr-slide');
    const TOTAL = 13.1, STEP = .1, KEY = 'introScramble4', list = $('scr4List');
    const DEFAULT = [['tân', 0, .2], ['quốc', .5, 2.9], ['quốc âm tân tự', 4, 4.4], ['Quốc Âm Tân Tự', 5.5, 7.5], ['qatt.org', 9.7, 11.2], ['tân', 11.9, 13.1]];
    let entries = DEFAULT.map(([text, from, to]) => ({ text, from, to }));
    try { const k = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(k) && k.length) entries = k.map(e => ({ text: String(e.text), from: +e.from || 0, to: +e.to || 0 })); } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (e) {} };

    const POOL = 'quốc âm tân tự người nước việt nam nhà bạn tôi đẹp trời gió hoa sách chữ nôm thơ lòng thương xuân hạ thu đông sáng chiều đêm sông núi biển cá gà mèo'.split(' ');
    const rev = [], reg = new Map();
    const tok = glyph => { if (!reg.has(glyph)) { reg.set(glyph, String.fromCharCode(0xE000 + rev.length)); rev.push(glyph); } return reg.get(glyph); };
    const toks = phrase => phrase.split(' ').map(w => tok(QattText.word(w, parser) || w)).join(' ');
    const show = t => [...t].map(c => { const k = c.charCodeAt(0) - 0xE000; return k >= 0 && k < rev.length ? rev[k] : c; }).join('');
    const GL = POOL.map(toks), CHARS = GL.join('');
    const isQatt = text => text === text.toLowerCase() && text.split(/\s+/).every(w => QattText.word(w, parser));
    const p = document.createElement('p'); p.innerHTML = '<span class="vis"></span><span class="px"></span>'; p.lastChild.textContent = ' '; slide.append(p);
    slide.style.opacity = 1;
    const px = p.lastChild, mirror = () => { const t = show(px.textContent); if (p.firstChild.textContent !== t) p.firstChild.textContent = t; };

    let tl = null, on = false, speed = 1;
    const build = () => {
      if (tl) tl.revert();
      px.textContent = ' '; p.classList.remove('latin'); mirror();
      const es = entries.filter(e => e.text.trim()).map(e => ({ ...e, text: e.text.trim() })).sort((x, y) => x.from - y.from);
      tl = A.createTimeline({ loop: true, autoplay: false, onUpdate: mirror });
      tl.speed = speed;
      // `at` is where the previous text ends; the scramble into the next one fills the time up to its `from`
      let at = 0;
      const into = (text, t1) => {
        const q = text.trim() ? isQatt(text) : false, target = q ? toks(text) : text || ' ', t0 = at * 1000, gap = t1 * 1000 - t0;
        tl.call(() => p.classList.toggle('latin', !q), t0);
        if (gap >= 60) tl.add(px, { innerHTML: SC({ chars: CHARS, text: target, override: false, from: 'center', duration: gap }), duration: gap, ease: 'linear' }, t0);
        else tl.call(() => { px.textContent = target; mirror(); }, t1 * 1000);
      };
      es.forEach(e => { into(e.text, e.from); at = Math.max(e.to, e.from); });
      if (es.length && at < TOTAL) into(' ', TOTAL);
      tl.add(slide, { opacity: 1, duration: 1 }, TOTAL * 1000 - 1);   // the loop is TOTAL long whatever the last entry does
      tl.init();
      if (on) tl.play();
    };

    const fmt = v => v.toFixed(1).replace('.', ',') + ' s';
    const render = () => {
      $('scr4Total').textContent = '· ' + fmt(TOTAL);
      list.replaceChildren(...entries.map((e, i) => {
        const row = document.createElement('div'); row.className = 'scr-ent';
        row.innerHTML = '<input type="text" class="form-control form-control-sm" aria-label="Text" autocomplete="off" spellcheck="false">' +
          '<button type="button" class="btn btn-quiet btn-sm btn-pill" aria-label="Remove" data-vi-aria-label="Xoá" title="Remove" data-vi-title="Xoá">×</button>' +
          '<div class="rngs"><label><span data-vi="Từ">From</span> <output></output><input type="range" class="form-range" min="0" max="' + TOTAL + '" step="' + STEP + '" aria-label="From"></label>' +
          '<label><span data-vi="Đến">To</span> <output></output><input type="range" class="form-range" min="0" max="' + TOTAL + '" step="' + STEP + '" aria-label="To"></label></div>' +
          '<div class="bar"><i></i></div>';
        const [txt] = row.getElementsByTagName('input'), [rf, rt] = row.querySelectorAll('input[type=range]'), [of, ot] = row.querySelectorAll('output'), bar = row.querySelector('.bar i');
        const paint = () => {
          rf.value = e.from; rt.value = e.to; of.textContent = ' ' + fmt(e.from); ot.textContent = ' ' + fmt(e.to);
          bar.style.left = e.from / TOTAL * 100 + '%'; bar.style.width = Math.max(e.to - e.from, 0) / TOTAL * 100 + '%';
        };
        txt.value = e.text; paint();
        let timer = 0; const changed = () => { save(); clearTimeout(timer); timer = setTimeout(build, 150); };
        txt.addEventListener('input', () => { e.text = txt.value; changed(); });
        rf.addEventListener('input', () => { e.from = +rf.value; if (e.to < e.from) e.to = e.from; paint(); changed(); });
        rt.addEventListener('input', () => { e.to = +rt.value; if (e.from > e.to) e.from = e.to; paint(); changed(); });
        row.querySelector('button').addEventListener('click', () => { entries.splice(i, 1); save(); render(); build(); });
        return row;
      }));
    };
    $('scr4Add').addEventListener('click', () => {
      const last = Math.max(0, ...entries.map(e => e.to)), from = Math.min(last + .5, TOTAL - .5);
      entries.push({ text: 'tự', from: +from.toFixed(1), to: +Math.min(from + .5, TOTAL).toFixed(1) });
      save(); render(); build();
    });
    $('scr4Reset').addEventListener('click', () => { entries = DEFAULT.map(([text, from, to]) => ({ text, from, to })); save(); render(); build(); });
    const sp = root.querySelector('.scr-rng input'), out = root.querySelector('.scr-rng output');
    sp.addEventListener('input', () => { speed = sp.value / 100; out.textContent = sp.value + '%'; if (tl) tl.speed = speed; });
    render(); build();
    new IntersectionObserver(e => { const v = e[0].isIntersecting; if (v && !on) { tl.play(); on = true; } if (!v && on) { tl.pause(); on = false; } }, { threshold: .25 }).observe(root);
  })();
})();
</script>
</body>
</html>

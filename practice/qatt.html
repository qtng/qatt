<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Học và luyện Quốc Âm Tân Tự</title>
  <link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://chunom.org/media/css/fonts/all.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../qatt/js/navigation.js"></script>
  <script src="../../qatt/js/qatt.js"></script>
  <script src="../../qatt/js/parser.js?v=3"></script>
  <script src="../../qatt/js/supabase.js?v=6"></script>
  <script src="../../qatt/js/login.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link  href="../../chunom/css/practice.css?v=2" rel="stylesheet">
  <script src="../../chunom/js/practice.js?v=7"></script>
</head>
<body>
  <div id="app"></div>
  <script>
async function main() {
const app = await App.init(document.getElementById("app"), { forms: ["qatt", "text"], requireLogin: true }); // the practice of qatt asks glyphs and quốc ngữ, for signed-in users
if (!app) return; // not signed in: the page asks for the login
const basicStyles = ["3"];
const onsets = "b c ch d đ g h kh l m n ng nh ph r s t th tr v x".split(" ");
const vowels = "ă â a ơ ê e i ia ô o u ua ư ưa".split(" ");
const tones = "a à á ả ã ạ".split(" ");
const codas = "ao ai an át am áp ang ác anh ách".split(" ");
const levelName = "QATT I — Quốc Âm Tân Tự cơ bản";

//app.addLesson({ id: "onsets", category: levelName, name: "Phụ âm đầu", style: basicStyles, symbols: ["a", ...onsets.map(o => o.trim() + "a").filter(o => o !== "a")] });
app.addLesson({
	id: "onsets",
	category: levelName,
	name: "22 Chữ cơ bản",
	style: ["3"],
	thumb: "ngan",
	classes: "bg-primary",
	symbols: [
		"lơn", "uơn",
		"ngan", "hoan",
		"ghen", "quen",
		"trưn", "đươn",
		"năn", "toăn",
		"thân", "nhuân",
		"chên", "duên",
		"xiên", "khuyên",
		"sin", "ruyn",
		"môn", "bun",
		"von", "phuôn"
	]
});
app.addLesson({
	id: "tones",
	category: levelName,
	name: "Thanh điệu",
	style: ["3"],
	classes: "bg-primary darken-10",
	thumb: "cán",
	symbols: [
		"can",
		"cán", "càn",
		"cản", "cãn", "cạn",
		"cát", "cạt"
	]
});
app.addLesson({
	id: "codas",
	category: "QATT II — thảo thư và qatt-mini",
	name: "Tùy chọn: Âm cuối (thảo thư và qatt-mini)",
	style: ["3"],
	classes: "bg-warning darken-30",
	thumb: "cát",
	symbols: [
		"cán",
		"cát",
		"ca", "cá",
		"cáng",
		"các",
		"cám",
		"cáp",
		"cái",
		"cáo",
		"cánh", "cách",
		"kếnh", "kếch",
		"kính", "kích",
	]
});

const rhymesList = [
    { words: "a ơ ê e i ia ô o u ua ư ưa" },
    { words: "ai ay ơi ây ôi oi ui uôi ưi ươi" }, 
    { words: "ao au âu êu eo iu iêu ưu ươu" },
    { words: "an ăn ơn ân ên en in iên ôn on un uôn ưn ươn" }, 
    { words: "am ăm ơm âm êm em im iêm ôm om um uôm ưm ươm" },
    { words: "ang ăng anh âng ênh eng inh iêng ông ong ung uông ưng ương" },
];

const rhymesList2 = [
    { words: "oa uơ uê oe uy uya" }, 
    { words: "oai oay uơi uây" },
    { words: "oao oau uâu uêu oeo" },
    { words: "oan oăn uơn uân uên oen uyn uyên" }, 
    { words: "oam oăm uâm" },
    { words: "oang oăng oanh uâng uênh oeng uynh" },
];

let rhymeIdx = 0;
rhymesList.forEach((rhyme, i) => {
	rhymeIdx++; app.addLesson({
		id: "rhymes-" + rhymeIdx,
		category: "QATT III — Quốc Âm Tân Tự mở rộng",
		name: "Vần " + rhymeIdx,
		style: ["0"],
		classes: "bg-success darken-" + (i * 10),
		thumb: rhyme.words.split(" ")[1],
		symbols: rhyme.words.split(" ")
	});
});
rhymesList2.forEach((rhyme, i) => {
	rhymeIdx++; app.addLesson({
		id: "rhymes-" + rhymeIdx,
		category: "QATT III — Quốc Âm Tân Tự mở rộng",
		name: "Vần " + rhymeIdx,
		style: ["0"],
		classes: "bg-danger darken-" + (i * 10),
		thumb: rhyme.words.split(" ")[1],
		symbols: rhyme.words.split(" ")
	});
});
	
window.app = app;
app.renderLibrary();

}

main()
  </script>

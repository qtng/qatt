<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QATT Sprites Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .main-grid {
            display: grid;
            grid-template-rows: auto repeat(5, max-content);
            grid-auto-columns: max-content;
            grid-auto-flow: column;
            column-gap: 0.5rem;
        }
        
        .col-wrapper {
            display: grid;
            grid-template-rows: subgrid;
            grid-row: span 6;
            row-gap: 1rem;
            justify-items: center;
        }

        .sprite-card {
            transition: opacity 0.2s ease-in-out;
            align-self: end; 
            margin: 0;
            cursor: pointer;
        }

        .sprite-wrapper {
            width: 50px;
            min-height: 75px; 
            flex-shrink: 0; 
            background-repeat: no-repeat;
        }

        .inputs-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1px; 
            padding: 2px 0; 
            width: 75px; 
        }

        .sprite-input {
            font-size: 0.75rem;
            line-height: 1;
            text-align: left;
            border: none;
            background: transparent;
            padding: 0 4px; 
            margin: 0;
            height: 16px; 
            width: 100%;
            outline: none;
            box-shadow: none !important;
        }
        
        .sprite-input:focus {
            background: rgba(0,0,0,0.05);
            border-radius: 2px;
        }
        
        body.labels-collapsed .inputs-container .sprite-input:not(:first-child) {
            display: none;
        }

        #exportOutput {
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
    </style>
</head>
<body class="bg-white">

    <div class="container-fluid py-4">
        <h1 class="mb-4 text-center">QATT Sprites Overview</h1>
        
        <div class="main-grid overflow-x-auto pb-3" id="main-row"></div>
        
        <div class="text-center mt-5 mb-3">
            <button id="toggleHeightBtn" class="btn btn-outline-secondary">
                Toggle Single Line Labels
            </button>
        </div>

        <div class="text-center mb-5">
            <div class="d-flex justify-content-center gap-2">
                <button id="importBtn" class="btn btn-primary">Import JSON</button>
                <button id="exportBtn" class="btn btn-success">Export</button>
            </div>
            <div class="mt-3 d-flex justify-content-center">
                <pre id="exportOutput" class="bg-light p-3 border rounded text-start d-none" style="max-width: 600px; width: 100%; overflow-x: auto;" title="Click to copy"></pre>
            </div>
        </div>
    </div>

    <!-- Import JSON Modal -->
    <div class="modal fade" id="importModal" tabindex="-1" aria-labelledby="importModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="importModalLabel">Import JSON</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea id="importInput" class="form-control" rows="8" placeholder="Paste your JSON here..."></textarea>
                    <div id="importErrorMsg" class="text-danger mt-2 d-none">Invalid JSON format. Please check your input.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="doImportBtn">Import & Apply</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const names = "z l ng h g c tr d t n th nh ch dz x kh s r m b v ph".split(" ");
        const row = document.getElementById('main-row');

        let importModal = null;

        const toggleHeightBtn = document.getElementById('toggleHeightBtn');
        const exportBtn = document.getElementById('exportBtn');
        const exportOutput = document.getElementById('exportOutput');
        
        const importBtn = document.getElementById('importBtn');
        const doImportBtn = document.getElementById('doImportBtn');
        const importInput = document.getElementById('importInput');
        const importErrorMsg = document.getElementById('importErrorMsg');

        // Toggle Button
        toggleHeightBtn.addEventListener('click', () => {
            document.body.classList.toggle('labels-collapsed');
        });

        // Export (mit Arrays und Sortierung)
        exportBtn.addEventListener('click', () => {
            const exportData = {};
            
            names.forEach(name => {
                for (let i = 0; i < 5; i++) {
                    const storageKey = `qatt_sprite_${name}_${i}`;
                    const savedLabel = localStorage.getItem(storageKey);
                    
                    if (savedLabel === null || savedLabel.trim() === "") {
                        exportData[storageKey] = null;
                    } else {
                        let lines = savedLabel.split('\n').map(l => l.trim()).filter(l => l !== "");
                        lines.sort((a, b) => {
                            const scoreA = parseFloat(a.match(/[\d.]+$/)?.[0] || 0);
                            const scoreB = parseFloat(b.match(/[\d.]+$/)?.[0] || 0);
                            return scoreB - scoreA;
                        });
                        exportData[storageKey] = lines;
                    }
                }
            });

            exportOutput.textContent = JSON.stringify(exportData, null, 2);
            exportOutput.classList.remove('d-none');
        });

        // Click to copy
        exportOutput.addEventListener('click', () => {
            const textToCopy = exportOutput.textContent;
            if (!textToCopy) return;

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                exportOutput.classList.replace('bg-light', 'bg-success');
                exportOutput.classList.add('text-white');
                setTimeout(() => {
                    exportOutput.classList.replace('bg-success', 'bg-light');
                    exportOutput.classList.remove('text-white');
                }, 400);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textarea);
        });

        // Import
        importBtn.addEventListener('click', () => {
            if (!importModal) {
                importModal = new bootstrap.Modal(document.getElementById('importModal'));
            }
            importInput.value = '';
            importErrorMsg.classList.add('d-none');
            importModal.show();
        });

        doImportBtn.addEventListener('click', () => {
            try {
                importErrorMsg.classList.add('d-none');
                const data = JSON.parse(importInput.value);
                
                for (const key in data) {
                    if (key.startsWith('qatt_sprite_')) {
                        if (data[key] === null || data[key] === "" || (Array.isArray(data[key]) && data[key].length === 0)) {
                            localStorage.removeItem(key);
                        } else {
                            let valueToSave = data[key];
                            if (Array.isArray(valueToSave)) {
                                valueToSave = valueToSave.join('\n');
                            }
                            localStorage.setItem(key, valueToSave);
                        }
                    }
                }
                
                // DOM aktualisieren
                document.querySelectorAll('.sprite-card').forEach(card => {
                    const storageKey = card.dataset.storageKey;
                    if (storageKey) {
                        const val = localStorage.getItem(storageKey) || "";
                        const lines = val.split('\n');
                        const inputs = card.querySelectorAll('.sprite-input');
                        
                        inputs.forEach((input, index) => {
                            input.value = lines[index] || "";
                        });
                        
                        updateCardState(card, inputs);
                    }
                });

                importModal.hide();
                exportOutput.classList.add('d-none'); 
            } catch (error) {
                importErrorMsg.classList.remove('d-none');
            }
        });

        function updateCardState(card, inputs) {
            const vals = Array.from(inputs)
                .map(i => i.value.trim().replace(/\s+/g, ' '))
                .filter(v => v !== "");
            
            const newText = vals.join('\n');
            
            if (newText === "") {
                card.classList.add('opacity-50');
                inputs.forEach(i => i.style.color = 'red');
            } else {
                card.classList.remove('opacity-50');
                
                const firstWord = vals[0].split(/[\s\n]+/)[0].toLowerCase();
                let color = 'red';
                
                if (firstWord.endsWith('ng') || firstWord.endsWith('nh')) {
                    color = 'green';
                } else if (firstWord.endsWith('n')) {
                    color = 'blue';
                } else if (firstWord.endsWith('m')) {
                    color = 'purple';
                }
                
                inputs.forEach(i => i.style.color = color);
            }
            
            return newText;
        }

        names.forEach((name, index) => {
            const col = document.createElement('div');
            col.className = 'col-wrapper';
            
            if (index % 2 === 1) {
                col.classList.add('border-end', 'border-2', 'pe-2');
            }
            
            const title = document.createElement('h3');
            title.textContent = name;
            title.className = 'text-center mb-3 w-100 fs-5';
            title.style.alignSelf = 'end';
            col.appendChild(title);

            const imageUrl = `https://qatt.org/qatt/img/qatt/${name}.jpg`;
            const sprites = [];

            for (let i = 0; i < 5; i++) {
                const storageKey = `qatt_sprite_${name}_${i}`;
                const savedLabel = localStorage.getItem(storageKey) || "";
                const savedLines = savedLabel.split('\n');

                const card = document.createElement('div');
                card.className = 'sprite-card border rounded shadow-sm bg-white overflow-hidden d-flex align-items-stretch';
                card.dataset.storageKey = storageKey;

                const inputsContainer = document.createElement('div');
                inputsContainer.className = 'inputs-container bg-light border-start border-light';

                const inputs = [];
                for (let j = 0; j < Math.max(5, savedLines.length); j++) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'sprite-input';
                    input.value = savedLines[j] || "";
                    
                    input.addEventListener('change', () => {
                        const newText = updateCardState(card, inputs);
                        if (newText === "") {
                            localStorage.removeItem(storageKey);
                        } else {
                            localStorage.setItem(storageKey, newText);
                        }
                    });
                    
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            if (j < 4) {
                                inputs[j+1].focus();
                            } else {
                                input.blur();
                            }
                        }
                    });

                    inputs.push(input);
                    inputsContainer.appendChild(input);
                }

                const sprite = document.createElement('div');
                sprite.className = 'sprite-wrapper';
                
                card.appendChild(sprite);
                card.appendChild(inputsContainer);

                updateCardState(card, inputs);
                
                // Falls komplett leer, Klick auf die Karte fokussiert das erste Input-Feld
                card.addEventListener('click', (e) => {
                    if (card.classList.contains('opacity-50') && !e.target.classList.contains('sprite-input')) {
                        inputs[0].focus();
                    }
                });

                col.appendChild(card);
                sprites.push(sprite);
            }

            row.appendChild(col);

            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                sprites.forEach((sprite, i) => {
                    sprite.style.backgroundImage = `url(${imageUrl})`;
                    sprite.style.backgroundSize = '100% 500%';
                    sprite.style.backgroundPosition = `0% ${i * 25}%`;
                });
            };
        });
    </script>
</body>
</html>

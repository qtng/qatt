<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QATT Sprites Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .fixed-title-height {
            height: 2em;
        }
        .sprite-wrapper {
            position: relative;
            width: 50px;
            aspect-ratio: 2 / 3;
            cursor: pointer;
            background-repeat: no-repeat;
            transition: opacity 0.2s ease-in-out;
        }
        .sprite-label {
            position: absolute;
            top: -1.25em;
            left: 0;
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            padding: 0 3px; /* Vertical padding removed to ensure exactly 1.25em height fits the text */
            line-height: 1.25em; /* Ensure line height matches the cutoff */
            pointer-events: none;
            color: red; 
        }
        
        /* Toggle-Klasse für die Begrenzung auf eine Zeile */
        body.labels-collapsed .sprite-label {
            height: 1.25em;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-white">

    <div class="container-fluid py-4">
        <h1 class="mb-4 text-center">QATT Sprites Overview</h1>
        <div class="row flex-nowrap overflow-x-auto g-0" id="main-row"></div>
        
        <!-- Toggle Button -->
        <div class="text-center mt-5 mb-3">
            <button id="toggleHeightBtn" class="btn btn-outline-secondary">
                Toggle Single Line Labels
            </button>
        </div>
    </div>

    <div class="modal fade" id="editLabelModal" tabindex="-1" aria-labelledby="editLabelModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editLabelModalLabel">Edit Label</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="labelInput" class="form-control" placeholder="New label (empty = remove)">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveLabelBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const names = "z l ng h g c tr d t n th nh ch dz x kh s r m b v ph".split(" ");
        const row = document.getElementById('main-row');

        let editModal = null;
        let currentLabelElement = null;
        let currentStorageKey = null;

        const labelInput = document.getElementById('labelInput');
        const saveLabelBtn = document.getElementById('saveLabelBtn');
        const toggleHeightBtn = document.getElementById('toggleHeightBtn');

        // Event-Listener für den Toggle-Button
        toggleHeightBtn.addEventListener('click', () => {
            document.body.classList.toggle('labels-collapsed');
        });

        function formatLabelText(text) {
            if (text === "") return "";
            if (text.includes(";")) {
                return text.replace(/;/g, "<br>");
            }
            // Reduziert auf 1 <br>
            return "<br>" + text;
        }

        function updateLabelColor(labelElement, text) {
            const lowerText = text.toLowerCase();
            if (lowerText.endsWith('ng') || lowerText.endsWith('nh')) {
                labelElement.style.color = 'green';
            } else if (lowerText.endsWith('n')) {
                labelElement.style.color = 'blue';
            } else if (lowerText.endsWith('m')) {
                labelElement.style.color = 'purple';
            } else {
                labelElement.style.color = 'red';
            }
            
            if (text === "") {
                labelElement.style.background = "transparent";
            } else {
                labelElement.style.background = "rgba(255, 255, 255, 0.5)"; 
            }
        }

        function saveLabel() {
            if (currentLabelElement && currentStorageKey) {
                const newText = labelInput.value.trim();
                
                currentLabelElement.dataset.rawText = newText;
                currentLabelElement.innerHTML = formatLabelText(newText);
                
                updateLabelColor(currentLabelElement, newText);
                localStorage.setItem(currentStorageKey, newText);
                
                const spriteElement = currentLabelElement.parentElement;
                if (newText === "") {
                    spriteElement.classList.add('opacity-50');
                } else {
                    spriteElement.classList.remove('opacity-50');
                }
                
                editModal.hide();
            }
        }

        saveLabelBtn.addEventListener('click', saveLabel);
        labelInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveLabel();
        });

        names.forEach((name, index) => {
            const col = document.createElement('div');
            col.className = 'col-auto d-flex flex-column align-items-center me-1';
            
            if (index % 2 === 1) {
                col.classList.add('border-end', 'border-2', 'pe-2');
            }
            
            const title = document.createElement('h3');
            title.textContent = name;
            title.className = 'text-center my-3 w-100 fixed-title-height';
            col.appendChild(title);

            const spriteBox = document.createElement('div');
            spriteBox.className = 'd-flex flex-column justify-content-between align-items-center flex-grow-1 p-2';
            col.appendChild(spriteBox);
            row.appendChild(col);

            const imageUrl = `https://qatt.org/qatt/img/qatt/${name}.jpg`;
            const img = new Image();
            img.src = imageUrl;

            img.onload = () => {
                for (let i = 0; i < 5; i++) {
                    const sprite = document.createElement('div');
                    sprite.className = 'sprite-wrapper border rounded shadow-sm mb-4';
                    sprite.style.backgroundImage = `url(${imageUrl})`;
                    sprite.style.backgroundSize = '100% 500%';
                    sprite.style.backgroundPosition = `0% ${i * 25}%`;

                    const label = document.createElement('span');
                    label.className = 'sprite-label';
                    
                    const storageKey = `qatt_sprite_${name}_${i}`;
                    const savedLabel = localStorage.getItem(storageKey) || "";
                    
                    label.dataset.rawText = savedLabel;
                    label.innerHTML = formatLabelText(savedLabel);
                    updateLabelColor(label, savedLabel);
                    
                    sprite.appendChild(label);

                    if (savedLabel === "") {
                        sprite.classList.add('opacity-50');
                    }

                    sprite.addEventListener('click', () => {
                        if (!editModal) {
                            editModal = new bootstrap.Modal(document.getElementById('editLabelModal'));
                        }
                        currentLabelElement = label;
                        currentStorageKey = storageKey;
                        labelInput.value = label.dataset.rawText;
                        
                        editModal.show();
                        
                        document.getElementById('editLabelModal').addEventListener('shown.bs.modal', () => {
                            labelInput.focus();
                            labelInput.select();
                        }, { once: true });
                    });

                    spriteBox.appendChild(sprite);
                }
            };
        });
    </script>
</body>
</html>

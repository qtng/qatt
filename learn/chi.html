<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marking strokes · Learn QATT</title>
  <meta name="description" content="Learn QATT: every base shape of Quốc Âm Tân Tự with its marking strokes 1 to 6, in a grid of 3 × 3.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/learn.css">
  <script src="/js/navigation.js"></script>
  <script src="/js/parser.js"></script>
  <script src="/js/qatt-text.js"></script>
  <script src="/js/learn.js"></script>
  <style>
    /* the picker of the 22 base shapes: two groups, a line between them */
    .chi-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.6rem, 1fr)); gap: .3rem; padding: .3rem; border-radius: 1.1rem; background: color-mix(in srgb, currentColor 6%, transparent); color: var(--ink); }
    .chi-pick + .chi-pick { margin-top: .6rem; }
    .chi-pick button { display: flex; flex-direction: column; align-items: center; gap: .05rem; padding: .35rem .2rem .3rem; border: 0; border-radius: .85rem; background: none; color: inherit; transition: background-color .3s, color .3s; min-width: 0; }
    .chi-pick button:hover { color: var(--cinnabar); }
    .chi-pick button.active { background: var(--cinnabar); color: #fff; box-shadow: 0 .35rem 1rem color-mix(in srgb, var(--cinnabar) 40%, transparent); }
    .chi-pick .g { font-family: var(--qfont), sans-serif; font-size: 1.9rem; line-height: 1.1; }
    .chi-pick .n { font-size: .72rem; letter-spacing: .04em; opacity: .85; }

    /* the grid: 3 x 3, the chosen shape in the middle */
    .chi-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: .5rem; padding: 1rem; color: var(--ink); }
    .chi-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; border-radius: 1rem; min-width: 0; }
    .chi-cell.on { background: color-mix(in srgb, currentColor 5%, transparent); }
    .chi-cell .g { font-family: var(--qfont), sans-serif; font-size: clamp(2.2rem, 11vw, 3.6rem); line-height: 1; }
    .chi-cell.soft .g { opacity: .5; }                                  /* the marks 1 and 2 */
    .chi-cell.mid { background: color-mix(in srgb, var(--cinnabar) 10%, transparent); border: 1px solid color-mix(in srgb, var(--cinnabar) 35%, transparent); }
    .chi-cell.mid .g { font-size: clamp(3rem, 15vw, 5rem); color: var(--cinnabar); }
    .chi-cell .r { font-family: Georgia, "Times New Roman", serif; font-size: clamp(.85rem, 3.4vw, 1.15rem); line-height: 1.1; }
    .chi-cell .m { font-size: .68rem; letter-spacing: .04em; color: var(--bs-secondary-color); }
  </style>
</head>
<body>
<header class="hero pt-5 pb-4">
  <div class="container text-center">
    <div class="kicker mb-2" data-vi="Học QATT">Learn QATT</div>
    <h1 class="mb-3" data-vi="Nét đánh dấu">Marking strokes</h1>
    <p class="lead mx-auto mb-0" data-vi="Chọn một hình cơ bản để xem các nét đánh dấu của nó.">Choose a base shape to see its marking strokes.</p>
  </div>
</header>

<main class="container py-4" id="content">
  <div class="learn mx-auto">
    <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
      <select data-qatt-fonts data-qatt-default="QATT Pen" class="form-select form-select-sm w-auto" aria-label="Font"></select>
    </div>
    <div id="pick1" class="chi-pick" role="tablist"></div>
    <div id="pick2" class="chi-pick" role="tablist"></div>
    <div class="card-box mt-3"><div id="grid" class="chi-grid" aria-live="polite"></div></div>
    <p class="hint text-center mt-3 mb-0"><span data-vi="Các nét 1 và 2 được làm mờ; các nét khác ghi cách đọc: phụ âm đầu là hình đã chọn, vần là hình có nét đánh dấu.">Strokes 1 and 2 are dimmed; the others show their reading: the initial is the chosen shape, the rhyme the shape with the marking stroke.</span></p>
  </div>
</main>

<script>
// The marks of every shape, six digits in the order of the cells (a "b" after a digit: the same stroke, a variant). Group 1: the six cells are
// top left, top middle, top right, bottom left, bottom middle, bottom right; group 2: left top, left middle, left bottom, right top, right middle, right bottom.
// A shape is written as in Quốc Ngữ (đ is the shape d, d is the shape dz, ʔ the shape z, see Learn.SHAPES).
const GROUPS = [
  { cells: [0, 1, 2, 6, 7, 8], shapes: { l: '216345', g: '165234', c: '165234', tr: '126345', d: '216435', ch: '216345', dz: '216345', s: '165234', r: '165245', v: '165234', ph: '165234' } },
  { cells: [0, 3, 6, 2, 5, 8], shapes: { ng: '123654', h: '123654', n: '132654', t: '123645', th: '123654', nh: '123b654', x: '123654', kh: '123654', m: '123654', b: '123654', z: '123654' } },
];
// syllables that do not occur in standard Vietnamese (as in rhymes.html): the glyph stays, the reading is a dash
const ABSENT = new Set(['hoam', 'nhoăm', 'chêng', 'duêng', 'duêm', 'xơng', 'khuơng', 'khuyêng', 'sing', 'ruyng', 'ruym']);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const parser = Learn.parser;
let current = 'l';

function draw() {
  const group = GROUPS.find(g => g.shapes[current]);
  const marks = group.shapes[current].match(/\db?/g).map(m => ({ n: +m[0], b: /b/.test(m) }));
  const grid = document.getElementById('grid');
  const cells = Array.from({ length: 9 }, () => el('div', 'chi-cell'));
  const mid = cells[4];
  mid.classList.add('mid', 'on');
  mid.append(el('span', 'g', Learn.glyph(current, 0)), el('span', 'r', Learn.consonant(current).show));
  marks.forEach((mk, i) => {
    const c = cells[group.cells[i]];
    c.classList.add('on');
    c.append(el('span', 'g', Learn.glyph(current, mk.n)));
    if (mk.n <= 2) { c.classList.add('soft'); return; }
    const r = QattText.reading(Learn.glyph(current, mk.n), parser);
    c.append(el('span', 'r', ABSENT.has(r) || r === '?' ? '—' : r));
  });
  grid.replaceChildren(...cells);
  document.querySelectorAll('.chi-pick button').forEach(b => { const on = b.dataset.shape === current; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
}

GROUPS.forEach((group, i) => {
  const box = document.getElementById('pick' + (i + 1));
  Object.keys(group.shapes).forEach(s => {
    const b = el('button'); b.type = 'button'; b.dataset.shape = s; b.setAttribute('role', 'tab');
    b.append(el('span', 'g', Learn.glyph(s, 0)), el('span', 'n', Learn.consonant(s).show));
    b.addEventListener('click', () => { current = s; draw(); });
    box.append(b);
  });
});
draw();
</script>
</body>
</html>

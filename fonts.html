<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QATT fonts</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <style>
    :root { --accent: #a8362a; --paper: #f7efdc; --card: #fffdf8; }
    * { box-sizing: border-box; }
    .hero { background: radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%), linear-gradient(180deg, var(--paper) 0%, var(--card) 100%); border-bottom: 1px solid #e8dcc0; }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; margin: 0; }
    .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; }
    @media (max-width: 575.98px) { .hero .han { letter-spacing: .3em; } }

    .wrap { max-width: 64rem; margin: 0 auto; padding: 1.6rem 1rem 3rem; }
    /* everything in one white card; on a phone from edge to edge */
    .sheet { background: #fff; color: #2b2118; border-radius: .9rem; box-shadow: 0 1px 3px rgba(43, 33, 24, .12); padding: 0 1.6rem; }
    @media (max-width: 767.98px) { .wrap { padding-top: 0; } .sheet { margin: 0 -1rem; border-radius: 0; box-shadow: none; padding: 0 1rem; } }   /* on a phone from edge to edge, right below the header */
    .muted { opacity: .62; }

    /* the text of all samples */
    .bar { padding: 1.6rem 0 .6rem; }
    .bar { display: flex; align-items: center; gap: 1rem; }
    .bar .text { flex: 1 1 auto; display: flex; align-items: center; gap: .7rem; margin: 0; font-size: .85rem; min-width: 0; }
    .bar .text input { flex: 1 1 auto; min-width: 0; }
    .bar .text span { white-space: nowrap; }
    .telex { display: flex; align-items: center; gap: .45rem; margin: 0; padding: 0; min-height: 0; font-size: .85rem; white-space: nowrap; }   /* typing Vietnamese on a keyboard without a Vietnamese layout */
    .telex .form-check-input { float: none; margin: 0; }
    .telex .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }

    /* one entry per font: the samples on the left, the facts on the right */
    .font { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: .4rem 2.5rem; padding: 2.2rem 0; border-top: 1px solid rgba(127, 127, 127, .25); }
    .font:first-child { border-top: 0; }
    .font h2 { grid-column: 1 / -1; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.35rem; margin: 0 0 .4rem; }
    .samples { min-width: 0; display: grid; gap: .3rem; align-content: start; overflow-x: auto; padding-bottom: .4rem; }   /* the lines are not cut: the block scrolls sideways */
    .line { display: flex; align-items: baseline; gap: .8rem; width: max-content; }
    .line .px { flex: 0 0 2.2rem; font-size: .7rem; text-align: right; font-variant-numeric: tabular-nums; }
    .line .q { white-space: nowrap; line-height: 1.5; }   /* room for the tone marks above and below */
    .info { font-size: .82rem; line-height: 1.45; }
    .info p { margin: 0 0 .7rem; }
    .info dl { display: grid; grid-template-columns: auto 1fr; gap: .15rem .8rem; margin: 0 0 1rem; }
    .info dt { font-weight: 400; opacity: .62; }
    .info dd { margin: 0; }
    .tabs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem; margin: 0 0 .5rem; }
    .tab { background: none; border: 1px solid rgba(127, 127, 127, .35); border-radius: 2rem; padding: .15rem .8rem; font-size: .8rem; color: inherit; text-transform: capitalize; }
    .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .samples-wrap { min-width: 0; }
    [hidden] { display: none !important; }

    /* overview: one card per font name (the weights together), "Quốc Âm Tân Tự" in four cells; the glyphs fill the width of the card */
    .overview { padding: .8rem 0 1.6rem; margin-bottom: 0; border-bottom: 1px solid rgba(127, 127, 127, .25); }
    .overview .col { container-type: inline-size; }
    .overview a.card-font { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqw; width: 100cqw; aspect-ratio: 1; padding: 10cqw 8cqw 8cqw; overflow: hidden; border: 1px solid rgba(127, 127, 127, .3); border-radius: 20cqw; box-shadow: 0 .35em .9em rgba(0, 0, 0, .25); text-decoration: none; }
    .overview a.card-font:hover { box-shadow: 0 .45em 1.1em rgba(0, 0, 0, .35); }
    .overview .name { font-family: Georgia, "Times New Roman", serif; font-size: 8.5cqw; line-height: 1.1; color: #2b2118; white-space: nowrap; text-align: center; }
    .overview .quad { container-type: inline-size; width: 96%; color: #2b2118; }
    .overview .quad > div { display: grid; grid-template-columns: repeat(2, 46cqw); justify-content: center; }   /* four equal squares: even gaps in both directions */
    .overview .quad span { height: 38cqw; display: flex; align-items: center; justify-content: center; font-size: 34cqw; line-height: 1; white-space: nowrap; }
    @media (max-width: 767.98px) { .font { grid-template-columns: minmax(0, 1fr); } }
    .note { margin: 1.2rem 0 0; font-size: .8rem; opacity: .7; text-align: center; }
  </style>
  <script src="js/navigation.js"></script>
  <script defer src="https://chunom.org/chunom/js/ime.js"></script>
</head>
<body>
<header class="hero pt-5 pb-4">
  <div class="container text-center">
    <div class="han mb-2">國音新字</div>
    <h1 class="mb-3" data-vi="Phông chữ QATT">QATT fonts</h1>
    <p class="lead mx-auto mb-4" data-vi="Tất cả phông chữ của khối QATT, mỗi phông từ cỡ nhỏ đến cỡ lớn. Hãy gõ văn bản của bạn bằng chữ Quốc Ngữ.">All fonts of the QATT block, each from small to large. Type your own text in Quốc Ngữ.</p>
    <a class="btn btn-outline-secondary btn-pill" href="editor.html" data-vi="Gõ chữ">Type it</a>
  </div>
</header>

<main class="wrap">
  <div class="sheet">
  <div class="bar">
    <label class="text"><span class="muted" data-vi="Văn bản">Text</span><input type="text" id="text" class="form-control" value="" placeholder="Your own text in Quốc Ngữ" data-vi-placeholder="Văn bản của bạn bằng chữ Quốc Ngữ" autocomplete="off" spellcheck="false" aria-label="Text in Quốc Ngữ" data-vi-aria-label="Văn bản bằng chữ Quốc Ngữ"></label>
    <div class="telex form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="telex" autocomplete="off" checked><label class="form-check-label" for="telex">Telex</label></div>
  </div>
  <div class="overview row row-cols-2 row-cols-md-4 g-3 align-items-stretch justify-content-center" id="overview"></div>
  <div id="fonts"></div>
  </div>
  <p class="note"><span data-vi="© 2026 qatt.org. Bảo lưu mọi quyền. Phông chữ được dùng để đọc, viết và in văn bản QATT, không được sửa đổi hay dùng làm nền cho phông chữ khác.">© 2026 qatt.org. All rights reserved. The fonts may be used to read, write and print QATT text, not modified or used as the basis of other fonts.</span> <a href="font-license.html" data-vi="Giấy phép">Licence</a></p>
</main>

<script src="js/parser.js"></script>
<script src="js/qatt-text.js"></script>
<script src="js/fonts.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const parser = new VietnameseParser();
  const FONTS = QATT_FONTS.filter(f => !f.admin || isAdmin());   // the blocks come from fonts.js: a visitor sees the fonts that the font lists offer, an admin all (fonts.js defines the @font-face rules of exactly these)
  const SAMPLE = 'Trăm năm trong cõi người ta, chữ tài chữ mệnh khéo là ghét nhau. Trải qua một cuộc bể dâu, những điều trông thấy mà đau đớn lòng. Lạ gì bỉ sắc tư phong, trời xanh quen thói má hồng đánh ghen.';   // Truyện Kiều, lines 1 to 6
  const SIZES = [24, 28, 32, 36, 42, 48, 56, 72, 96];   // from small to large
  const ABOUT = [   // the first entry whose name starts the family: English, Vietnamese (drafts by Claude)
    ["QATT Serif", "Thin horizontals, heavy verticals, small triangles at the ends.", "Nét ngang mảnh, nét dọc đậm, có tam giác nhỏ ở cuối nét."],
    ["QATT Gothic Wide", "The Gothic font; a joined pair takes 1.25 cells, so its halves are less squeezed.", "Phông Gothic; một cặp ghép chiếm 1,25 ô nên hai nửa ít bị ép hơn."],
    ["QATT Gothic", "Strokes of one width.", "Nét đều, cùng một độ dày."],
    ["QATT Pen Cut", "The Pen strokes with flat ends cut at a slant, as in Song: thin horizontals, heavy verticals.", "Nét của phông Pen với đầu nét cắt phẳng và vát, như kiểu chữ Tống: nét ngang mảnh, nét dọc đậm."],
    ["QATT Pen", "Strokes of a felt-tip pen: round ends, slightly bowed horizontals, a hint of clerical script.", "Nét bút dạ: đầu nét tròn, nét ngang hơi cong, thoáng dáng chữ Lệ."],
    ["QATT Khai", "Brush strokes of regular script (Kaiti) after model characters; a draft, the dots are not done yet.", "Nét bút lông kiểu chữ Khải theo các chữ mẫu; bản nháp, các nét chấm chưa xong."],
    ["QATT Prototype Light", "The strokes of qatt.js, thinner.", "Nét của qatt.js, mảnh hơn."],
    ["QATT Brush", "Brush strokes made with the brush editor.", "Nét bút lông, vẽ bằng trình chỉnh sửa nét bút lông."],
  ];
  const about = family => ABOUT.find(([name]) => family.startsWith(name)) || [, '', ''];
  const el = (tag, cls, text, vi) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (vi) e.dataset.vi = vi; return e; };   // data-vi: Lang (navigation.js) shows the Vietnamese text

  // one entry per family: the fonts that start with the same word after "QATT" (Pen, Pen Cut and the weights; Khai and Khai v2; Gothic and Gothic Wide) share an entry: their samples are tabs named by the rest of the font name
  const firstWord = f => f.family.replace(/^QATT /, '').split(' ')[0];
  const groupOf = f => FONTS.filter(x => firstWord(x) === firstWord(f)).length > 1 ? 'QATT ' + firstWord(f) : undefined;   // a font alone has no tabs
  const tabName = (f, g) => { const rest = f.family.slice(g.length).trim(); return rest ? rest.replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase() : 'normal'; };   // ExtraLight -> extra light, Cut ExtraLight -> cut extra light, nothing -> normal
  const list = $('#fonts'), samples = [], entries = [];
  for (const f of FONTS) {
    const g = groupOf(f);
    let entry = g && entries.find(e => e.g === g);
    if (!entry) {
      entry = { g, tabs: [], box: el('article', 'font'), family: f.family };
      entry.box.id = 'font-' + (g || f.family).toLowerCase().replace(/[^a-z0-9]+/g, '-');
      entry.title = el('h2', '', g ? g.replace(/^QATT /, '') : f.label);
      entry.box.append(entry.title);
      if (g) { entry.bar = el('div', 'tabs'); entry.bar.setAttribute('role', 'tablist'); entry.box.append(entry.bar); }
      entry.left = el('div', 'samples-wrap'); entry.info = el('div', 'info');
      entry.box.append(entry.left, entry.info);
      entries.push(entry); list.append(entry.box);
    }
    const left = el('div', 'samples');
    for (const px of SIZES) {
      const line = el('div', 'line'), q = el('div', 'q');
      q.style.cssText = `font-family: "${f.family}"; font-size: ${px}px`;
      line.append(el('span', 'px muted', px), q);
      left.append(line); samples.push(q);
    }
    const info = el('div', 'info-tab');
    const [, en, vi] = about(f.family);
    info.append(el('p', '', en, vi));
    const dl = el('dl');
    const fact = (k, vi, v) => dl.append(el('dt', '', k, vi), el('dd', '', v));
    fact('Family', 'Họ phông', f.family);
    fact('Characters', 'Số ký tự', '164');
    const dd = el('dd'), lic = el('a', '', 'Licence', 'Giấy phép'); lic.href = 'font-license.html';
    dd.append('© 2026 Qatt.org,', document.createElement('br'), el('span', '', 'All rights reserved.', 'Bảo lưu mọi quyền.'), document.createElement('br'), lic);
    dl.append(el('dt', '', 'Copyright', 'Bản quyền'), dd);
    info.append(dl);
    const tab = { f, left, info };
    entry.tabs.push(tab);
    entry.left.append(left); entry.info.append(info);
    if (entry.bar) {
      tab.button = el('button', 'tab', tabName(f, g)); tab.button.type = 'button'; tab.button.setAttribute('role', 'tab');
      tab.button.addEventListener('click', () => show(entry, tab));
      entry.bar.append(tab.button);
    }
  }
  function show(entry, tab) {
    for (const t of entry.tabs) { const on = t === tab; t.left.hidden = t.info.hidden = !on; if (t.button) t.button.setAttribute('aria-selected', on); }
  }
  for (const entry of entries) show(entry, entry.tabs.find(t => !entry.g || t.f.family === entry.g) || entry.tabs[0]);   // the normal weight first

  // the overview cards: the name without weight, then Quốc âm tân tự as 2 x 2 cells
  const ovCells = [], overview = $('#overview');
  for (const entry of entries) {
    if (/^QATT (Prototype|Brush)/.test(entry.tabs[0].f.family)) continue;   // no card for these
    const col = el('div', 'col'), a = el('a', 'card-font'), quad = el('div', 'quad'), grid = el('div');
    a.href = '#' + entry.box.id;
    const base = entry.tabs[0];   // the first font of the stack
    entry.family = base.f.family;
    a.append(el('div', 'name', entry.title.textContent));
    for (let i = 0; i < 4; i++) { const c = el('span'); c.style.fontFamily = `"${entry.family}"`; ovCells.push(c); grid.append(c); }
    quad.append(grid); a.append(quad); col.append(a); overview.append(col);
  }
  ovCells.forEach((c, i) => { c.textContent = QattText.convert(['Quốc', 'Âm', 'Tân', 'Tự'][i % 4], parser).trim(); });

  const render = () => {
    const qatt = QattText.convert($('#text').value.trim() || SAMPLE, parser);   // the sample text until something is typed
    for (const q of samples) q.textContent = qatt;
  };
  $('#text').addEventListener('input', render);
  render();
  // Telex (VietIme of the Chunom site, loaded with defer: ready at DOMContentLoaded); without it the switch is hidden
  addEventListener('DOMContentLoaded', () => {
    const telex = $('#telex'), ime = window.VietIme ? new VietIme($('#text'), { telex: telex.checked, candidates: false }) : null;
    if (!ime) { telex.closest('.telex').hidden = true; return; }
    telex.addEventListener('change', () => { ime.update({ telex: telex.checked }); $('#text').focus(); });
  });
})();
</script>
</body>
</html>

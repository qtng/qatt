<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QATT Symbols</title>
  <meta name="description" content="The 22 base shapes of Quốc Âm Tân Tự, their five marked forms and the eight tone marks, with the readings of the chosen decoding.">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/navigation.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/qatt-text.js"></script>
  <script defer src="js/fonts.js"></script>
  <style>
    :root { --qfont: "QATT Gothic Bold"; --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; }
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .hero .han { color: var(--cinnabar); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    .glyph-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.2rem, 1fr)); gap: .6rem .4rem; max-width: 50rem; margin-inline: auto; text-align: center; color: var(--ink); }
    @media (min-width: 768px) { .glyph-strip { grid-template-columns: repeat(11, 1fr); } }
    .glyph-strip.tones { grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); max-width: 46rem; }
    .glyph-strip .item { display: flex; flex-direction: column; align-items: center; }
    .glyph-strip .g { font-family: var(--qfont), sans-serif; font-size: 2.4rem; line-height: 1.15; opacity: .85; transition: opacity .15s, color .15s; }
    .glyph-strip .g:hover { opacity: 1; color: var(--cinnabar); }
    .glyph-strip .lab { font-size: .85rem; color: #6a5a48; line-height: 1.2; }
    .choose { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin: 1.2rem 0 2.2rem; }
    .tone-box { display: inline-block; padding: .4rem .6rem; margin-bottom: .5rem; border: 1px solid #e4d9c0; border-radius: .6rem; background: #fffdf8; line-height: 1; }
    .tone-box .g { display: block; line-height: 1; }
    .rule { display: flex; align-items: center; gap: 1rem; max-width: 46rem; margin: 0 auto 1.4rem; color: #a8977e; font-size: .8rem; letter-spacing: .25em; text-transform: uppercase; }
    .rule::before, .rule::after { content: ""; flex: 1; border-top: 1px solid #dccfb2; }
    section.set { padding-block: 1.6rem; }
    h2.tones-h { font-family: Georgia, "Times New Roman", serif; font-weight: 400; text-align: center; margin: 1rem 0 1.6rem; }
    @media (max-width: 575.98px) { .glyph-strip .g { font-size: 2rem; } .glyph-strip .g[data-code] { width: 3.2rem; height: 3.2rem; } .hero .han { letter-spacing: .3em; } }
    /* every character of the overview is a round button with a faint outline */
    .glyph-strip .g[data-code] { display: flex; align-items: center; justify-content: center; width: 3.8rem; height: 3.8rem; border: 1px solid var(--bc); border-radius: 50%; background: var(--b); cursor: pointer; transition: opacity .15s, color .15s, border-color .15s, box-shadow .15s; }
    .glyph-strip .g[data-code]:hover, .glyph-strip .g[data-code]:focus-visible { border-color: var(--bc); box-shadow: 0 .15rem .5rem rgba(60, 40, 20, .14); outline: none; }
    .glyph-strip .g[data-code]:active { box-shadow: none; filter: brightness(.96); }
    .glyph-strip { --b: #e3eef8; --bc: #b7cde2; }   /* the colours of the buttons in check.html: light blue for the marked forms, beige for the shapes */
    section.set:first-of-type .glyph-strip { --b: #fff8e6; --bc: #dccb9f; }
    .glyph-strip .item { gap: .25rem; }
    .glyph-strip .item.muted { opacity: .4; }
    dialog#variants { border: 1px solid #cdbf9f; border-radius: .7rem; background: #fffdf8; color: var(--ink); padding: .8rem 1rem 1rem; max-width: min(34rem, 94vw); box-shadow: 0 .6rem 2rem rgba(60, 40, 20, .3); }
    dialog#variants:focus { outline: none; }
    dialog#variants::backdrop { background: rgba(43, 33, 24, .35); }
    #variants .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; font-size: .85rem; color: #7b6c58; }
    #variants .head .tools { display: flex; align-items: center; gap: .4rem; }
    #variants .speak { border: 1px solid #e4d9c0; border-radius: 50%; width: 2rem; height: 2rem; background: #fff; color: #5b4d3d; line-height: 1; }
    #variants .speak:hover { background: #f1e8d2; }
    #variants .speak.on { color: var(--cinnabar); border-color: var(--cinnabar); }
    #variants .vars { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; }   /* 3 characters per row */
    #variants .var { min-width: 4.2rem; text-align: center; padding: .25rem .4rem; border: 1px solid #e4d9c0; border-radius: .5rem; }
    #variants .var .g { display: block; font-family: var(--qfont), sans-serif; font-size: 2.6rem; line-height: 1.2; }
    #variants .var .r { display: block; font-size: .9rem; }
    #variants .var.muted { opacity: .4; }
    #variants .var.hit { border-color: var(--cinnabar); background: #f6e3de; box-shadow: 0 0 0 2px rgba(168, 54, 42, .35); }
  </style>
</head>

      <div class="item"><span class="g" data-code="m6,,,0"></span><span class="lab" data-rhyme="m6"></span></div>
      <div class="item"><span class="g" data-code="b6,,,0"></span><span class="lab" data-rhyme="b6"></span></div>
      <div class="item"><span class="g" data-code="v6,,,0"></span><span class="lab" data-rhyme="v6"></span></div>
      <div class="item"><span class="g" data-code="ph6,,,0"></span><span class="lab" data-rhyme="ph6"></span></div>
    </div>
  </section>
  <h2 class="tones-h h1">Tones</h2>
  <section class="set">
    <div class="glyph-strip tones" aria-label="Tones">
      <div class="item"><span class="tone-box"><span class="g">󰂠</span></span><span class="lab">sắc</span></div>
      <div class="item"><span class="tone-box"><span class="g">󰂝</span></span><span class="lab">huyền</span></div>
      <div class="item"><span class="tone-box"><span class="g">󰂞</span></span><span class="lab">hỏi</span></div>
      <div class="item"><span class="tone-box"><span class="g">󰂟</span></span><span class="lab">ngã</span></div>
      <div class="item"><span class="tone-box"><span class="g">󰂡</span></span><span class="lab">nặng</span></div>
      <div class="item"><span class="tone-box"><span class="g">󰂢</span></span><span class="lab">sắc (nhập)</span></div>
      <div class="item"><span class="tone-box"><span class="g">󰂣</span></span><span class="lab">nặng (nhập)</span></div>
      <div class="item"><span class="tone-box"><span class="g">󰂜</span></span><span class="lab">ngang</span></div>
    </div>
  </section>
</main>

<dialog id="variants" aria-label="Variants" tabindex="-1">
  <div class="head"><span data-vi="Biến thể">Variants</span><button type="button" class="btn-close" id="variantsClose" aria-label="Close" data-vi-aria-label="Đóng"></button></div>
  <div class="vars" id="variantsBody"></div>
  <div class="text-center mt-2"><button type="button" class="speak" id="variantsSpeak" aria-label="Read aloud" data-vi-aria-label="Đọc to" title="Read aloud" data-vi-title="Đọc to"><i class="bi bi-volume-up"></i></button></div>
</dialog>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const parser = new VietnameseParser();
    // the shapes and marked forms are written from their codes, so they follow the code points of qatt-text.js (and the fonts)
    document.querySelectorAll('.g[data-code]').forEach(el => { el.textContent = QattText.syllable(el.dataset.code) || ''; });
    // the readings of the marked forms: how the parser reads the glyph (as a rhyme without onset) after the decoding
    const NO_READING = new Set(['ơng', 'ương', 'êng', 'uêng', 'ing', 'uyng']);   // shown muted, without a reading in the popup
    const label = () => document.querySelectorAll('[data-rhyme]').forEach(el => {
      el.textContent = parser.toQuocNgu({ onset: '_', rhyme: el.dataset.rhyme }) || '';
      el.closest('.item').classList.toggle('muted', NO_READING.has(el.textContent));
    });
    document.getElementById('decoding').addEventListener('change', e => { parser.setDecoding(e.target.value); label(); });
    label();
    // a click on a shape or marked form: the seven characters of its group (U+F0000 + 7 * i, the shape and its six marked forms) in code point order
    const dlg = document.getElementById('variants'), body = document.getElementById('variantsBody');
    document.getElementById('variantsClose').addEventListener('click', () => dlg.close());
    // read all readings of the popup aloud, one after the other (the voice of the browser for Vietnamese)
    const speak = document.getElementById('variantsSpeak');
    const stopSpeaking = () => { speechSynthesis?.cancel(); speak.classList.remove('on'); };
    speak.hidden = !('speechSynthesis' in window);
    speak.addEventListener('click', () => {
      if (speak.classList.contains('on')) return stopSpeaking();
      const u = new SpeechSynthesisUtterance(Array.from(body.querySelectorAll('.r'), r => r.textContent).filter(Boolean).join(', '));
      u.lang = 'vi-VN';
      u.onend = u.onerror = () => speak.classList.remove('on');
      speechSynthesis.cancel();
      speak.classList.add('on');
      speechSynthesis.speak(u);
    });
    dlg.addEventListener('close', stopSpeaking);
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });   // a click outside the box
    document.querySelectorAll('.g[data-code]').forEach(el => { el.setAttribute('role', 'button'); el.tabIndex = 0; el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); } }); });
    document.querySelectorAll('.g[data-code]').forEach(el => el.addEventListener('click', () => {
      const [, shape, mark] = /^(_|[a-z]+?)([1-6]?),/.exec(el.dataset.code), clicked = +mark;
      body.replaceChildren();
      for (let n = 0; n <= 6; n++) {
        if (n === 1) continue;   // the first marked form is left out
        const code = shape + (n || '') + ',,,0';
        // the shape alone is the onset with ông, a marked form is a rhyme after the onset of the group (the shape)
        // these rhymes are shown without a reading
        const lone = n && parser.toQuocNgu({ onset: '_', rhyme: shape + n });
        let read = NO_READING.has(lone) ? '' : parser.toQuocNgu({ onset: shape, rhyme: n ? shape + n : '' });
        if (!n) read = (read || '').toUpperCase();   // the shape alone: everything that rhymes on ÔNG
        const v = Object.assign(document.createElement('div'), { className: 'var' + (n === clicked ? ' hit' : '') + (NO_READING.has(lone) ? ' muted' : '') });
        v.append(Object.assign(document.createElement('span'), { className: 'g', textContent: QattText.syllable(code) || '' }), Object.assign(document.createElement('span'), { className: 'r', textContent: read || '' }));
        body.append(v);
      }
      dlg.showModal();
      dlg.focus();   // not the close button (it would show a focus ring)
    }));
    const font = document.getElementById('font');   // the page starts in Gothic bold
    font.value = 'QATT Gothic Bold';
    font.dispatchEvent(new Event('change'));
  });
</script>
</body>
</html>

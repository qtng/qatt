<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QATT Symbols</title>
  <meta name="description" content="The 22 base shapes of Quốc Âm Tân Tự, their five marked forms and the eight tone marks, with the readings of the qatt.org decoding.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <script src="js/navigation.js"></script>
  <script src="js/qatt.js"></script>
  <script src="js/parser.js"></script>
  <style>
    :root { --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; }
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .hero .han { color: var(--cinnabar); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    .btn-pill { border-radius: 2rem; padding: .5rem 1.3rem; }
    .btn-cinnabar { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
    .btn-cinnabar:hover { background: #8c2c22; border-color: #8c2c22; color: #fff; }
    .glyph-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.2rem, 1fr)); gap: .6rem .4rem; max-width: 50rem; margin-inline: auto; text-align: center; color: var(--ink); }
    @media (min-width: 768px) { .glyph-strip { grid-template-columns: repeat(11, 1fr); } }
    .glyph-strip.tones { grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); max-width: 46rem; }
    .glyph-strip .item { display: flex; flex-direction: column; align-items: center; }
    .glyph-strip tt { font-size: 2.4rem; line-height: 1.15; opacity: .78; transition: opacity .15s, color .15s; }
    .glyph-strip tt:hover { opacity: 1; color: var(--cinnabar); }
    .glyph-strip .lab { font-size: .85rem; color: #6a5a48; line-height: 1.2; }
    .rule { display: flex; align-items: center; gap: 1rem; max-width: 46rem; margin: 0 auto 1.4rem; color: #a8977e; font-size: .8rem; letter-spacing: .25em; text-transform: uppercase; }
    .rule::before, .rule::after { content: ""; flex: 1; border-top: 1px solid #dccfb2; }
    section.set { padding-block: 1.6rem; }
    h2.tones-h { font-family: Georgia, "Times New Roman", serif; font-weight: 400; text-align: center; margin: 1rem 0 1.6rem; }
    @media (max-width: 575.98px) { .glyph-strip tt { font-size: 2rem; } .hero .han { letter-spacing: .3em; } }
  </style>
</head>
<body>
<header class="hero pt-5 pb-4">
  <div class="container text-center">
    <div class="han mb-2">國音新字</div>
    <h1 class="mb-3">QATT Symbols</h1>
    <p class="lead mx-auto mb-4">The pronunciation shown on this page follows the qatt.org decoding.</p>
    <a class="btn btn-cinnabar btn-pill" href="decodings.html">Open the decodings</a>
    <a class="btn btn-outline-secondary btn-pill" href="type.html">Type QATT</a>
  </div>
</header>

<main class="container py-4" id="content"></main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const SHAPES = VietnameseParser.SHAPES, TABLE = VietnameseParser.DECODINGS.qatt;
    const content = document.getElementById('content');

    // one block: a rule with the title and a strip of glyphs, each with a label below
    const block = (title, items, cls) => {
      const sec = document.createElement('section'); sec.className = 'set';
      const rule = document.createElement('div'); rule.className = 'rule'; rule.setAttribute('aria-hidden', 'true'); rule.textContent = title;
      const strip = document.createElement('div'); strip.className = 'glyph-strip ' + (cls || ''); strip.setAttribute('aria-label', title);
      for (const [code, label] of items) {
        const item = document.createElement('div'); item.className = 'item';
        const tt = document.createElement('tt'); tt.textContent = code;
        const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = label;
        item.append(tt, lab); strip.append(item);
      }
      sec.append(rule, strip); content.append(sec);
    };

    const code = s => s === 'z' ? '_' : s;
    block('the 22 base shapes', SHAPES.map(s => [',' + code(s), s === 'z' ? 'ʔ' : s]));
    for (let m = 1; m <= 5; m++)
      block('Chi - Marked ' + m, SHAPES.map((s, i) => [',' + code(s) + (m + 1), TABLE[i][m - 1]]));

    const h = document.createElement('h2'); h.className = 'tones-h h1'; h.textContent = 'Tones'; content.append(h);
    const tones = ['sắc', 'huyền', 'hỏi', 'ngã', 'nặng', 'sắc (nhập)', 'nặng (nhập)', 'ngang'];
    const sec = document.createElement('section'); sec.className = 'set';
    const strip = document.createElement('div'); strip.className = 'glyph-strip tones'; strip.setAttribute('aria-label', 'Tones');
    tones.forEach((name, i) => {
      const item = document.createElement('div'); item.className = 'item';
      const tt = document.createElement('tt'); tt.textContent = ',_,,' + (i + 1);
      const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = name;
      item.append(tt, lab); strip.append(item);
    });
    sec.append(strip); content.append(sec);

    new Qatt().observe('tt');
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiên Calligraphy - Văn Đạo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }
        .bg-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }
        .bg-container img.active {
            opacity: 1;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }
        #meditation-canvas {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
        }
    </style>
</head>
<body class="d-flex flex-column justify-content-between align-items-center vh-100 py-4">

    <!-- Background image container -->
    <div class="bg-container" id="bg-container">
        <img src="img/thien.jpg" class="active" alt="">
        <img src="img/thien2.jpg" alt="">
        <img src="img/thien3.jpg" alt="">
    </div>
    <div class="bg-overlay"></div>

    <!-- App Header -->
    <div class="text-center text-white" id="header-container" style="text-shadow: 0 2px 4px rgba(0,0,0,0.6);">
        <h2 class="fw-light mb-1">Thiên Calligraphy</h2>
        <p class="small mb-0 opacity-75">Quốc Âm Tân Tự</p>
    </div>

    <!-- Main Content Area -->
    <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1 w-100">
        <div class="text-center text-white p-4 rounded" id="intro-screen" style="background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px);">
            <h1 class="fw-light mb-4">Văn Đạo</h1>
            
            <!-- Breathing pattern selector -->
            <div class="mb-3 text-start">
                <label for="pattern-select" class="form-label small text-white-50">Breathing Pattern:</label>
                <select id="pattern-select" class="form-select form-select-sm bg-dark text-white border-secondary">
                    <option value="flow">∿ Flow Breathing (10s)</option>
                    <option value="flow12" selected>∿ Flow Breathing (12s)</option>
                    <option value="triangle">△ Triangle Breathing (12s)</option>
                    <option value="box">□ Box Breathing (14s)</option>
                </select>
            </div>

            <p class="small mb-4 opacity-75">Click start to begin audio playback and practice.</p>
            <button id="start-btn" class="btn btn-light px-4 py-2">Begin Practice</button>
        </div>

        <div class="d-none w-100 px-3 text-center" id="app-container">
            <canvas id="meditation-canvas"></canvas>
            <div class="mt-3">
                <button id="stop-btn" class="btn btn-outline-light btn-sm px-4 py-1 opacity-75">End Meditation</button>
            </div>
        </div>
    </div>

    <script>
        // Audio Engine for breath guidance tones and singing bowl signal
        class AudioEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            stop() {
                if (this.ctx && this.ctx.state === 'running') {
                    this.ctx.suspend();
                }
            }

            playTone(frequency, duration) {
                if (!this.ctx || this.ctx.state !== 'running') return;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(frequency, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.12, this.ctx.currentTime + 1.5);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playBell() {
                if (!this.ctx || this.ctx.state !== 'running') return;

                const now = this.ctx.currentTime;
                const baseFreq = 2093.00; // C7

                const harmonics = [1, 2.76, 5.4];
                const gains = [0.012, 0.003, 0.001]; 
                const decays = [6.0, 4.0, 2.5]; 

                harmonics.forEach((ratio, index) => {
                    const osc = this.ctx.createOscillator();
                    const gainNode = this.ctx.createGain();

                    osc.type = index === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(baseFreq * ratio, now);

                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(gains[index], now + 0.04);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + decays[index]);

                    osc.connect(gainNode);
                    gainNode.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + decays[index]);
                });
            }

            playInhale(durationSeconds = 3) {
                this.playTone(329.63, durationSeconds); 
            }

            playExhale(durationSeconds = 4) {
                this.playTone(220.00, durationSeconds); 
            }
        }

        // Main Zen Meditation Canvas Application
        class ZenMeditationCanvas {
            constructor(config) {
                this.imageFiles = config.imageFiles;
                this.baseUrl = 'https://qatt.org/qatt/img/can/';
                
                this.currentPatternKey = 'flow12';
                this.setPattern(this.currentPatternKey);

                this.images = {};
                this.imageFiles.forEach(filename => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = `${this.baseUrl}${filename}.jpg`;
                    this.images[filename] = img;
                });

                this.currentImgFile = this.imageFiles[0];
                this.startTime = null;
                this.currentPhaseGlobal = -1;
                this.lastCycleIndex = -1;
                this.isRunning = false;
                this.animFrameId = null;
                this.lastBellTriggerCycle = -1;

                this.ui = {
                    canvas: document.getElementById('meditation-canvas'),
                    container: document.getElementById('app-container'),
                    intro: document.getElementById('intro-screen'),
                    startBtn: document.getElementById('start-btn'),
                    stopBtn: document.getElementById('stop-btn'),
                    patternSelect: document.getElementById('pattern-select'),
                    bgImages: document.querySelectorAll('#bg-container img')
                };

                this.ui.patternSelect.value = this.currentPatternKey;

                this.ctx = this.ui.canvas.getContext('2d');
                this.audio = new AudioEngine();

                this.state = {
                    x: 0,
                    y: 0,
                    opacity: 0,
                    phaseText: '',
                    writeNowActive: false,
                    textOpacity: 0,
                    writeNowOpacity: 0,
                    scaleFactor: 1.0,
                    colorProgress: 1.0
                };

                this.setupCanvas();
                this.bindEvents();
                this.setRandomBackground();
                this.setRandomImage();
            }

            setPattern(patternKey) {
                this.currentPatternKey = patternKey;
                if (patternKey === 'triangle') {
                    // Triangle Breathing: 3.5 - 0.5 - 4.0 - 4.0 (Total 12s)
                    this.phases = [3500, 500, 4000, 4000];
                    this.phaseStarts = [0, 3500, 4000, 8000];
                    this.duration = 12000;
                } else if (patternKey === 'flow12') {
                    // Flow Breathing: 5.5 - 0.5 - 5.5 - 0.5 (Total 12s)
                    this.phases = [5500, 500, 5500, 500];
                    this.phaseStarts = [0, 5500, 6000, 11500];
                    this.duration = 12000;
                } else if (patternKey === 'box') {
                    // Box Breathing: 3.5 - 3.5 - 3.5 - 3.5 (Total 14s)
                    this.phases = [3500, 3500, 3500, 3500];
                    this.phaseStarts = [0, 3500, 7000, 10500];
                    this.duration = 14000;
                } else {
                    // Flow Breathing: 4.5 - 0.5 - 4.5 - 0.5 (Total 10s)
                    this.phases = [4500, 500, 4500, 500];
                    this.phaseStarts = [0, 4500, 5000, 9500];
                    this.duration = 10000;
                }
            }

            setupCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const size = 600; 
                this.ui.canvas.width = size * dpr;
                this.ui.canvas.height = size * dpr;
                this.ctx.scale(dpr, dpr);
                
                this.center = size / 2;
                this.baseRadius = (size / 2) - 100;
            }

            bindEvents() {
                this.ui.startBtn.addEventListener('click', () => {
                    const selectedPattern = this.ui.patternSelect.value;
                    this.setPattern(selectedPattern);
                    this.start();
                });
                this.ui.stopBtn.addEventListener('click', () => this.stop());
            }

            setRandomBackground() {
                const images = this.ui.bgImages;
                if (!images || images.length === 0) return;
                
                const currentIndex = Array.from(images).findIndex(img => img.classList.contains('active'));
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * images.length);
                } while (nextIndex === currentIndex && images.length > 1);

                images.forEach((img, idx) => {
                    img.classList.toggle('active', idx === nextIndex);
                });
            }

            setRandomImage() {
                let nextFile;
                do {
                    nextFile = this.imageFiles[Math.floor(Math.random() * this.imageFiles.length)];
                } while (nextFile === this.currentImgFile && this.imageFiles.length > 1);
                
                this.currentImgFile = nextFile;
            }

            start() {
                this.isRunning = true;
                this.audio.init();
                this.ui.intro.classList.add('d-none');
                this.ui.container.classList.remove('d-none');
                
                this.setRandomBackground();
                this.setRandomImage();

                this.startTime = performance.now();
                this.lastBellTriggerCycle = -1;
                this.animFrameId = requestAnimationFrame((timestamp) => this.loop(timestamp));
            }

            stop() {
                this.isRunning = false;
                if (this.animFrameId) {
                    cancelAnimationFrame(this.animFrameId);
                    this.animFrameId = null;
                }
                this.audio.stop();
                this.ui.container.classList.add('d-none');
                this.ui.intro.classList.remove('d-none');
            }

            loop(timestamp) {
                if (!this.isRunning) return;

                const elapsed = Math.max(0, timestamp - this.startTime);
                const totalCycleTime = this.duration * 2; 
                
                const progressInBlock = elapsed % totalCycleTime;
                const isSecondCycle = progressInBlock >= this.duration;
                const t = progressInBlock % this.duration;

                this.updateLogic(t, isSecondCycle, elapsed, totalCycleTime);
                this.draw();

                this.animFrameId = requestAnimationFrame((ts) => this.loop(ts));
            }

            updateLogic(t, isSecondCycle, elapsed, totalCycleTime) {
                let localPhase = 0;
                let phaseTime = 0;
                let currentPhaseLength = this.phases[0];

                for (let i = 3; i >= 0; i--) {
                    if (t >= this.phaseStarts[i]) {
                        localPhase = i;
                        phaseTime = t - this.phaseStarts[i];
                        currentPhaseLength = this.phases[i];
                        break;
                    }
                }

                const cycleIndex = Math.floor(elapsed / totalCycleTime);
                const currentCycleElapsed = elapsed % totalCycleTime;
                let currentTotalPhase = cycleIndex * 8;
                
                let tempT = currentCycleElapsed;
                if (tempT >= this.duration) {
                    currentTotalPhase += 4;
                    tempT -= this.duration;
                }
                for (let i = 3; i >= 0; i--) {
                    if (tempT >= this.phaseStarts[i]) {
                        currentTotalPhase += i;
                        break;
                    }
                }
                const globalPhase = currentTotalPhase;

                const phaseProgress = phaseTime / currentPhaseLength;
                let easeVal = 0;
                
                if (localPhase === 0) {
                    easeVal = (1 - Math.cos(phaseProgress * Math.PI)) / 2;
                    this.state.scaleFactor = 1.0 + (easeVal * 0.05);
                } else if (localPhase === 1) {
                    this.state.scaleFactor = 1.05;
                } else if (localPhase === 2) {
                    easeVal = (1 + Math.cos(phaseProgress * Math.PI)) / 2;
                    this.state.scaleFactor = 1.0 + (easeVal * 0.05);
                } else {
                    this.state.scaleFactor = 1.0;
                }

                let angleRad = Math.PI / 2;
                const currentRadius = this.baseRadius * this.state.scaleFactor;

                if (localPhase === 0) {
                    const progressVal = (1 - Math.cos(phaseProgress * Math.PI)) / 2;
                    angleRad = (Math.PI / 2) + progressVal * Math.PI;
                } else if (localPhase === 1) {
                    angleRad = -Math.PI / 2;
                } else if (localPhase === 2) {
                    const progressVal = (1 - Math.cos(phaseProgress * Math.PI)) / 2;
                    angleRad = (-Math.PI / 2) + progressVal * Math.PI;
                } else {
                    angleRad = Math.PI / 2;
                }

                this.state.x = this.center + currentRadius * Math.cos(angleRad);
                this.state.y = this.center + currentRadius * Math.sin(angleRad);

                if (localPhase === 0) {
                    const p = phaseTime / currentPhaseLength;
                    this.state.colorProgress = 1.0 - ((1 - Math.cos(p * Math.PI)) / 2);
                } else if (localPhase === 1 || localPhase === 2) {
                    this.state.colorProgress = 0.0;
                } else if (localPhase === 3) {
                    const p = phaseTime / currentPhaseLength;
                    this.state.colorProgress = (1 - Math.cos(p * Math.PI)) / 2;
                }

                if (this.currentPhaseGlobal !== globalPhase) {
                    this.currentPhaseGlobal = globalPhase;
                    if (localPhase === 0) this.audio.playInhale(this.phases[0] / 1000);
                    if (localPhase === 2) this.audio.playExhale(this.phases[2] / 1000);
                }

                const phaseTexts = ["Breathe in", "Hold", "Breathe out", "Hold"];
                this.state.phaseText = currentPhaseLength < 1000 ? "" : phaseTexts[localPhase];
                this.state.writeNowActive = (!isSecondCycle && localPhase === 2);

                if (this.state.writeNowActive && phaseTime < 50 && this.lastBellTriggerCycle !== cycleIndex) {
                    this.lastBellTriggerCycle = cycleIndex;
                    this.audio.playBell();
                }

                const textFade = Math.min(1200, currentPhaseLength * 0.4);
                this.state.textOpacity = phaseTime < textFade ? (phaseTime / textFade) * 0.45 : (phaseTime > currentPhaseLength - textFade ? ((currentPhaseLength - phaseTime) / textFade) * 0.45 : 0.45);

                if (this.state.writeNowActive) {
                    const displayDuration = 4000; 
                    const fadeInDuration = 800;
                    if (phaseTime < fadeInDuration) {
                        this.state.writeNowOpacity = phaseTime / fadeInDuration;
                    } else if (phaseTime <= displayDuration) {
                        this.state.writeNowOpacity = 1.0;
                    } else if (phaseTime < displayDuration + 300) {
                        this.state.writeNowOpacity = 1.0 - ((phaseTime - displayDuration) / 300);
                    } else {
                        this.state.writeNowOpacity = 0;
                    }
                } else {
                    this.state.writeNowOpacity = 0;
                }

                if (Math.floor(elapsed / totalCycleTime) !== this.lastCycleIndex) {
                    this.lastCycleIndex = Math.floor(elapsed / totalCycleTime);
                    if (this.lastCycleIndex > 0) {
                        this.setRandomBackground();
                        this.setRandomImage();
                    }
                }

                if (isSecondCycle) {
                    const fadeStart = this.phaseStarts[2];
                    const fadeDuration = (totalCycleTime / 2) - fadeStart;
                    this.state.opacity = t < fadeStart ? 1.0 : Math.max(0, 1.0 - ((t - fadeStart) / fadeDuration));
                } else {
                    const fadeStart = this.phaseStarts[2];
                    this.state.opacity = t < fadeStart ? (t / fadeStart) * 0.10 : (t < this.phaseStarts[3] ? Math.min(1.0, 0.10 + ((t - fadeStart) / 1200) * 0.90) : 1.0);
                }
            }
            draw() {
                this.ctx.clearRect(0, 0, this.center * 2, this.center * 2);

                const bgGlowRadius = this.baseRadius * (1.3 + (this.state.scaleFactor - 1.0) * 2);
                const bgGradient = this.ctx.createRadialGradient(
                    this.center, this.center, this.baseRadius * 0.2,
                    this.center, this.center, bgGlowRadius
                );
                bgGradient.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
                bgGradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.15)');
                bgGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                this.ctx.beginPath();
                this.ctx.arc(this.center, this.center, bgGlowRadius, 0, 2 * Math.PI);
                this.ctx.fillStyle = bgGradient;
                this.ctx.fill();

                this.ctx.save();
                this.ctx.translate(this.center, this.center);
                this.ctx.scale(this.state.scaleFactor, this.state.scaleFactor);
                this.ctx.translate(-this.center, -this.center);

                // White circle background
                this.ctx.globalAlpha = 1.0;
                this.ctx.beginPath();
                this.ctx.arc(this.center, this.center, this.baseRadius, 0, 2 * Math.PI);
                this.ctx.fillStyle = '#ffffff';
                this.ctx.fill();

                // Main brush stroke (Enso)
                this.ctx.save();
                this.ctx.strokeStyle = '#111315';
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';

                const strokeLayers = [
                    { width: 32, alpha: 0.12, offset: 3.5 },
                    { width: 26, alpha: 0.30, offset: -2 },
                    { width: 20, alpha: 0.75, offset: 0.5 },
                    { width: 14, alpha: 0.90, offset: -1 },
                    { width: 8,  alpha: 0.95, offset: 1.5 }
                ];

                strokeLayers.forEach(layer => {
                    this.ctx.lineWidth = layer.width;
                    this.ctx.globalAlpha = layer.alpha;
                    this.ctx.beginPath();
                    this.ctx.arc(
                        this.center + layer.offset, 
                        this.center - layer.offset, 
                        this.baseRadius + (layer.offset * 0.4), 
                        Math.PI * 0.54, 
                        Math.PI * 0.46
                    );
                    this.ctx.stroke();
                });

                // Feibai lines ("flying white")
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                this.ctx.lineWidth = 3.0;
                const feibaiLines = [
                    { offset: 0.8, startAngle: 0.7, endAngle: 1.9 },
                    { offset: -0.5, startAngle: 2.3, endAngle: 3.8 },
                    { offset: 1.2, startAngle: 4.1, endAngle: 5.2 }
                ];

                feibaiLines.forEach(fb => {
                    this.ctx.globalAlpha = 0.55;
                    this.ctx.beginPath();
                    this.ctx.arc(
                        this.center + fb.offset,
                        this.center - fb.offset,
                        this.baseRadius + fb.offset,
                        fb.startAngle,
                        fb.endAngle
                    );
                    this.ctx.stroke();
                });

                // Black shadow lines
                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
                this.ctx.lineWidth = 1.2;
                const outlineShadows = [
                    { offset: -1.2, startAngle: 0.6, endAngle: 2.0 },
                    { offset: 1.5, startAngle: 2.2, endAngle: 3.9 },
                    { offset: -0.8, startAngle: 4.0, endAngle: 5.3 }
                ];

                outlineShadows.forEach(os => {
                    this.ctx.globalAlpha = 0.45;
                    this.ctx.beginPath();
                    this.ctx.arc(
                        this.center + os.offset,
                        this.center - os.offset,
                        this.baseRadius + os.offset,
                        os.startAngle,
                        os.endAngle
                    );
                    this.ctx.stroke();
                });

                this.ctx.restore();

                // Calligraphy image with multiply blend mode
                const img = this.images[this.currentImgFile];
                if (img && img.complete && img.naturalWidth !== 0) {
                    this.ctx.save();
                    this.ctx.globalAlpha = this.state.opacity;
                    this.ctx.globalCompositeOperation = 'multiply';
                    
                    const imgSize = this.baseRadius * 1.5;
                    this.ctx.drawImage(img, this.center - imgSize / 2, this.center - imgSize / 2, imgSize, imgSize);
                    this.ctx.restore();
                }

                // "write" seal
                if (this.state.writeNowOpacity > 0) {
                    this.ctx.save();
                    this.ctx.font = 'bold 26px sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    
                    const text = "write";
                    const metrics = this.ctx.measureText(text);
                    const paddingX = 22;
                    const boxWidth = metrics.width + paddingX * 2;
                    const boxHeight = 44;
                    const boxX = this.center - boxWidth / 2;
                    const boxY = this.center + this.baseRadius + 35;
                    const radius = 6;

                    this.ctx.globalAlpha = this.state.writeNowOpacity * 0.95;
                    this.ctx.fillStyle = '#bb2d3b';
                    this.ctx.beginPath();
                    this.ctx.roundRect(boxX, boxY, boxWidth, boxHeight, radius);
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#842029';
                    this.ctx.lineWidth = 1.5;
                    this.ctx.stroke();

                    this.ctx.globalAlpha = this.state.writeNowOpacity;
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillText(text, this.center, boxY + boxHeight / 2);
                    this.ctx.restore();
                }

                this.ctx.restore();

                // Phase text
                if (this.state.phaseText) {
                    this.ctx.save();
                    this.ctx.globalAlpha = this.state.textOpacity;
                    this.ctx.font = 'bold 42px sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'bottom';
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.shadowBlur = 6;
                    this.ctx.fillText(this.state.phaseText, this.center, this.center - this.baseRadius - 45);
                    this.ctx.restore();
                }

                // Indicator point (Flow10 = Gold, Flow12 = Emerald Green, Triangle/Box = Blue)
                this.ctx.globalAlpha = 1.0;
                const pointRadius = 18;
                const gradient = this.ctx.createRadialGradient(
                    this.state.x - 5, this.state.y - 5, 2, 
                    this.state.x, this.state.y, pointRadius
                );
                
                const p = Math.max(0, Math.min(1, this.state.colorProgress));
                
                if (this.currentPatternKey === 'flow') {
                    // Flow Breathing (10s): Gold Gradient
                    const innerLight = `rgb(${Math.round(255 + (248 - 255)*p)}, ${Math.round(230 + (248 - 230)*p)}, ${Math.round(150 + (247 - 150)*p)})`;
                    const midColor = `rgb(${Math.round(218 + (238 - 218)*p)}, ${Math.round(165 + (238 - 165)*p)}, ${Math.round(32 + (209 - 32)*p)})`;
                    const darkColor = `rgb(${Math.round(184 + (215 - 184)*p)}, ${Math.round(134 + (215 - 134)*p)}, ${Math.round(11 + (155 - 11)*p)})`;
                    const outerDark = `rgb(${Math.round(139 + (185 - 139)*p)}, ${Math.round(90 + (185 - 90)*p)}, ${Math.round(0 + (120 - 0)*p)})`;

                    gradient.addColorStop(0, innerLight); 
                    gradient.addColorStop(0.3, midColor); 
                    gradient.addColorStop(0.8, darkColor); 
                    gradient.addColorStop(1, outerDark); 
                } else if (this.currentPatternKey === 'flow12') {
                    // Flow Breathing (12s): Emerald Green Gradient
                    const innerLight = `rgb(${Math.round(167 + (248 - 167)*p)}, ${Math.round(235 + (248 - 235)*p)}, ${Math.round(195 + (247 - 195)*p)})`;
                    const midColor = `rgb(${Math.round(80 + (238 - 80)*p)}, ${Math.round(200 + (238 - 200)*p)}, ${Math.round(120 + (238 - 120)*p)})`;
                    const darkColor = `rgb(${Math.round(46 + (215 - 46)*p)}, ${Math.round(139 + (215 - 139)*p)}, ${Math.round(87 + (215 - 87)*p)})`;
                    const outerDark = `rgb(${Math.round(0 + (185 - 0)*p)}, ${Math.round(100 + (185 - 100)*p)}, ${Math.round(50 + (185 - 50)*p)})`;

                    gradient.addColorStop(0, innerLight); 
                    gradient.addColorStop(0.3, midColor); 
                    gradient.addColorStop(0.8, darkColor); 
                    gradient.addColorStop(1, outerDark); 
                } else {
                    // Triangle & Box Breathing: Blue Gradient
                    const innerLight = `rgb(${Math.round(79 + (248 - 79)*p)}, ${Math.round(195 + (248 - 195)*p)}, ${Math.round(247 + (248 - 247)*p)})`;
                    const midColor = `rgb(${Math.round(2 + (238 - 2)*p)}, ${Math.round(136 + (238 - 136)*p)}, ${Math.round(209 + (238 - 209)*p)})`;
                    const darkColor = `rgb(${Math.round(1 + (215 - 1)*p)}, ${Math.round(87 + (215 - 87)*p)}, ${Math.round(155 + (215 - 155)*p)})`;
                    const outerDark = `rgb(${Math.round(0 + (185 - 0)*p)}, ${Math.round(60 + (185 - 60)*p)}, ${Math.round(120 + (185 - 120)*p)})`;

                    gradient.addColorStop(0, innerLight); 
                    gradient.addColorStop(0.3, midColor); 
                    gradient.addColorStop(0.8, darkColor); 
                    gradient.addColorStop(1, outerDark); 
                }

                this.ctx.beginPath();
                this.ctx.arc(this.state.x, this.state.y, pointRadius, 0, 2 * Math.PI);
                this.ctx.fillStyle = gradient;
                this.ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                this.ctx.shadowBlur = 8;
                this.ctx.shadowOffsetX = 1;
                this.ctx.shadowOffsetY = 3;
                this.ctx.fill();
                
                this.ctx.shadowBlur = 0;
                this.ctx.shadowOffsetX = 0;
                this.ctx.shadowOffsetY = 0;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ZenMeditationCanvas({
                imageFiles: ['example-hai', 'example-em', 'example-ai', 'th-n', 'cursive-hai', 'example-làm']
            });
        });
    </script>
</body>

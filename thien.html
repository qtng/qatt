<!DOCTYPE html>
<html lang="de" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiên Calligraphy - Văn Đạo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }
        .bg-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }
        .bg-container img.active {
            opacity: 1;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }
        #meditation-canvas {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
        }
    </style>
</head>
<body class="d-flex flex-column justify-content-between align-items-center vh-100 py-4">

    <div class="bg-container" id="bg-container">
        <img src="img/thien.jpg" alt="">
    </div>
    <div class="bg-overlay"></div>

    <div class="text-center text-white" id="header-container" style="text-shadow: 0 2px 4px rgba(0,0,0,0.6);">
        <h2 class="fw-light mb-1">Thiên Calligraphy</h2>
        <p class="small mb-0 opacity-75">Quốc Âm Tân Tự</p>
    </div>

    <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1 w-100">
        <div class="text-center text-white p-4 rounded" id="intro-screen" style="background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px);">
            <h1 class="fw-light mb-4">Văn Đạo</h1>
            <p class="small mb-4 opacity-75">Klicke auf Start, um die Audio-Wiedergabe und die Praxis zu beginnen.</p>
            <button id="start-btn" class="btn btn-light px-4 py-2">Praxis beginnen</button>
        </div>

        <div class="d-none w-100 px-3 text-center" id="app-container">
            <canvas id="meditation-canvas"></canvas>
        </div>
    </div>

    <script>
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.droneInterval = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.startAmbientMusic();
            }

            playTone(frequency, duration) {
                if (!this.ctx) return;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(frequency, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.12, this.ctx.currentTime + 1.5);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            startAmbientMusic() {
                if (this.droneInterval) return;
                
                const chords = [
                    [164.81, 246.94, 329.63], 
                    [130.81, 196.00, 293.66], 
                    [146.83, 220.00, 329.63]  
                ];
                let chordIndex = 0;

                const playChord = () => {
                    if (!this.ctx) return;
                    const chord = chords[chordIndex];
                    chordIndex = (chordIndex + 1) % chords.length;

                    chord.forEach(freq => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                        gain.gain.setValueAtTime(0, this.ctx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.04, this.ctx.currentTime + 3);
                        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 10);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start();
                        osc.stop(this.ctx.currentTime + 10);
                    });
                };

                playChord();
                this.droneInterval = setInterval(playChord, 10000);
            }

            playInhale() {
                this.playTone(329.63, 3); 
            }

            playExhale() {
                this.playTone(220.00, 3); 
            }
        }

        class ZenMeditationCanvas {
            constructor(config) {
                this.imageFiles = config.imageFiles;
                this.duration = config.durationMs;
                
                this.images = {};
                this.imageFiles.forEach(filename => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = `https://qatt.org/qatt/img/can/${filename}.jpg`;
                    this.images[filename] = img;
                });

                this.currentImgFile = this.imageFiles[0];

                this.startTime = null;
                this.currentPhaseGlobal = -1;
                this.lastCycleIndex = -1;

                this.ui = {
                    canvas: document.getElementById('meditation-canvas'),
                    container: document.getElementById('app-container'),
                    intro: document.getElementById('intro-screen'),
                    btn: document.getElementById('start-btn'),
                    bgImages: document.querySelectorAll('#bg-container img')
                };

                this.ctx = this.ui.canvas.getContext('2d');
                this.audio = new AudioEngine();

                this.state = {
                    x: 0,
                    y: 0,
                    opacity: 0,
                    phaseText: '',
                    writeNowActive: false,
                    textOpacity: 0,
                    writeNowOpacity: 0,
                    scaleFactor: 1.0
                };

                this.setupCanvas();
                this.bindEvents();
                this.setRandomBackground();
                this.setRandomImage();
            }

            setupCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const size = 600; 
                this.ui.canvas.width = size * dpr;
                this.ui.canvas.height = size * dpr;
                this.ctx.scale(dpr, dpr);
                
                this.center = size / 2;
                this.baseRadius = (size / 2) - 100;
            }

            bindEvents() {
                this.ui.btn.addEventListener('click', () => this.start());
            }

            setRandomBackground() {
                const images = this.ui.bgImages;
                if (!images || images.length === 0) return;
                
                const currentIndex = Array.from(images).findIndex(img => img.classList.contains('active'));
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * images.length);
                } while (nextIndex === currentIndex && images.length > 1);

                images.forEach((img, idx) => {
                    if (idx === nextIndex) {
                        img.classList.add('active');
                    } else {
                        img.classList.remove('active');
                    }
                });
            }

            setRandomImage() {
                let nextFile;
                do {
                    nextFile = this.imageFiles[Math.floor(Math.random() * this.imageFiles.length)];
                } while (nextFile === this.currentImgFile && this.imageFiles.length > 1);
                
                this.currentImgFile = nextFile;
            }

            start() {
                this.audio.init();
                this.ui.intro.classList.add('d-none');
                this.ui.container.classList.remove('d-none');
                
                this.setRandomBackground();
                this.setRandomImage();

                this.startTime = performance.now();
                requestAnimationFrame((timestamp) => this.loop(timestamp));
            }

            loop(timestamp) {
                const elapsed = timestamp - this.startTime;
                const totalCycleTime = this.duration * 2; 
                
                const progressInBlock = elapsed % totalCycleTime;
                const isSecondCycle = progressInBlock >= this.duration;
                const t = progressInBlock % this.duration;

                this.updateLogic(t, isSecondCycle, elapsed, totalCycleTime);
                this.draw();

                requestAnimationFrame((ts) => this.loop(ts));
            }

            updateLogic(t, isSecondCycle, elapsed, totalCycleTime) {
                const progress = t / this.duration;
                const angleRad = (progress * 2 * Math.PI) + (Math.PI / 2);

                const phaseLength = this.duration / 4;
                const localPhase = Math.floor(t / phaseLength); 
                const globalPhase = Math.floor(elapsed / phaseLength);
                const cycleIndex = Math.floor(elapsed / totalCycleTime);

                const phaseProgress = (t % phaseLength) / phaseLength;
                let easeVal = 0;
                
                if (localPhase === 0) {
                    easeVal = (1 - Math.cos(phaseProgress * Math.PI)) / 2;
                    this.state.scaleFactor = 1.0 + (easeVal * 0.1);
                } else if (localPhase === 1) {
                    this.state.scaleFactor = 1.1;
                } else if (localPhase === 2) {
                    easeVal = (1 + Math.cos(phaseProgress * Math.PI)) / 2;
                    this.state.scaleFactor = 1.0 + (easeVal * 0.1);
                } else {
                    this.state.scaleFactor = 1.0;
                }

                const currentRadius = this.baseRadius * this.state.scaleFactor;
                this.state.x = this.center + currentRadius * Math.cos(angleRad);
                this.state.y = this.center + currentRadius * Math.sin(angleRad);

                if (this.currentPhaseGlobal !== globalPhase) {
                    this.currentPhaseGlobal = globalPhase;
                    this.onPhaseCheck(localPhase, isSecondCycle);
                }

                if (localPhase === 0) {
                    this.state.phaseText = "Breathe in";
                } else if (localPhase === 1) {
                    this.state.phaseText = "Hold";
                } else if (localPhase === 2) {
                    this.state.phaseText = "Breathe out";
                } else {
                    this.state.phaseText = "Hold";
                }

                if (!isSecondCycle && localPhase === 2) {
                    this.state.writeNowActive = true;
                } else {
                    this.state.writeNowActive = false;
                }

                const timeInPhase = t % phaseLength;
                if (timeInPhase < 1200) {
                    this.state.textOpacity = (timeInPhase / 1200) * 0.45;
                } else if (timeInPhase > phaseLength - 1200) {
                    this.state.textOpacity = ((phaseLength - timeInPhase) / 1200) * 0.45;
                } else {
                    this.state.textOpacity = 0.45;
                }

                if (this.state.writeNowActive) {
                    const timeInWritePhase = timeInPhase;
                    const displayDuration = 2000; 
                    const fadeInDuration = 800;
                    
                    if (timeInWritePhase < fadeInDuration) {
                        this.state.writeNowOpacity = timeInWritePhase / fadeInDuration;
                    } else if (timeInWritePhase >= fadeInDuration && timeInWritePhase <= displayDuration) {
                        this.state.writeNowOpacity = 1.0;
                    } else if (timeInWritePhase > displayDuration && timeInWritePhase < displayDuration + 300) {
                        this.state.writeNowOpacity = 1.0 - ((timeInWritePhase - displayDuration) / 300);
                    } else {
                        this.state.writeNowOpacity = 0;
                    }
                } else {
                    this.state.writeNowOpacity = 0;
                }

                if (cycleIndex !== this.lastCycleIndex) {
                    this.lastCycleIndex = cycleIndex;
                    if (cycleIndex > 0) {
                        this.setRandomBackground();
                        this.setRandomImage();
                    }
                }

                if (isSecondCycle) {
                    const exhaleHalfDuration = phaseLength * 2;
                    if (t < exhaleHalfDuration) {
                        this.state.opacity = 1.0;
                    } else {
                        const fadeProgress = (t - exhaleHalfDuration) / exhaleHalfDuration;
                        this.state.opacity = Math.max(0, 1.0 - fadeProgress);
                    }
                } else {
                    if (t < phaseLength * 2) {
                        this.state.opacity = (t / (phaseLength * 2)) * 0.10;
                    } else if (t >= phaseLength * 2 && t < phaseLength * 3) {
                        const timeInExhale = t - (phaseLength * 2);
                        if (timeInExhale <= 1200) {
                            this.state.opacity = 0.15 + (timeInExhale / 1200) * 0.90;
                        } else {
                            this.state.opacity = 1.0;
                        }
                    } else {
                        this.state.opacity = 1.0;
                    }
                }
            }

            onPhaseCheck(localPhase, isSecondCycle) {
                if (localPhase === 0) this.audio.playInhale();
                if (localPhase === 2) this.audio.playExhale();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.center * 2, this.center * 2);

                const bgGlowRadius = this.baseRadius * (1.3 + (this.state.scaleFactor - 1.0) * 2);
                const bgGradient = this.ctx.createRadialGradient(
                    this.center, this.center, this.baseRadius * 0.2,
                    this.center, this.center, bgGlowRadius
                );
                bgGradient.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
                bgGradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.15)');
                bgGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                this.ctx.beginPath();
                this.ctx.arc(this.center, this.center, bgGlowRadius, 0, 2 * Math.PI);
                this.ctx.fillStyle = bgGradient;
                this.ctx.fill();

                this.ctx.save();
                this.ctx.translate(this.center, this.center);
                this.ctx.scale(this.state.scaleFactor, this.state.scaleFactor);
                this.ctx.translate(-this.center, -this.center);

                // Weißer Kreis-Hintergrund
                this.ctx.globalAlpha = 1.0;
                this.ctx.beginPath();
                this.ctx.arc(this.center, this.center, this.baseRadius, 0, 2 * Math.PI);
                this.ctx.fillStyle = '#ffffff';
                this.ctx.fill();

                // Haupt-Pinselstrich (Enso)
                this.ctx.save();
                this.ctx.strokeStyle = '#111315';
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';

                const strokeLayers = [
                    { width: 32, alpha: 0.12, offset: 3.5 },
                    { width: 26, alpha: 0.30, offset: -2 },
                    { width: 20, alpha: 0.75, offset: 0.5 },
                    { width: 14, alpha: 0.90, offset: -1 },
                    { width: 8,  alpha: 0.95, offset: 1.5 }
                ];

                strokeLayers.forEach(layer => {
                    this.ctx.lineWidth = layer.width;
                    this.ctx.globalAlpha = layer.alpha;
                    this.ctx.beginPath();
                    this.ctx.arc(
                        this.center + layer.offset, 
                        this.center - layer.offset, 
                        this.baseRadius + (layer.offset * 0.4), 
                        Math.PI * 0.54, 
                        Math.PI * 0.46
                    );
                    this.ctx.stroke();
                });

                // Feibai-Linien ("fliegendes Weiß")
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                this.ctx.lineWidth = 3.0;
                const feibaiLines = [
                    { offset: 0.8, startAngle: 0.7, endAngle: 1.9 },
                    { offset: -0.5, startAngle: 2.3, endAngle: 3.8 },
                    { offset: 1.2, startAngle: 4.1, endAngle: 5.2 }
                ];

                feibaiLines.forEach(fb => {
                    this.ctx.globalAlpha = 0.55;
                    this.ctx.beginPath();
                    this.ctx.arc(
                        this.center + fb.offset,
                        this.center - fb.offset,
                        this.baseRadius + fb.offset,
                        fb.startAngle,
                        fb.endAngle
                    );
                    this.ctx.stroke();
                });

                // Schwarze Schattenlinien (Outline-Effekt)
                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
                this.ctx.lineWidth = 1.2;
                const outlineShadows = [
                    { offset: -1.2, startAngle: 0.6, endAngle: 2.0 },
                    { offset: 1.5, startAngle: 2.2, endAngle: 3.9 },
                    { offset: -0.8, startAngle: 4.0, endAngle: 5.3 }
                ];

                outlineShadows.forEach(os => {
                    this.ctx.globalAlpha = 0.45;
                    this.ctx.beginPath();
                    this.ctx.arc(
                        this.center + os.offset,
                        this.center - os.offset,
                        this.baseRadius + os.offset,
                        os.startAngle,
                        os.endAngle
                    );
                    this.ctx.stroke();
                });

                this.ctx.restore();

                // Bild anstelle des Schriftzeichens zeichnen
                const img = this.images[this.currentImgFile];
                if (img && img.complete && img.naturalWidth !== 0) {
                    this.ctx.save();
                    this.ctx.globalAlpha = this.state.opacity;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(this.center, this.center, this.baseRadius * 0.75, 0, Math.PI * 2);
                    this.ctx.clip();

                    const imgSize = this.baseRadius * 1.25;
                    this.ctx.drawImage(img, this.center - imgSize / 2, this.center - imgSize / 2, imgSize, imgSize);
                    this.ctx.restore();
                }

                // "write" Siegel
                if (this.state.writeNowOpacity > 0) {
                    this.ctx.save();
                    this.ctx.font = 'bold 26px sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    
                    const text = "write";
                    const metrics = this.ctx.measureText(text);
                    const paddingX = 22;
                    const boxWidth = metrics.width + paddingX * 2;
                    const boxHeight = 44;
                    const boxX = this.center - boxWidth / 2;
                    const boxY = this.center + this.baseRadius + 35;
                    const radius = 6;

                    this.ctx.globalAlpha = this.state.writeNowOpacity * 0.95;
                    this.ctx.fillStyle = '#bb2d3b';
                    this.ctx.beginPath();
                    this.ctx.roundRect(boxX, boxY, boxWidth, boxHeight, radius);
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#842029';
                    this.ctx.lineWidth = 1.5;
                    this.ctx.stroke();

                    this.ctx.globalAlpha = this.state.writeNowOpacity;
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillText(text, this.center, boxY + boxHeight / 2);
                    this.ctx.restore();
                }

                this.ctx.restore();

                // Text oberhalb des Kreises
                if (this.state.phaseText) {
                    this.ctx.save();
                    this.ctx.globalAlpha = this.state.textOpacity;
                    this.ctx.font = 'bold 42px sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'bottom';
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.shadowBlur = 6;
                    this.ctx.fillText(this.state.phaseText, this.center, this.center - this.baseRadius - 45);
                    this.ctx.restore();
                }

                // Dreidimensionale Goldkugel
                this.ctx.globalAlpha = 1.0;
                const pointRadius = 18;
                const gradient = this.ctx.createRadialGradient(
                    this.state.x - 5, this.state.y - 5, 2, 
                    this.state.x, this.state.y, pointRadius
                );
                gradient.addColorStop(0, '#fff6a8'); 
                gradient.addColorStop(0.3, '#f5c242'); 
                gradient.addColorStop(0.8, '#c28c11'); 
                gradient.addColorStop(1, '#7a5405'); 

                this.ctx.beginPath();
                this.ctx.arc(this.state.x, this.state.y, pointRadius, 0, 2 * Math.PI);
                this.ctx.fillStyle = gradient;
                this.ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                this.ctx.shadowBlur = 10;
                this.ctx.shadowOffsetX = 2;
                this.ctx.shadowOffsetY = 4;
                this.ctx.fill();
                
                this.ctx.shadowBlur = 0;
                this.ctx.shadowOffsetX = 0;
                this.ctx.shadowOffsetY = 0;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ZenMeditationCanvas({
                imageFiles: ['example-hai', 'example-em', 'example-ai', 'example-làm'],
                durationMs: 12000 
            });
        });
    </script>
</body>
</html>

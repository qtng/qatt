<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QATT reference font</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <style>
    :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 74rem; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
    .hero { background: radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%), linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%); border-bottom: 1px solid #e8dcc0; color: var(--ink); }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; margin: 0; }
    .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    @media (max-width: 575.98px) { .hero .han { letter-spacing: .3em; } }
    p { margin: .3rem 0 .8rem; color: var(--muted); }
    a { color: var(--accent); }
    .sticky-card { position: sticky; top: 68px; z-index: 5; margin: 1rem 0 .4rem; padding: .5rem .7rem; background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }
    .bar { display: flex; gap: .6rem; align-items: center; margin: 0 0 .5rem; font-size: .78rem; }
    .bar select { font-size: .78rem; padding-top: .1rem; padding-bottom: .1rem; }
    .bar label { display: flex; align-items: center; gap: .3rem; white-space: nowrap; margin: 0; }
    .bar label.grow { flex: 1 1 4rem; min-width: 0; }
    .sample { width: 100%; border: 1px solid var(--field); border-radius: .5rem; background: #fffdf8; padding: .2rem .6rem; min-height: 3.4rem;
      font-family: var(--qfont, "QATT Serif"); font-size: 3rem; line-height: 1; word-break: break-all; white-space: pre-wrap; overflow: auto; max-height: 8rem; color: var(--ink); }
    .sample:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: .7; font: .95rem system-ui, -apple-system, sans-serif; }
    .keys { display: flex; justify-content: space-between; gap: .4rem; margin: 0 0 .45rem; }
    .keys .btn { flex: 1 1 0; }
    .sample:focus { outline: 2px solid rgba(168, 54, 42, .35); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 3.8rem), 1fr)); gap: .35rem; margin-top: .6rem; }
    .cell { border: 1px solid var(--line); border-radius: .4rem; background: #fffdf8; padding: .2rem .1rem .25rem; text-align: center; cursor: pointer; position: relative; }
    .cell:hover { border-color: var(--accent); }
    .cell .f { font-family: var(--qfont, "QATT Serif"); font-size: var(--size, 4rem); line-height: 1.15; display: block; padding-bottom: .16em; }
    .cell .s { display: block; height: 1.8rem; line-height: 1.8rem; font-size: .8rem; color: var(--muted); }
    .cell .s svg { stroke: currentColor; }
    .cell .cp { display: block; font: .62rem ui-monospace, Menlo, monospace; color: var(--muted); }
    .cell.tone .f { color: var(--accent); padding-bottom: .32em; }
    .hide-svg .s { display: none; }
    .fmt-row { display: flex; align-items: center; gap: .9rem; margin-top: .6rem; }
    .fmt-row .cell { flex: 0 0 var(--cell, 3.8rem); width: var(--cell, 3.8rem); }
    .fmt-text { font-size: .9rem; color: var(--muted); }
    .fmt-text strong { color: var(--ink); }
    #grid { grid-template-columns: repeat(7, var(--cell, 3.8rem)); }   /* one base per row: the unmarked form, the marked Cán, the five Chi */
    .grid .break { grid-column: 1 / -1; height: .9rem; }
    /* the character cell as the font defines it: the 1 em square, ascender 0.88 em above and descender 0.12 em below the baseline (line-height 1.15 puts the top of the square .075 em from the top of the box);
       its edges in the darker colour, the middle lines in the lighter one */
    .guides .f { --edge: #e8b4ac; --mid: #f0ddd9;
      background:
        linear-gradient(to right, transparent calc(50% - .5em - .5px), var(--edge) calc(50% - .5em - .5px) calc(50% - .5em + .5px), transparent calc(50% - .5em + .5px), transparent calc(50% - .5px), var(--mid) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px), transparent calc(50% + .5em - .5px), var(--edge) calc(50% + .5em - .5px) calc(50% + .5em + .5px), transparent calc(50% + .5em + .5px)),
        linear-gradient(to bottom, transparent calc(.075em - .5px), var(--edge) calc(.075em - .5px) calc(.075em + .5px), transparent calc(.075em + .5px), transparent calc(.575em - .5px), var(--mid) calc(.575em - .5px) calc(.575em + .5px), transparent calc(.575em + .5px), transparent calc(1.075em - .5px), var(--edge) calc(1.075em - .5px) calc(1.075em + .5px), transparent calc(1.075em + .5px)); }
    h2.sub { font-size: 1rem; margin: 1.2rem 0 0; color: var(--ink); }
    #info { margin-top: .3rem; font-size: .8rem; color: var(--muted); text-align: center; }
    #info:empty { display: none; }
  </style>
  <script src="js/navigation.js"></script>
  <script src="js/qatt.js"></script>
</head>
<body>
<header class="hero pt-5 pb-4">
  <div class="container text-center">
    <div class="han mb-2">國音新字</div>
    <h1 class="mb-3">QATT reference font</h1>
    <p class="lead mx-auto mb-4">The font for the <a href="unicode.html">QATT Unicode proposal</a>: all 164 characters of the draft block, one square each. A prototype.</p>
    <a class="btn btn-cinnabar btn-pill" href="font-editor.html">Glyph editor</a>
    <a class="btn btn-outline-secondary btn-pill" href="editor.html">Type QATT</a>
    <a class="btn btn-outline-secondary btn-pill" href="specimen.html">Type specimens</a>
  </div>
</header>
<main>
  <div class="sticky-card">
  <div class="bar">
    <label><select id="font" data-qatt-fonts autocomplete="off" class="form-select form-select-sm d-inline-block w-auto" aria-label="Font"></select></label>
    <label><select id="size" data-qatt-sizes autocomplete="off" class="form-select form-select-sm d-inline-block w-auto" aria-label="Size"></select></label>
    <label><input type="checkbox" id="guides" autocomplete="off" checked> Guides</label>
    <label><input type="checkbox" id="svg" autocomplete="off"> SVG</label>
  </div>

  <div class="keys">
    <button type="button" class="btn btn-sm btn-outline-secondary" id="copy">Copy</button>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="joiner" title="Add the component joiner U+F009B">A⿰B</button>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="stack" title="Add the Tham Thư combiner U+F009A">B⿱C</button>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="clear" title="Empty the sample field">Clear</button>
  </div>
  <div class="sample" id="sample" spellcheck="false" aria-label="Sample text" data-placeholder="Click characters below to add them here"></div>
  <div id="info"></div>
  </div>
  <h2 class="sub">Format characters</h2>
  <div class="formats" id="grid-format"></div>
  <h2 class="sub">Tone marks</h2>
  <div class="grid" id="grid-marks"></div>
  <h2 class="sub">Letters</h2>
  <div class="grid" id="grid"></div>
</main>

<script src="js/fonts.js"></script>
<script>
(async () => {
  const BASE = 0xF0000;
  const glyphs = await (await fetch('fonts/glyphs.json')).json();
  const $ = s => document.querySelector(s);
  const grids = [$('#grid-format'), $('#grid-marks'), $('#grid')], sample = $('#sample'), info = $('#info');
  const hex = n => n.toString(16).toUpperCase().padStart(5, '0');
  const q = new Qatt(); q.observe('TT');

  // the sample field is plain text, no caret: characters are added at its end
  const add = text => { sample.textContent += text; };
  // one of the 22 unmarked letters (U+F0000 + 7 * n) is the onset of a pair: the component joiner U+F009B follows it, unless it already follows a joiner (then it is the rhyme)
  const addLetter = o => {
    const J = String.fromCodePoint(BASE + 155), prev = Array.from(sample.textContent).pop();
    add(String.fromCodePoint(BASE + o) + (o < 154 && o % 7 === 0 && prev !== J ? J : ''));
  };

  // the format characters and the tone marks first, then the letters
  const EXPLAIN = {   // what the two format characters do
    combiner: ['Tham Thư combiner', '<em>A</em> <code>U+F009A</code> <em>B</em> writes <em>B</em> above <em>A</em>; <em>A</em> may be a joined pair.'],
    joiner: ['Component joiner', '<em>A</em> <code>U+F009B</code> <em>B</em> is shown as one square, <em>A</em> in the left and <em>B</em> in the right half.'],
  };
  for (const g of glyphs) {
    const cell = document.createElement('div');
    cell.className = 'cell ' + g.t;
    cell.title = g.n.toLowerCase();
    const f = document.createElement('span'); f.className = 'f'; f.textContent = String.fromCodePoint(BASE + g.o);
    const s = document.createElement('span'); s.className = 's';
    if (g.q) { const tt = document.createElement('tt'); tt.textContent = g.q; s.append(tt); } else s.hidden = true;
    const cp = document.createElement('span'); cp.className = 'cp'; cp.textContent = 'U+' + hex(BASE + g.o);
    cell.append(f, s, cp);
    cell.addEventListener('click', () => { addLetter(g.o); info.textContent = g.n + ' — U+' + hex(BASE + g.o) + (g.q ? ' — ' + g.q : ''); });
    if (EXPLAIN[g.t]) {   // a row of its own: the tile, then the name and what it does
      const row = document.createElement('div'); row.className = 'fmt-row';
      const text = document.createElement('div'); text.className = 'fmt-text';
      text.innerHTML = '<strong>' + EXPLAIN[g.t][0] + '</strong> <code>U+' + hex(BASE + g.o) + '</code><br>' + EXPLAIN[g.t][1];
      row.append(cell, text); grids[0].append(row);
    } else grids[g.t === 'tone' ? 1 : 2].append(cell);
  }

  const apply = () => {
    const px = +$('#size').value;
    sample.style.fontSize = Math.max(px * .8, 32) + 'px';
    for (const grid of grids) {
      grid.style.setProperty('--size', px + 'px');
      grid.style.setProperty('--cell', Math.max(px * 1.5, 46) + 'px');
      grid.classList.toggle('hide-svg', !$('#svg').checked);
      grid.classList.toggle('guides', $('#guides').checked);
    }
  };
  for (const id of ['#size', '#svg', '#guides']) $(id).addEventListener('input', apply);
  $('#copy').addEventListener('click', async () => {
    const btn = $('#copy'), text = sample.textContent;
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
    catch { const r = document.createRange(); r.selectNodeContents(sample); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = document.execCommand('copy') ? 'Copied' : 'Select and copy'; }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });
  $('#joiner').addEventListener('click', () => { add(String.fromCodePoint(BASE + glyphs.find(g => g.t === 'joiner').o)); info.textContent = 'component joiner'; });
  $('#stack').addEventListener('click', () => { add(String.fromCodePoint(BASE + glyphs.find(g => g.t === 'combiner').o)); info.textContent = 'Tham Thư combiner'; });
  $('#clear').addEventListener('click', () => { sample.textContent = ''; info.textContent = ''; });
  apply();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QATT Wikipedia Browser</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">

    <script src="js/parser.js"></script>
    <script src="js/qatt-text.js"></script>
    <script defer src="js/navigation.js"></script>

    <style>
        :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; --qfont: "QATT Gothic"; }
        body { background: var(--paper); color: var(--ink); }
        a { color: var(--accent); }

        .hero {
            background:
                radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
                linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
            border-bottom: 1px solid #e8dcc0;
            color: var(--ink);
        }
        .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
        .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
        .hero .lead { max-width: 38rem; color: #4a3d30; }
        @media (max-width: 575.98px) { .hero .han { letter-spacing: .3em; } }

        /* the search area stays at the top (below the menu bar) */
        .search-bar { position: sticky; top: 60px; z-index: 1020; padding: .6rem 0; background: var(--paper); border-bottom: 1px solid var(--line); }
        .search-bar .input-group { box-shadow: 0 .2rem .6rem rgba(60, 40, 20, .12); border-radius: 2rem; }
        .search-bar .input-group-text, .search-bar .form-control, .search-bar .btn { border-color: var(--field); background: #fffdf8; }
        .search-bar .input-group-text { border-radius: 2rem 0 0 2rem; }
        .search-bar .btn { border-radius: 0 2rem 2rem 0; background: var(--accent); border-color: var(--accent); color: #fff; padding: .375rem 1.2rem; }
        .search-bar .btn:hover { background: #8c2c22; border-color: #8c2c22; }
        .search-bar .form-control:focus { box-shadow: none; border-color: var(--accent); }
        .options { font-size: .85rem; margin-top: .5rem; }
        .options .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
        .options .form-select { font-size: .85rem; padding-top: .1rem; padding-bottom: .1rem; }

        .content-container { background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }
        .wiki-header-row { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
        .external-wiki-link { color: var(--muted); text-decoration: none; line-height: 1; position: relative; top: -0.1em; }
        .wiki-content img { max-width: 100%; height: auto; border-radius: .5rem; margin-bottom: 1.25rem; display: block; }

        /* the text of the article is set in the QATT font, everything it has no glyph for falls back to the usual font */
        .qatt-on { font-family: var(--qfont), system-ui, sans-serif; font-size: 1.6rem; line-height: 1.5; }
        .qatt-on ruby { ruby-position: over; }
        .qatt-on rt { font-family: system-ui, sans-serif; font-size: .4em; line-height: 1; color: var(--muted); user-select: none; }
        .no-reading rt { display: none; }
    </style>
</head>
<body>

    <header class="hero pt-5 pb-4">
        <div class="container text-center">
            <div class="han mb-2">國音新字</div>
            <h1 class="mb-3">QATT Wikipedia</h1>
            <p class="lead mx-auto mb-0">Read Vietnamese Wikipedia in Quốc Âm Tân Tự, with the reading above every character.</p>
        </div>
    </header>

    <div class="search-bar">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Tìm kiếm Wikipedia...">
                        <button id="searchBtn" class="btn" type="button">Tìm</button>
                    </div>
                </div>
            </div>
            <div class="options d-flex flex-wrap justify-content-center align-items-center gap-3">
                <div class="form-check form-switch m-0">
                    <input checked class="form-check-input" type="checkbox" role="switch" id="qattToggle">
                    <label class="form-check-label" for="qattToggle">Quốc Âm Tân Tự</label>
                </div>
                <div id="readingBox" class="form-check form-switch m-0">
                    <input checked class="form-check-input" type="checkbox" role="switch" id="readingToggle">
                    <label class="form-check-label" for="readingToggle">Quốc ngữ</label>
                </div>
                <select id="font" data-qatt-fonts class="form-select w-auto" aria-label="Font"></select>
            </div>
        </div>
    </div>

    <main class="container mb-5 mt-4">
        <div class="p-4 content-container border shadow-sm">
            <div id="loading" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Đang tải...</p>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none border-0" role="alert"></div>

            <div id="wikiArea">
                <div class="wiki-header-row">
                    <h1 id="wikiTitle" class="display-6 fw-bold mb-3"></h1>
                    <a id="wikiExternalLink" href="#" target="_blank" class="external-wiki-link mt-2" title="Mở trong Wikipedia">
                        <i class="bi bi-box-arrow-up-right fs-4"></i>
                    </a>
                </div>
                <div id="contentArea" class="wiki-content"></div>
            </div>
        </div>
    </main>

    <script src="js/fonts.js"></script>
    <script>
        const START_TERM = "Quốc Âm Tân Tự";
        const wikiLang = "vi";
        const parser = new VietnameseParser();

        const $ = id => document.getElementById(id);
        const searchInput = $('searchInput'), contentArea = $('contentArea'), wikiTitle = $('wikiTitle'), wikiExternalLink = $('wikiExternalLink');
        const qattToggle = $('qattToggle'), readingToggle = $('readingToggle'), errorMessage = $('errorMessage'), loading = $('loading');

        let currentWikiHtml = "";
        let originalTitle = "";

        // the default font of the page (fonts.js has already filled the dropdown)
        $('font').value = 'QATT Gothic';
        $('font').dispatchEvent(new Event('change'));

        // A text with its cells of QATT text wrapped in <ruby>: the cell is the base, the reading its annotation (QattText.reading, a dummy for now)
        function qattNodes(text) {
            const out = [];
            let last = 0;
            for (const { cell, index } of QattText.cells(text)) {
                if (index > last) out.push(text.slice(last, index));
                const ruby = document.createElement('ruby');
                ruby.append(cell, Object.assign(document.createElement('rt'), { textContent: QattText.reading(cell, parser) }));
                out.push(ruby);
                last = index + cell.length;
            }
            if (last < text.length) out.push(text.slice(last));
            return out;
        }

        // all Quốc Ngữ words of the text nodes below the container become QATT text (the font draws it), the cells get their reading
        function applyQatt(container) {
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
                acceptNode: n => ['script', 'style', 'ruby', 'rt', 'code', 'pre'].includes(n.parentElement.tagName.toLowerCase()) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
            });
            const nodes = [];
            let n; while (n = walker.nextNode()) if (n.nodeValue.trim()) nodes.push(n);
            for (const node of nodes) {
                const converted = QattText.convert(node.nodeValue, parser);
                if (converted !== node.nodeValue) node.replaceWith(...qattNodes(converted));
            }
        }

        async function fetchWiki(title, pushToHistory = true) {
            if (!title) return;
            const titleCasedTitle = title.trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
            setLoading(true);
            const url = `https://${wikiLang}.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(titleCasedTitle)}&format=json&origin=*&prop=text|displaytitle`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.error) throw new Error("Trang không tồn tại.");

                const newTitle = data.parse.title;
                currentWikiHtml = data.parse.text["*"];
                originalTitle = newTitle;

                if (pushToHistory && decodeURIComponent(location.hash.substring(1)) !== newTitle) {
                    history.pushState({ title: newTitle }, newTitle, "#" + encodeURIComponent(newTitle));
                }

                renderWiki();
                searchInput.value = newTitle;
            } catch (err) { showError(err.message); }
            finally { setLoading(false); }
        }

        function renderWiki() {
            wikiTitle.textContent = originalTitle;
            wikiExternalLink.href = `https://${wikiLang}.wikipedia.org/wiki/${encodeURIComponent(originalTitle.replace(/ /g, '_'))}`;

            let html = currentWikiHtml.replace(/src="\/\//g, 'src="https://').replace(/srcset="\/\//g, 'srcset="https://');
            html = html.replace(/src="\/([^/])/g, `src="https://${wikiLang}.wikipedia.org/$1`);
            contentArea.innerHTML = html;

            if (qattToggle.checked) {
                applyQatt(contentArea);
                applyQatt(wikiTitle);
            }
            for (const el of [contentArea, wikiTitle]) el.classList.toggle('qatt-on', qattToggle.checked);
            updateReading();
        }

        function updateReading() {
            $('readingBox').classList.toggle('d-none', !qattToggle.checked);
            for (const el of [contentArea, wikiTitle]) el.classList.toggle('no-reading', !readingToggle.checked);
        }

        function setLoading(isLoading) {
            loading.classList.toggle('d-none', !isLoading);
            if (isLoading) {
                $('wikiArea').classList.add('d-none');
                errorMessage.classList.add('d-none');
            } else {
                $('wikiArea').classList.remove('d-none');
            }
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('d-none');
        }

        // Browser navigation
        window.onpopstate = event => {
            const title = (event.state && event.state.title) || decodeURIComponent(location.hash.substring(1)) || START_TERM;
            searchInput.value = title;
            fetchWiki(title, false);
        };

        const searchBtn = $('searchBtn');
        searchBtn.addEventListener('click', () => {
            const val = searchInput.value.trim();
            if (val) fetchWiki(val, true);
        });
        searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchBtn.click(); });

        qattToggle.addEventListener('change', renderWiki);
        readingToggle.addEventListener('change', updateReading);

        contentArea.addEventListener('click', e => {
            const link = e.target.closest('a');
            const href = link?.getAttribute('href');
            if (!href) return;
            if ((href.startsWith('/wiki/') || href.includes('.wikipedia.org/wiki/')) && !href.includes(':')) {
                e.preventDefault();
                fetchWiki(decodeURIComponent(href.split('/wiki/')[1].split('#')[0]).replace(/_/g, ' '));
                window.scrollTo(0, 0);
            }
        });

        const initialTitle = decodeURIComponent(location.hash.substring(1)) || START_TERM;
        history.replaceState({ title: initialTitle }, initialTitle, "#" + encodeURIComponent(initialTitle));
        fetchWiki(initialTitle, false);
    </script>
</body>
</html>

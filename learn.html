<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn the QATT symbols</title>
  <meta name="description" content="Learn the 22 base shapes of Quốc Âm Tân Tự pair by pair, plain and with each of the six marking strokes, read aloud.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/navigation.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/qatt-text.js"></script>
  <style>
    :root { --qfont: "QATT Pen Medium"; --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; --row: 4.6rem; --step: 4s; }
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .hero .lead { max-width: 38rem; color: var(--bs-secondary-color); }

    .learn { max-width: 34rem; }
    .tools { flex-wrap: wrap; }

    /* the seven marks: a row of tabs with a sliding pill behind the active one */
    .marks { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: .25rem; padding: .3rem; border-radius: 1.1rem; background: color-mix(in srgb, currentColor 6%, transparent); color: var(--ink); }
    .marks .pill { position: absolute; top: .3rem; bottom: .3rem; left: 0; width: 0; border-radius: .85rem; background: var(--cinnabar); box-shadow: 0 .35rem 1rem color-mix(in srgb, var(--cinnabar) 40%, transparent); transition: transform .55s cubic-bezier(.65, 0, .35, 1), width .55s cubic-bezier(.65, 0, .35, 1); z-index: 0; }
    .marks button { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: .05rem; padding: .35rem 0 .3rem; border: 0; border-radius: .85rem; background: none; color: inherit; transition: color .35s; }
    .marks button:hover { color: var(--cinnabar); }
    .marks button.active { color: #fff; }
    .marks .g { font-family: var(--qfont), sans-serif; font-size: 1.7rem; line-height: 1.1; }
    .marks .n { font-size: .72rem; letter-spacing: .04em; opacity: .8; white-space: nowrap; }
    .progress-line { height: 3px; margin: .55rem .9rem 0; border-radius: 3px; background: color-mix(in srgb, currentColor 10%, transparent); overflow: hidden; color: var(--ink); }
    .progress-line > div { height: 100%; width: 0; background: var(--cinnabar); transition: width .9s cubic-bezier(.65, 0, .35, 1); }

    /* the board: 11 rows of two shapes, the band lies across the pair being read */
    .board { position: relative; padding: .6rem 0; color: var(--ink); }
    .row-pair { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 9rem 1fr; align-items: center; height: var(--row); cursor: pointer; transition: opacity .6s; }
    .row-pair .g { font-family: var(--qfont), sans-serif; font-size: 3.1rem; line-height: 1; text-align: center; transition: color .6s, transform .6s cubic-bezier(.34, 1.56, .64, 1), opacity .6s; opacity: .55; }
    .row-pair.done .g { opacity: .3; }
    .row-pair.now .g { opacity: 1; color: var(--cinnabar); transform: scale(1.18); }
    .row-pair:hover .g { opacity: .9; }
    .row-pair .g.in { animation: glyphIn .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 35ms); }
    @keyframes glyphIn { from { opacity: 0; transform: translateY(.5rem) scale(.85); filter: blur(4px); } }

    .band { position: absolute; z-index: 2; left: .5rem; right: .5rem; top: .6rem; height: var(--row); pointer-events: none; border-radius: 1.2rem;
      background: linear-gradient(90deg, color-mix(in srgb, var(--cinnabar) 9%, transparent), color-mix(in srgb, var(--cinnabar) 16%, transparent) 50%, color-mix(in srgb, var(--cinnabar) 9%, transparent));
      border: 1px solid color-mix(in srgb, var(--cinnabar) 35%, transparent);
      box-shadow: 0 .6rem 1.6rem -.6rem color-mix(in srgb, var(--cinnabar) 45%, transparent), inset 0 1px 0 color-mix(in srgb, #fff 45%, transparent);
      transition: transform .9s cubic-bezier(.65, 0, .35, 1); overflow: hidden; }
    .band .say { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 9rem 1fr; align-items: center; }
    .band .pair { grid-column: 2; display: flex; justify-content: center; align-items: baseline; gap: .55rem; font-family: Georgia, "Times New Roman", serif; font-size: 1.55rem; white-space: nowrap; color: var(--ink); }
    .band .pair .dot { color: var(--cinnabar); opacity: .7; font-size: 1rem; }
    .band .pair span.r { display: inline-block; }
    .band .pair.in span.r { animation: sayIn .5s cubic-bezier(.2, .8, .2, 1) both; }
    .band .pair.in span.r + .dot + span.r { animation-delay: .12s; }
    @keyframes sayIn { from { opacity: 0; transform: translateY(.6rem); filter: blur(3px); } }
    .band .tick { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; transform-origin: left; transform: scaleX(0); background: var(--cinnabar); opacity: .55; }
    .band .tick.run { animation: tick var(--step) linear forwards; }
    @keyframes tick { to { transform: scaleX(1); } }
    .band .speaking { position: absolute; top: 50%; right: 1rem; transform: translateY(-50%); color: var(--cinnabar); opacity: 0; transition: opacity .3s; }
    .band.voice .speaking { opacity: .8; }

    .play { width: 3.2rem; height: 3.2rem; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .round { width: 2.4rem; height: 2.4rem; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.15rem; }
    .hint { font-size: .85rem; color: var(--bs-secondary-color); }

    @media (max-width: 420px) {
      :root { --row: 4rem; }
      .row-pair, .band .say { grid-template-columns: 1fr 7.5rem 1fr; }
      .row-pair .g { font-size: 2.6rem; }
      .band .pair { font-size: 1.25rem; }
      .marks .n { font-size: .62rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .band, .marks .pill, .row-pair .g { transition-duration: .01s; }
      .row-pair .g.in, .band .pair.in span.r { animation: none; }
    }
  </style>
</head>
<body>
<header class="hero pt-5 pb-4">
  <div class="container text-center">
    <h1 class="mb-3" data-vi="Học ký hiệu">Learn the symbols</h1>
    <p class="lead mx-auto mb-0" data-vi="22 hình cơ bản, từng cặp một, được đọc to.">The 22 base shapes, pair by pair, read aloud.</p>
  </div>
</header>

<main class="container py-4" id="content">
  <div class="learn mx-auto">
    <div class="d-flex justify-content-center align-items-center gap-2 tools mb-3">
      <select id="decoding" class="form-select form-select-sm w-auto" aria-label="Reading of the rhyme table"><optgroup label="Choose decoding" data-vi-label="Lựa chọn cách giải mã"><option value="qatt" selected>qatt.org</option><option value="omniglot">omniglot.com</option></optgroup></select>
      <select id="font" data-qatt-fonts data-qatt-default="QATT Pen" class="form-select form-select-sm w-auto" aria-label="Font"></select>
    </div>

    <div class="marks" id="marks" role="tablist" aria-label="Marking stroke"><div class="pill" id="pill"></div></div>
    <div class="progress-line" aria-hidden="true"><div id="progress"></div></div>

    <div class="card-box board mt-3" id="board">
      <div class="band" id="band" aria-live="polite">
        <div class="say"><div class="pair" id="say"></div></div>
        <i class="bi bi-volume-up-fill speaking"></i>
        <div class="tick" id="tick"></div>
      </div>
    </div>

    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button type="button" class="btn btn-quiet round" id="prev" aria-label="Previous pair" data-vi-aria-label="Cặp trước"><i class="bi bi-skip-backward-fill"></i></button>
      <button type="button" class="btn btn-cinnabar play" id="play" aria-label="Play" data-vi-aria-label="Phát"><i class="bi bi-play-fill"></i></button>
      <button type="button" class="btn btn-quiet round" id="next" aria-label="Next pair" data-vi-aria-label="Cặp sau"><i class="bi bi-skip-forward-fill"></i></button>
      <button type="button" class="btn btn-quiet round" id="sound" aria-label="Sound on or off" data-vi-aria-label="Bật hoặc tắt tiếng" aria-pressed="true"><i class="bi bi-volume-up-fill"></i></button>
    </div>
    <p class="hint text-center mt-3 mb-0"><span data-vi="Nhấn vào một dòng để đến cặp đó. Phím cách: phát / dừng, mũi tên: cặp và nét đánh dấu.">Click a row to go to that pair. Space: play / pause, arrows: pair and marking stroke.</span></p>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SHAPES = VietnameseParser.SHAPES;                       // l z ng h g c tr d … in the order of the rhyme tables
  const PAIRS = [];
  for (let i = 0; i < SHAPES.length; i += 2) PAIRS.push([SHAPES[i], SHAPES[i + 1]]);
  const CHUNOM_SITE = 'https://chunom.org/';
  const STEP = 4000;                                            // ms per pair
  const code = s => s === 'z' ? '_' : s;
  const glyph = (shape, mark) => QattText.syllable(code(shape) + (mark || '') + ',,,0');
  const BARE = { z: 'ʔ', d: 'đ', dz: 'd' };                       // the plain shape alone is its consonant
  const parser = new VietnameseParser('qatt');

  // the reading of a shape with a marking stroke, as a cell alone: { show, speak }
  const reading = (shape, mark) => {
    if (!mark) {
      const c = BARE[shape] ?? shape;
      return { show: c, speak: shape === 'z' ? '' : c + 'ờ' };      // consonants are named with ờ (lờ, ngờ, đờ)
    }
    const r = QattText.reading(glyph(shape, mark), parser);
    return { show: r, speak: r === '?' ? '' : r };
  };

  let mark = 0, row = 0, playing = false, timer = null, sound = true;
  try { sound = localStorage.getItem('qattLearnSound') !== '0'; } catch (e) {}

  // the tabs
  const LABELS = [['Plain', 'Không nét'], ['1'], ['2'], ['3'], ['4'], ['5'], ['6']];
  const tabs = LABELS.map(([en, vi], m) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab');
    const g = document.createElement('span'); g.className = 'g'; g.textContent = glyph('l', m);
    const n = document.createElement('span'); n.className = 'n'; n.textContent = en; if (vi) n.dataset.vi = vi;
    if (m) b.setAttribute('aria-label', 'Marking stroke ' + m);
    b.append(g, n);
    b.addEventListener('click', () => { setMark(m, true); row = 0; go(); });
    $('marks').append(b);
    return b;
  });

  // the rows
  const rows = PAIRS.map((pair, r) => {
    const div = document.createElement('div'); div.className = 'row-pair';
    const a = document.createElement('div'), gap = document.createElement('div'), b = document.createElement('div');
    a.className = b.className = 'g'; a.style.setProperty('--i', r); b.style.setProperty('--i', r);
    div.append(a, gap, b);
    div.addEventListener('click', () => { row = r; go(); });
    $('board').append(div);
    return { div, cells: [a, b] };
  });

  const placePill = () => {
    const t = tabs[mark], box = $('marks').getBoundingClientRect(), tb = t.getBoundingClientRect();
    $('pill').style.width = tb.width + 'px';
    $('pill').style.transform = `translateX(${tb.left - box.left}px)`;
  };

  const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

  function setMark(m, animate) {
    mark = (m + 7) % 7;
    tabs.forEach((t, i) => { t.classList.toggle('active', i === mark); t.setAttribute('aria-selected', i === mark); });
    placePill();
    rows.forEach((rw, r) => rw.cells.forEach((c, k) => {
      c.textContent = glyph(PAIRS[r][k], mark);
      if (animate) restart(c, 'in');
    }));
  }

  // speech of the Chunom site (decks/audiomanager.js: the browser voice, else Google TTS), as in spell.html
  let speaker = null, speakerLoad = null;
  const withSpeaker = fn => {
    const go = () => { speaker = speaker || new AudioManager(new Audio(), {}); fn(speaker); };
    if (typeof AudioManager !== 'undefined') return go();
    if (!speakerLoad) {
      speakerLoad = [];
      const sc = document.createElement('script');
      sc.src = CHUNOM_SITE + 'chunom/decks/audiomanager.js';
      sc.onload = () => speakerLoad.forEach(f => f());
      document.head.append(sc);
    }
    speakerLoad.push(go);
  };
  const say = text => {
    if (!sound || !text) return;
    $('band').classList.add('voice'); setTimeout(() => $('band').classList.remove('voice'), 1400);
    withSpeaker(sp => sp.speak(text, 'auto', 0.8));
  };

  // show the band on the current row (and read it aloud while playing)
  function show(speak) {
    $('band').style.transform = `translateY(calc(${row} * var(--row)))`;
    rows.forEach((rw, r) => { rw.div.classList.toggle('now', r === row); rw.div.classList.toggle('done', r < row); });
    const [ra, rb] = PAIRS[row].map(s => reading(s, mark));
    const pair = $('say');
    const span = t => { const s = document.createElement('span'); s.className = 'r'; s.lang = 'vi'; s.textContent = t; return s; };
    const dot = document.createElement('span'); dot.className = 'dot'; dot.textContent = '·';
    pair.replaceChildren(span(ra.show), dot, span(rb.show));
    restart(pair, 'in');
    $('progress').style.width = ((row + 1) / PAIRS.length * 100) + '%';
    const tick = $('tick');
    tick.classList.remove('run'); void tick.offsetWidth;
    if (playing) tick.classList.add('run');
    if (playing) rows[row].div.scrollIntoView({ block: 'nearest', behavior: 'smooth' });   // keep the band on the screen (phones)
    if (speak) setTimeout(() => say([ra.speak, rb.speak].filter(Boolean).join(', ')), 350);   // when the band has nearly arrived
  }

  function schedule() {
    clearTimeout(timer);
    if (!playing) return;
    timer = setTimeout(() => {
      if (row < PAIRS.length - 1) { row++; show(true); schedule(); return; }
      row = 0; setMark(mark + 1, true);                           // end of the column: the next marking stroke
      show(true); schedule();
    }, STEP);
  }

  function go() { show(playing); schedule(); }

  function setPlaying(on) {
    playing = on;
    $('play').firstElementChild.className = 'bi ' + (on ? 'bi-pause-fill' : 'bi-play-fill');
    $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
    $('play').dataset.viAriaLabel = on ? 'Tạm dừng' : 'Phát';
    go();
  }

  const step = d => {
    row += d;
    if (row >= PAIRS.length) { row = 0; setMark(mark + 1, true); }
    if (row < 0) { row = PAIRS.length - 1; setMark(mark - 1, true); }
    go();
  };

  const showSound = () => {
    $('sound').setAttribute('aria-pressed', sound);
    $('sound').firstElementChild.className = 'bi ' + (sound ? 'bi-volume-up-fill' : 'bi-volume-mute-fill');
  };

  $('play').addEventListener('click', () => setPlaying(!playing));
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  $('sound').addEventListener('click', () => {
    sound = !sound; showSound();
    try { localStorage.setItem('qattLearnSound', sound ? '1' : '0'); } catch (e) {}
  });
  $('decoding').addEventListener('change', e => { parser.setDecoding(e.target.value); show(false); });
  document.addEventListener('keydown', e => {
    if (e.target.closest('select, input, textarea')) return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { setMark(mark + 1, true); row = 0; go(); }
    else if (e.key === 'ArrowLeft') { setMark(mark - 1, true); row = 0; go(); }
  });
  window.addEventListener('resize', placePill);
  document.fonts && document.fonts.ready.then(placePill);

  const want = new URLSearchParams(location.search).get('decoding');
  if (want && [...$('decoding').options].some(o => o.value === want)) { $('decoding').value = want; parser.setDecoding(want); }
  showSound();
  setMark(0, true);
  show(false);
})();
</script>
</body>
</html>

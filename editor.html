<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type QATT</title>
  <meta name="description" content="Type Vietnamese and it turns into Quốc Âm Tân Tự text for the QATT fonts.">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <style>
    :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; --qfont: "QATT Pen Medium"; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: var(--bs-secondary-color); }
    @media (max-width: 575.98px) { .hero .han { letter-spacing: .3em; } }
    main { max-width: 62rem; margin: 0 auto; padding: 0 1rem 3rem; }
    a { color: var(--accent); }
    /* the writing card (.card-box: the panel of the theme); the parts inside are in js/qatt-writer.js */
    .card-box { background: #fff; border: 1px solid var(--line); border-radius: 1rem; box-shadow: 0 .5rem 1.5rem rgba(60, 40, 20, .08); }
    @media (max-width: 575.98px) {
      .hero { padding-top: 1.2rem !important; padding-bottom: .8rem !important; margin-bottom: .8rem !important; }
      .hero .lead, .hero .btn { display: none; }
    }
  </style>
  <script src="js/navigation.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/qatt-text.js"></script>
  <script src="js/fonts.js"></script>   <!-- the QATT fonts (QATT_FONTS) and their @font-face rules -->
  <script defer src="https://chunom.org/chunom/js/ime.js"></script>
  <script src="js/qatt-writer.js"></script>
</head>
<body>
<header class="hero pt-5 pb-4 mb-4">
  <div class="container text-center">
    <div class="han mb-2">國音新字</div>
    <h1 class="mb-3" data-vi="Gõ chữ QATT">Type QATT</h1>
    <p class="lead mx-auto mb-4" data-vi="Gõ tiếng Việt (Quốc Ngữ). Mỗi từ gõ xong sẽ thành chữ QATT.">Type Vietnamese (Quốc Ngữ). Every finished word becomes QATT text.</p>
    <a class="btn btn-cinnabar btn-pill" href="symbols.html" data-vi="Bảng chữ">Symbol table</a>
    <a class="btn btn-cinnabar btn-pill" href="decodings.html" data-vi="Giải mã">Decodings</a>
  </div>
</header>
<main>
  <div id="writer" class="card-box writer"></div>
</main>

<script>
  window.addEventListener('DOMContentLoaded', () => QattWriter.mount(document.getElementById('writer'), { switch: 'nom', storage: 'qatt_editor_' }));
</script>
</body>
</html>

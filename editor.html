<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QATT Editor | Qatt.org</title>
    <meta name="description" content="Type Vietnamese and see it written in Quốc Âm Tân Tự.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script defer src="js/navigation.js"></script>
    <script defer src="js/parser.js"></script>
    <script defer src="js/qatt.js"></script>
    <script defer src="../chunom/js/ime.js"></script>

    <style>
        :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --glyph: 3rem; }

        body {
            background: linear-gradient(180deg, var(--paper) 0, #fffdf8 16rem) no-repeat, #fffdf8;
            color: var(--ink);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        .editor-head h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(1.7rem, 6vw, 2.4rem); }
        .editor-head .han { color: var(--accent); letter-spacing: .5em; padding-left: .5em; font-size: 1.05rem; }
        .editor-head p { color: #5b4d3d; max-width: 36rem; margin-inline: auto; }

        /* the two panes: what you type and what it looks like */
        .editor {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 1rem;
            box-shadow: 0 .5rem 1.5rem rgba(60, 40, 20, .08);
            overflow: hidden;
        }
        .pane-title { padding: .5rem 1rem .1rem; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: #9a8a70; }

        #source {
            display: block;
            width: 100%;
            min-height: 8rem;
            padding: .4rem 1rem .8rem;
            font-size: 1.35rem;
            line-height: 1.5;
            border: none;
            outline: none;
            background: transparent;
            color: var(--ink);
            resize: vertical;
        }

        .output-pane { border-top: 1px solid var(--line); background: #fffdf8; }
        #output { padding: .4rem 1rem 1rem; min-height: 9rem; line-height: 1.2; overflow-wrap: anywhere; }
        #output .empty { color: #9a8a70; font-size: .95rem; padding-top: .4rem; }
        #output .line { margin-bottom: .3rem; min-height: calc(var(--glyph) * .8); }
        #output .word { display: inline-block; white-space: nowrap; margin: 0 calc(var(--glyph) * .22) .5rem 0; text-align: center; vertical-align: top; }
        #output .plain { display: inline-block; font-size: calc(var(--glyph) * .55); margin: 0 .15em .5rem 0; vertical-align: top; padding-top: calc(var(--glyph) * .35); white-space: pre-wrap; }
        #output qatt-code { font-size: var(--glyph); }
        #output qatt-code svg { height: 1.2em; width: auto; stroke: currentColor; stroke-width: 1.5px; stroke-linecap: round; fill: none; display: inline-block; vertical-align: top; }
        #output .reading { display: block; font-size: .72rem; color: #8a7a62; margin-top: .1rem; }
        body:not(.show-reading) #output .reading { display: none; }

        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .5rem .8rem; border-top: 1px solid var(--line); background: #fcf8ee; }
        .bar .btn { border-radius: 2rem; font-size: .85rem; padding: .25rem .85rem; }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-accent:hover, .btn-accent:focus-visible { background: #8c2c22; border-color: #8c2c22; color: #fff; }
        .btn-quiet { border-color: #cdbf9f; color: #5b4d3d; background: #fff; }
        .btn-quiet:hover { background: #f1e8d2; color: var(--ink); border-color: #b9a982; }
        .bar .form-check { margin: 0; }
        .bar .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
        .bar .form-check-label, .bar label { font-size: .88rem; color: #5b4d3d; }
        .bar .form-range { width: 7.5rem; accent-color: var(--accent); }

        @media (min-width: 992px) {
            .editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-rows: 1fr auto; }
            .input-pane { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; }
            #source { flex: 1; min-height: 18rem; resize: none; }
            .output-pane { grid-column: 2; grid-row: 1 / span 2; border-top: none; border-left: 1px solid var(--line); }
            #output { min-height: 22rem; }
            .bar { grid-column: 1; grid-row: 2; }
        }
    </style>
</head>
<body>

<div class="container py-3 pb-5" style="max-width: 68rem">

    <header class="editor-head text-center my-3">
        <div class="han">國音新字</div>
        <h1 class="mb-1">QATT Editor</h1>
        <p class="mb-0">Type Vietnamese and watch it turn into Quốc Âm Tân Tự.</p>
    </header>

    <div class="editor">
        <section class="input-pane">
            <div class="pane-title">Vietnamese</div>
            <textarea id="source" placeholder="Type here, for example: Quốc âm tân tự" aria-label="Vietnamese text" lang="vi"
                      spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        </section>

        <section class="output-pane">
            <div class="pane-title">Quốc Âm Tân Tự</div>
            <div id="output" aria-live="polite"></div>
        </section>

        <div class="bar">
            <button type="button" class="btn btn-accent" id="copy-btn"><i class="bi bi-clipboard"></i> Copy codes</button>
            <button type="button" class="btn btn-quiet" id="example-btn"><i class="bi bi-magic"></i> Example</button>
            <button type="button" class="btn btn-quiet" id="clear-btn"><i class="bi bi-x-lg"></i> Clear</button>
            <div class="d-flex align-items-center gap-2 ms-lg-auto">
                <label for="size">Size</label>
                <input type="range" class="form-range" id="size" min="1.6" max="6" step="0.2" value="3">
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="reading-toggle">
                <label class="form-check-label" for="reading-toggle">Show reading</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="telex-toggle">
                <label class="form-check-label" for="telex-toggle">Telex</label>
            </div>
        </div>
    </div>

    <p class="small text-secondary mt-3 mb-0 text-center">
        Each syllable becomes one glyph: the onset on the left, the rhyme on the right, the tone as a small mark in a corner.
        Words that cannot be read as Vietnamese stay as they are.
    </p>
</div>

<script>
    window.addEventListener('load', () => {
        const $ = id => document.getElementById(id);
        const source = $('source'), output = $('output');
        const store = {
            get(key, fallback) { try { const v = localStorage.getItem('qatt_editor_' + key); return v === null ? fallback : v; } catch { return fallback; } },
            set(key, value) { try { localStorage.setItem('qatt_editor_' + key, value); } catch { /* storage may be blocked */ } }
        };

        const parser = new VietnameseParser(); // the decoding of the glyphs: new VietnameseParser('qatt') is the default, see VietnameseParser.DECODINGS
        new Qatt().observe('qatt-code');

        // ---------- text -> glyphs ----------
        const WORD = /[\p{L}\p{M}]+/gu;

        // one <span class="word"> per syllable (glyph and, optionally, its reading), plain text for everything else
        function renderLine(line) {
            const row = document.createElement('div');
            row.className = 'line';
            let last = 0;
            const plain = text => {
                if (!text) return;
                const span = document.createElement('span');
                span.className = 'plain';
                span.textContent = text;
                row.append(span);
            };
            for (const m of line.matchAll(WORD)) {
                plain(line.slice(last, m.index));
                last = m.index + m[0].length;
                const parsed = parser.parse(m[0]);
                if (!parsed?.qatt) { plain(m[0]); continue; } // not Vietnamese, or a rhyme the decoding has no glyph for: stays as text
                const word = document.createElement('span');
                word.className = 'word';
                const code = document.createElement('qatt-code');
                code.textContent = parsed.qatt;
                const reading = document.createElement('span');
                reading.className = 'reading';
                reading.textContent = m[0];
                word.append(code, reading);
                row.append(word);
            }
            plain(line.slice(last));
            return row;
        }

        function codesOf(text) {
            return text.split('\n').map(line => [...line.matchAll(WORD)].map(m => parser.parse(m[0])?.qatt ?? m[0]).join(' ')).join('\n');
        }

        let frame = 0;
        function render() {
            cancelAnimationFrame(frame);
            frame = requestAnimationFrame(() => {
                const text = source.value;
                if (!text.trim()) {
                    output.innerHTML = '<div class="empty">The glyphs appear here as you type.</div>';
                    return;
                }
                output.replaceChildren(...text.split('\n').map(renderLine));
            });
        }

        source.addEventListener('input', () => { store.set('text', source.value); render(); });

        // ---------- Telex (typing Vietnamese on a keyboard without a Vietnamese layout) ----------
        const telexToggle = $('telex-toggle');
        telexToggle.checked = store.get('telex', matchMedia('(pointer: coarse)').matches ? 'false' : 'true') === 'true';
        const ime = window.VietIme ? new VietIme(source, { telex: telexToggle.checked, candidates: false }) : null;
        if (!ime) telexToggle.closest('.form-check').hidden = true;
        telexToggle.addEventListener('change', () => {
            store.set('telex', telexToggle.checked);
            ime?.update({ telex: telexToggle.checked });
            source.focus();
        });

        // ---------- options ----------
        const size = $('size');
        const setSize = v => document.documentElement.style.setProperty('--glyph', `${v}rem`);
        size.value = store.get('size', '3');
        setSize(size.value);
        size.addEventListener('input', () => { setSize(size.value); store.set('size', size.value); });

        const reading = $('reading-toggle');
        reading.checked = store.get('reading', 'false') === 'true';
        document.body.classList.toggle('show-reading', reading.checked);
        reading.addEventListener('change', () => {
            document.body.classList.toggle('show-reading', reading.checked);
            store.set('reading', reading.checked);
        });

        // ---------- buttons ----------
        const copyBtn = $('copy-btn');
        copyBtn.addEventListener('click', async () => {
            const label = copyBtn.innerHTML, text = codesOf(source.value);
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const area = Object.assign(document.createElement('textarea'), { value: text });
                document.body.append(area);
                area.select();
                document.execCommand('copy');
                area.remove();
            }
            copyBtn.innerHTML = '<i class="bi bi-check-lg"></i> Copied';
            setTimeout(() => { copyBtn.innerHTML = label; }, 1400);
        });

        $('example-btn').addEventListener('click', () => {
            source.value = 'Quốc âm tân tự\nChữ Nôm của người Việt';
            source.dispatchEvent(new Event('input', { bubbles: true }));
            source.focus();
        });

        $('clear-btn').addEventListener('click', () => {
            source.value = '';
            source.dispatchEvent(new Event('input', { bubbles: true }));
            source.focus();
        });

        source.value = store.get('text', '');
        render();
    });
</script>

</body>
</html>

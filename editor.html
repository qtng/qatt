<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type QATT</title>
  <meta name="description" content="Type Vietnamese and it turns into Quốc Âm Tân Tự text for the QATT fonts.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <style>
    :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; --qfont: "QATT Mincho"; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    .btn-pill { border-radius: 2rem; padding: .5rem 1.3rem; }
    .btn-cinnabar { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-cinnabar:hover { background: #8c2c22; border-color: #8c2c22; color: #fff; }
    @media (max-width: 575.98px) { .hero .han { letter-spacing: .3em; } }
    main { max-width: 56rem; margin: 0 auto; padding: 1.2rem 1rem 1.5rem; }
    a { color: var(--accent); }
    .card-box { margin: 0 0 .4rem; padding: .5rem .7rem .6rem; background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }
    /* all controls centred in one row, the slider gives way on a narrow screen */
    .bar { display: flex; flex-wrap: nowrap; justify-content: center; gap: .4rem 1.2rem; align-items: center; margin: 0 0 .5rem; font-size: .78rem; }
    .bar .group { display: flex; align-items: center; gap: .4rem .8rem; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
    .bar .group select { min-width: 0; }
    .bar .sizebox { flex: 1 1 8rem; max-width: 15rem; min-width: 5rem; }
    .bar select { font-size: .78rem; padding-top: .1rem; padding-bottom: .1rem; }
    .bar label { display: flex; align-items: center; gap: .3rem; white-space: nowrap; margin: 0; }
    .bar input[type=range] { flex: 1 1 auto; width: 0; min-width: 2.5rem; max-width: 200px; accent-color: var(--accent); }
    #sizeLabel { min-width: 2.6em; color: var(--muted); }
    #field { display: block; width: 100%; min-height: 12rem; resize: vertical; border: 1px solid var(--field); border-radius: .5rem; background: #fffdf8; padding: .2rem .6rem; color: var(--ink);
      font-family: var(--qfont), system-ui, sans-serif; font-size: 48px; line-height: 1.15; }
    #field:focus { outline: 2px solid rgba(168, 54, 42, .35); }
    #pending { margin-top: .2rem; min-height: 2.4rem; display: flex; align-items: center; gap: .8rem; font-size: .85rem; color: var(--muted); }
    #pending .glyph { font-family: var(--qfont); font-size: 1.8rem; line-height: 1; color: var(--ink); }
    #pending .word { font-style: italic; }
    .telex { display: flex; justify-content: center; margin-top: .3rem; font-size: .78rem; }
    .telex label { display: flex; align-items: center; gap: .3rem; margin: 0; }
    .keys { display: flex; gap: .4rem; margin-top: .2rem; }
    .keys .btn { flex: 1 1 0; }
  </style>
  <script defer src="js/navigation.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/qatt-text.js"></script>
  <script defer src="../chunom/js/ime.js"></script>
</head>
<body>
<header class="hero pt-5 pb-4 mb-4">
  <div class="container text-center">
    <div class="han mb-2">國音新字</div>
    <h1 class="mb-3">Type QATT</h1>
    <p class="lead mx-auto mb-4">Type Vietnamese (Quốc Ngữ). Every finished word turns into text for the <a href="font.html">QATT fonts</a>.</p>
    <a class="btn btn-cinnabar btn-pill" href="symbols.html">Open the symbols</a>
    <a class="btn btn-cinnabar btn-pill" href="decodings.html">Open the decodings</a>
  </div>
</header>
<main>
  <div class="card-box">
    <div class="bar">
      <div class="group">
        <select id="decoding" autocomplete="off" class="form-select form-select-sm w-auto" aria-label="Reading of the rhyme table" title="Reading of the rhyme table (decodings.html)"></select>
        <select id="font" data-qatt-fonts autocomplete="off" class="form-select form-select-sm w-auto" aria-label="Font"></select>
      </div>
      <label class="sizebox"><input type="range" id="size" min="50" max="400" step="10" value="100" autocomplete="off" aria-label="Size"><span id="sizeLabel">100%</span></label>
    </div>
    <textarea id="field" lang="vi" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Text" placeholder="Input Quốc Ngữ..."></textarea>
    <div class="telex"><label><input type="checkbox" id="telex" autocomplete="off"> Telex</label></div>
    <div id="pending" aria-live="polite"></div>
    <div class="keys">
      <button type="button" class="btn btn-sm btn-outline-secondary" id="convert" title="Convert every Quốc Ngữ word in the field, e.g. after pasting">Convert all</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="copy">Copy</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="clear">Clear</button>
    </div>
  </div>
</main>

<script src="js/fonts.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const $ = id => document.getElementById(id);
    const field = $('field'), pending = $('pending');
    const parser = new VietnameseParser();
    const NOT_LETTER = /[^\p{L}\p{M}]/u, WORD_END = /[\p{L}\p{M}]+$/u;

    // decodings (readings of the rhyme table)
    for (const [name, label] of [['qatt', 'qatt.org'], ['omniglot', 'omniglot']]) $('decoding').append(new Option(label, name, name === 'qatt', name === 'qatt'));
    $('decoding').addEventListener('change', () => { parser.setDecoding($('decoding').value); showPending(); field.focus(); });

    // size: 100% is 33 pixels
    const applySize = () => { field.style.fontSize = Math.round($('size').value * 0.33) + 'px'; $('sizeLabel').textContent = $('size').value + '%'; };
    $('size').addEventListener('input', applySize);
    applySize();

    // Telex (typing Vietnamese on a keyboard without a Vietnamese layout)
    $('telex').checked = true;
    const ime = window.VietIme ? new VietIme(field, { telex: $('telex').checked, candidates: false }) : null;
    if (!ime) $('telex').closest('label').hidden = true;
    $('telex').addEventListener('change', () => { ime?.update({ telex: $('telex').checked }); field.focus(); });

    // the word that ends right before position `end` is replaced by its QATT characters (if there are any)
    const convertBefore = end => {
      const m = WORD_END.exec(field.value.slice(0, end));
      if (!m) return false;
      const text = QattText.word(m[0], parser);
      if (!text) return false;
      const start = end - m[0].length, caret = field.selectionStart;
      field.setRangeText(text, start, end, 'end');
      const at = caret + text.length - m[0].length;
      field.setSelectionRange(at, at);
      return true;
    };

    // ---------- keeping the cells whole ----------
    // A cell is what the font draws as one square: a letter of the block (U+F0000..U+F0099), a joiner U+F009B or combiner U+F009A with
    // another letter, and the tone marks U+F009C..U+F00A3 after it. Any other character is a cell of its own.
    const LETTER = c => c >= 0xF0000 && c <= 0xF0099, JOINER = 0xF009B, COMBINER = 0xF009A;
    const CELL = /[\u{F0000}-\u{F0099}](?:[\u{F009A}\u{F009B}][\u{F0000}-\u{F0099}])*[\u{F009C}-\u{F00A3}]*|[\u{F009A}-\u{F00A3}]+|[^]/gu;
    const WINDOW = 64;
    // the cell that ends after the position ('before'), starts before it ('after') or contains it (no `which`): {start, end}
    const cellAt = (text, pos, which) => {
      const from = Math.max(0, pos - WINDOW), part = text.slice(from, pos + WINDOW);
      for (const m of part.matchAll(CELL)) {
        const start = from + m.index, end = start + m[0].length;
        if (which === 'before' ? (start < pos && pos <= end) : which === 'after' ? (start <= pos && pos < end) : (start < pos && pos < end)) return { start, end };
      }
      return null;
    };
    // Removes the joiners and combiners that join nothing: a joiner needs a letter that is still an onset before it and a letter after it
    // (B J B J B: the second joiner is left over, the first pair is a cell already), a combiner needs a letter on both sides.
    const tidy = () => {
      const text = field.value, caret = field.selectionStart, end = field.selectionEnd;
      const cps = Array.from(text, ch => ch.codePointAt(0));
      let out = '', open = false, prev = 0, i = 0, dropBeforeStart = 0, dropBeforeEnd = 0;
      cps.forEach((c, k) => {
        const next = cps[k + 1], len = c > 0xFFFF ? 2 : 1;
        let keep = true;
        if (LETTER(c)) open = prev !== JOINER && prev !== COMBINER;
        else if (c === JOINER) { keep = open && LETTER(next); open = false; }
        else if (c === COMBINER) { keep = LETTER(prev) && LETTER(next); open = false; }
        else open = false;
        if (keep) { out += String.fromCodePoint(c); prev = c; }
        else { if (i < caret) dropBeforeStart += len; if (i < end) dropBeforeEnd += len; }
        i += len;
      });
      if (out === text) return;
      field.value = out;
      field.setSelectionRange(caret - dropBeforeStart, end - dropBeforeEnd);
    };

    // Backspace and Delete remove a whole cell
    field.addEventListener('beforeinput', e => {
      if (e.isComposing || (e.inputType !== 'deleteContentBackward' && e.inputType !== 'deleteContentForward')) return;
      const pos = field.selectionStart;
      if (pos !== field.selectionEnd) return;
      const cell = cellAt(field.value, pos, e.inputType === 'deleteContentBackward' ? 'before' : 'after');
      if (!cell || field.value.codePointAt(cell.start) < 0xF0000) return;   // other text: as usual
      e.preventDefault();
      field.setRangeText('', cell.start, cell.end, 'end');
      field.setSelectionRange(cell.start, cell.start);
      tidy();
      showPending();
    });

    // the cursor (and the ends of a selection) never sit inside a cell: it jumps to the end of the cell when it moved forward, else to its start
    let lastPos = 0;
    const snap = () => {
      if (document.activeElement !== field) return;
      let a = field.selectionStart, b = field.selectionEnd;
      if (a === b) {
        const cell = cellAt(field.value, a);
        if (cell) a = b = a > lastPos ? cell.end : cell.start;
      } else {
        a = cellAt(field.value, a)?.start ?? a;
        b = cellAt(field.value, b)?.end ?? b;
      }
      if (a !== field.selectionStart || b !== field.selectionEnd) field.setSelectionRange(a, b, field.selectionDirection);
      lastPos = field.selectionStart;
    };

    // the character just typed (space, Enter, ...) ends the word before it; when the word was converted, that character is swallowed
    const flush = length => {
      const pos = field.selectionStart;
      if (pos !== field.selectionEnd || pos < length) return;
      if (!NOT_LETTER.test(field.value.slice(pos - length, pos)) || !convertBefore(pos - length)) return;
      const at = field.selectionStart;
      field.setRangeText('', at - length, at, 'end');
    };
    field.addEventListener('input', e => {
      if (!e.isComposing && (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph')) flush(1);
      else if (!e.isComposing && e.inputType === 'insertText' && e.data && NOT_LETTER.test(e.data)) flush(e.data.length);
      if (!e.isComposing) tidy();
      showPending();
    });
    // keyboards that compose whole words (Android): the space comes with the end of the composition
    field.addEventListener('compositionend', e => setTimeout(() => {
      if (e.data && NOT_LETTER.test(e.data.slice(-1))) flush(1);
      tidy();
      showPending();
    }, 0));

    // the word being typed and how it will look
    function showPending() {
      const pos = field.selectionStart, m = pos === field.selectionEnd && WORD_END.exec(field.value.slice(0, pos));
      pending.replaceChildren();
      if (!m) return;
      const text = QattText.word(m[0], parser);
      const word = Object.assign(document.createElement('span'), { className: 'word', textContent: m[0] });
      pending.append(word);
      if (text) pending.append('→', Object.assign(document.createElement('span'), { className: 'glyph', textContent: text }));
      else pending.append(' (no QATT letter yet)');
    }
    document.addEventListener('selectionchange', () => { snap(); if (document.activeElement === field) showPending(); });

    $('convert').addEventListener('click', () => { field.value = QattText.convert(field.value, parser); showPending(); field.focus(); });
    $('clear').addEventListener('click', () => { field.value = ''; showPending(); field.focus(); });
    $('copy').addEventListener('click', async () => {
      const btn = $('copy');
      try { await navigator.clipboard.writeText(field.value); btn.textContent = 'Copied'; }
      catch { field.select(); btn.textContent = document.execCommand('copy') ? 'Copied' : 'Select and copy'; }
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    });
  });
</script>
</body>
</html>
